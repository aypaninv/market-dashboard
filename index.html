<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Dashboard</title>

<link rel="stylesheet" href="common-ui.css">
<script src="common-ui.js" defer></script>

<style>
* {
  font-family: "Courier New", monospace !important;
}

body {
  margin: 0;
  background: #f4f4f4;
}

.header {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #1e1e1e;
  padding: 6px 8px;
}

#globalTabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
}

.tab {
  padding: 6px 12px;
  cursor: pointer;
  background: #333;
  border-radius: 4px;
  color: white;
  font-size: 13px;
}

.tab.active {
  background: #007acc;
}

.search-wrapper {
  margin-left: auto;
  position: relative;
}

.search-icon {
  cursor: pointer;
  color: #ccc;
}

.search-input {
  position: absolute;
  right: 0;
  top: 24px;
  display: none;
}

.search-input input {
  padding: 4px 8px;
  width: 180px;
}
</style>
</head>

<body>

<div class="header">
  <div id="globalTabs"></div>

  <div class="search-wrapper">
    <span class="search-icon" onclick="toggleSearch()">🔍</span>
    <div class="search-input" id="searchBox">
      <input id="globalSearch" placeholder="Search…" onkeyup="applyGlobalSearch(this.value)">
    </div>
  </div>
</div>

<div id="app"></div>

<script>
let firstTabActivated = false;

window.registerTabs = function (fn) {
  fn(addTab);
};

function addTab(label, onClick) {
  const div = document.createElement("div");
  div.className = "tab";
  div.innerText = label;

  div.onclick = () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    div.classList.add("active");
    clearSearch();
    onClick();
  };

  document.getElementById("globalTabs").appendChild(div);

  if (!firstTabActivated) {
    firstTabActivated = true;
    div.click();
  }
}

function loadFeature(file) {
  return fetch(file)
    .then(r => r.text())
    .then(html => {
      document.getElementById("app").insertAdjacentHTML("beforeend", html);
      document.querySelectorAll("#app script").forEach(s => {
        const n = document.createElement("script");
        n.textContent = s.textContent;
        document.body.appendChild(n);
        s.remove();
      });
    });
}

function applyGlobalSearch(text) {
  const q = text.toLowerCase();
  const table = document.querySelector("#app table");
  if (!table) return;

  [...table.rows].slice(1).forEach(r => {
    r.style.display = r.innerText.toLowerCase().includes(q) ? "" : "none";
  });
}

function toggleSearch() {
  const box = document.getElementById("searchBox");
  box.style.display = box.style.display === "block" ? "none" : "block";
}

function clearSearch() {
  document.getElementById("globalSearch").value = "";
  applyGlobalSearch("");
  document.getElementById("searchBox").style.display = "none";
}

loadFeature("portfolio.html")
  .then(() => loadFeature("tfwatch.html"))
  .then(() => loadFeature("trend.html"))
  .then(() => loadFeature("sector.html"));
</script>

</body>
</html>

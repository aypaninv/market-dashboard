<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Technical Dashboard</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

header {
  display: flex;
  align-items: center;
  padding: 6px 10px;
  background: #222;
  color: white;
}

header h1 {
  margin: 0;
  font-size: 16px;
}

#tabs {
  margin-left: 20px;
  display: flex;
  gap: 8px;
}

#tabs button {
  background: #444;
  border: none;
  color: white;
  padding: 4px 8px;
  cursor: pointer;
}

#tabs button.active {
  background: #1e90ff;
}

#searchBox {
  margin-left: auto;
  padding: 4px 6px;
  font-size: 13px;
}

/* ===== FIX #2: isolate scroll per feature ===== */

#app {
  height: calc(100vh - 40px);
  position: relative;
}

#app > div {
  display: none;
  height: 100%;
}

</style>
</head>

<body>

<header>
  <h1>Market Technicals</h1>
  <div id="tabs"></div>
  <input
    id="searchBox"
    type="text"
    placeholder="Search…"
    oninput="applyGlobalSearch(this.value)"
  />
</header>

<div id="app"></div>

<script>
const app = document.getElementById("app");
const tabsDiv = document.getElementById("tabs");

/* ---------------- TAB REGISTRATION (ORIGINAL SAFE FLOW) ---------------- */

window.registerTabs = function (registerFn) {
  registerFn(function addTab(name, showFn) {
    const btn = document.createElement("button");
    btn.textContent = name;

    btn.onclick = () => {
      // activate tab
      document.querySelectorAll("#tabs button")
        .forEach(b => b.classList.remove("active"));
      btn.classList.add("active");

      // hide all features
      Array.from(app.children).forEach(d => d.style.display = "none");

      showFn();
    };

    tabsDiv.appendChild(btn);

    // auto-click first tab
    if (tabsDiv.children.length === 1) {
      btn.click();
    }
  });
};

/* ---------------- LOAD FEATURE HTML ---------------- */

function loadFeature(file) {
  return fetch(file)
    .then(r => r.text())
    .then(html => {
      const wrapper = document.createElement("div");
      wrapper.innerHTML = html;
      app.appendChild(wrapper);
    });
}

/* ================= FIX #1: WORKING GLOBAL SEARCH ================= */

function applyGlobalSearch(text) {
  const q = text.toLowerCase();

  const activeFeature = document.querySelector(
    "#portfolioFeature:not([style*='display: none'])," +
    "#tfwatchFeature:not([style*='display: none'])," +
    "#trendFeature:not([style*='display: none'])," +
    "#sectorFeature:not([style*='display: none'])"
  );

  if (!activeFeature) return;

  const table = activeFeature.querySelector("table");
  if (!table) return;

  const rows = table.querySelectorAll("tr");
  rows.forEach((row, i) => {
    if (i === 0) return;
    row.style.display =
      row.innerText.toLowerCase().includes(q) ? "" : "none";
  });
}

/* ---------------- INITIAL LOAD ORDER ---------------- */

loadFeature("portfolio.html")
  .then(() => loadFeature("tfwatch.html"))
  .then(() => loadFeature("trend.html"))
  .then(() => loadFeature("sector.html"));
</script>

</body>
</html>

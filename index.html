<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Dashboard</title>

<!-- ===== Common UI ===== -->
<link rel="stylesheet" href="common-ui.css">
<script src="common-ui.js" defer></script>

<style>
/* ---------- GLOBAL FONT ---------- */
* {
  font-family: "Courier New", monospace !important;
}

/* ---------- Base ---------- */
body {
  margin: 0;
  background: #f4f4f4;
}

/* ---------- Header ---------- */
.header {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #1e1e1e;
  padding: 6px 8px;
}

/* ---------- Tabs ---------- */
#globalTabs {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  -ms-overflow-style: none;
  scroll-snap-type: x mandatory;
  padding-bottom: 2px;
}

#globalTabs::-webkit-scrollbar {
  display: none;
}

.tab {
  padding: 8px 14px;
  cursor: pointer;
  background: #333;
  border-radius: 4px;
  white-space: nowrap;
  color: white;
  font-size: 13px;
  scroll-snap-align: start;
  min-width: 44px;
  text-align: center;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.tab.active {
  background: #007acc;
}

/* ---------- Mobile Header ---------- */
@media (max-width: 768px) {
  .header {
    padding: 4px;
    flex-wrap: nowrap;
  }
  
  .tab {
    padding: 10px 12px;
    font-size: 12px;
  }
  
  .search-input input {
    width: 150px;
  }
}

@media (max-width: 480px) {
  .tab {
    padding: 10px 10px;
    font-size: 11px;
  }
}

/* ---------- Search ---------- */
.search-wrapper {
  margin-left: auto;
  position: relative;
}

.search-icon {
  cursor: pointer;
  font-size: 16px;
  color: #ccc;
  user-select: none;
}

.search-input {
  position: absolute;
  right: 0;
  top: 24px;
  display: none;
}

.search-input input {
  padding: 4px 8px;
  font-size: 12px;
  width: 180px;
  border-radius: 4px;
  border: none;
  outline: none;
}
</style>
</head>

<body>

<!-- ===================== HEADER ===================== -->
<div class="header">
  <div id="globalTabs"></div>

  <div class="search-wrapper">
    <span class="search-icon" onclick="toggleSearch()">🔍</span>
    <div class="search-input" id="searchBox">
      <input
        type="text"
        id="globalSearch"
        placeholder="Search…"
        onkeyup="debouncedSearch(this.value)"
      />
    </div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app"></div>

<script>
/* =========================================================
   DEBOUNCE UTILITY
   ========================================================= */

function debounce(fn, delay) {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), delay);
  };
}

const debouncedSearch = debounce(applyGlobalSearch, 150);

/* =========================================================
   GLOBAL TAB MANAGEMENT
   ========================================================= */

const globalTabs = document.getElementById("globalTabs");
let firstTabActivated = false;

/* ---------- Hide all features ---------- */
function hideAllFeatures() {
  [
    "portfolioFeature",
    "tfwatchFeature",
    "tfcoreFeature",
    "trendFeature"
  ].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = "none";
  });
}

/* ---------- Tab registration ---------- */
window.registerTabs = function (tabBuilderFn) {
  tabBuilderFn(addGlobalTab);
};

function addGlobalTab(label, onClick) {
  const div = document.createElement("div");
  div.className = "tab";
  div.innerText = label;

  div.onclick = () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    div.classList.add("active");

    clearSearch();
    hideAllFeatures();
    onClick();
  };

  globalTabs.appendChild(div);

  if (!firstTabActivated) {
    firstTabActivated = true;
    div.click();
  }
}

/* =========================================================
   FEATURE LOADER
   ========================================================= */

function loadFeature(file) {
  return fetch(file)
    .then(r => r.text())
    .then(html => {
      const app = document.getElementById("app");
      app.insertAdjacentHTML("beforeend", html);

      /* Re-run inline scripts safely */
      app.querySelectorAll("script").forEach(oldScript => {
        const s = document.createElement("script");
        s.textContent = oldScript.textContent;
        document.body.appendChild(s);
        oldScript.remove();
      });
    });
}

/* =========================================================
   GLOBAL SEARCH
   ========================================================= */

function applyGlobalSearch(text) {
  const q = text.toLowerCase();

  const activeFeature = document.querySelector(
    "#portfolioFeature:not([style*='display: none'])," +
    "#tfwatchFeature:not([style*='display: none'])," +
    "#tfcoreFeature:not([style*='display: none'])," +
    "#trendFeature:not([style*='display: none'])"
  );

  if (!activeFeature) return;

  const table = activeFeature.querySelector("table");
  if (!table) return;

  const rows = table.querySelectorAll("tr");
  rows.forEach((row, i) => {
    if (i === 0) return;
    row.style.display =
      row.innerText.toLowerCase().includes(q) ? "" : "none";
  });
}

/* ---------- Search toggle ---------- */
function toggleSearch() {
  const box = document.getElementById("searchBox");
  const input = document.getElementById("globalSearch");

  box.style.display = box.style.display === "block" ? "none" : "block";
  if (box.style.display === "block") input.focus();
}

function clearSearch() {
  document.getElementById("globalSearch").value = "";
  applyGlobalSearch("");
  document.getElementById("searchBox").style.display = "none";
}

/* Close search on ESC */
document.addEventListener("keydown", e => {
  if (e.key === "Escape") clearSearch();
});

document.addEventListener("click", e => {
  if (!e.target.closest(".search-wrapper")) {
    document.getElementById("searchBox").style.display = "none";
  }
});

/* =========================================================
   LOAD FEATURES (ORDER MATTERS)
   ========================================================= */

loadFeature("portfolio.html")
  .then(() => loadFeature("tfwatch.html"))
  .then(() => loadFeature("tfcore.html"))
  .then(() => loadFeature("trend.html"));
</script>

</body>
</html>

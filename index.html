<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Dashboard</title>

<!-- ===== Common UI ===== -->
<link rel="stylesheet" href="common-ui.css">
<script src="common-ui.js" defer></script>

<style>
/* ---------- GLOBAL FONT ---------- */
* {
  font-family: "Courier New", monospace !important;
}

/* ---------- Base ---------- */
body {
  margin: 0;
  background: var(--bg);
}

/* ---------- Header ---------- */
.header {
  display: flex;
  align-items: center;
  gap: 10px;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--panel) 92%, #0a2036), color-mix(in srgb, var(--panel) 85%, #0f2c4a));
  border-bottom: 1px solid var(--grid);
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.16);
  padding: 7px 8px;
  position: sticky;
  top: 0;
  z-index: 20;
  backdrop-filter: blur(8px);
}

/* ---------- Tabs ---------- */
#globalTabs {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  -ms-overflow-style: none;
  scroll-snap-type: x mandatory;
  padding-bottom: 2px;
}

#globalTabs::-webkit-scrollbar {
  display: none;
}

.tab {
  padding: 8px 14px;
  cursor: pointer;
  background: color-mix(in srgb, var(--panel) 65%, #1d3348);
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--grid) 68%, transparent);
  white-space: nowrap;
  color: var(--text);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.25px;
  scroll-snap-align: start;
  min-width: 44px;
  text-align: center;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.16s ease, box-shadow 0.16s ease, background-color 0.16s ease;
}

.tab.active {
  background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 60%, #ffffff 40%));
  color: #ffffff;
  box-shadow: 0 6px 14px color-mix(in srgb, var(--accent) 35%, transparent);
}

.tab:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 14px rgba(0, 0, 0, 0.16);
}

/* ---------- Mobile Header ---------- */
@media (max-width: 768px) {
  .header {
    padding: 4px;
    flex-wrap: nowrap;
  }
  
  .tab {
    padding: 10px 12px;
    font-size: 12px;
  }
  
  .filter-overlay {
    right: auto;
    left: 0;
  }

  .filter-dialog {
    width: min(92vw, 420px);
    max-height: 65vh;
  }
}

@media (max-width: 480px) {
  .tab {
    padding: 10px 10px;
    font-size: 11px;
  }
}

/* ---------- Filter ---------- */
.filter-wrapper {
  margin-left: auto;
  position: relative;
}

.filter-icon {
  cursor: pointer;
  font-size: 14px;
  color: var(--text);
  user-select: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 58px;
  height: 30px;
  padding: 0 10px;
  border-radius: 999px;
  border: 1px solid var(--grid);
  background: color-mix(in srgb, var(--panel) 88%, transparent);
  transition: transform 0.16s ease, background-color 0.16s ease;
}

.filter-icon:hover {
  transform: scale(1.05);
  background: color-mix(in srgb, var(--accent) 16%, var(--panel));
}

.filter-overlay {
  display: none;
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  inset: auto 0 auto auto;
  background: transparent;
  z-index: 1100;
}

.filter-dialog {
  width: min(92vw, 430px);
  max-height: 68vh;
  overflow: auto;
  padding: 10px;
  border: 1px solid var(--grid);
  border-radius: 12px;
  background: var(--panel);
  color: var(--text);
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.24);
}

.filter-titlebar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  font-weight: 700;
}

.filter-metric-grid {
  display: grid;
  grid-template-columns: 112px 24px 78px 14px 78px;
  gap: 6px;
  align-items: center;
  margin-bottom: 6px;
}

.filter-metric-grid input {
  width: 100%;
  box-sizing: border-box;
  padding: 4px 6px;
  font-size: 12px;
  border: 1px solid var(--grid);
  border-radius: 6px;
  background: var(--panel);
  color: var(--text);
}

.filter-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 12px;
}

.filter-actions button,
.filter-close-btn {
  border: 1px solid var(--grid);
  background: color-mix(in srgb, var(--panel) 88%, transparent);
  color: var(--text);
  border-radius: 8px;
  padding: 6px 10px;
  cursor: pointer;
}

.filter-actions button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

#app {
  animation: appFade 0.35s ease;
}

@keyframes appFade {
  from {
    opacity: 0;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
</head>

<body>

<!-- ===================== HEADER ===================== -->
<div class="header">
  <div id="globalTabs"></div>

  <div class="filter-wrapper">
    <span class="filter-icon" onclick="openFilterDialog()">Filter</span>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app"></div>

<div id="filterOverlay" class="filter-overlay">
  <div class="filter-dialog" role="dialog" aria-modal="true" aria-labelledby="filterTitle">
    <div class="filter-titlebar">
      <div id="filterTitle">Filter Metrics</div>
      <button type="button" class="filter-close-btn" onclick="closeFilterDialog()">Close</button>
    </div>
    <div id="filterRows"></div>
    <div class="filter-actions">
      <button type="button" onclick="clearMetricFilters()">Clear</button>
      <button type="button" class="primary" onclick="applyMetricFilters()">Apply</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   SHARED TABLE UTILITIES
   ========================================================= */

window.createCustomSorter = function (column = "W_BO") {
  return (a, b) => {
    const x = parseFloat(a?.[column]);
    const y = parseFloat(b?.[column]);

    if (isNaN(x) && isNaN(y)) return 0;
    if (isNaN(x)) return 1;
    if (isNaN(y)) return -1;

    if (x > 0 && y > 0) return x - y;
    if (x > 0) return -1;
    if (y > 0) return 1;

    if (x === 0 && y === 0) return 0;
    if (x === 0) return -1;
    if (y === 0) return 1;

    // Negative values after zero, closest to zero first.
    return y - x;
  };
};

window.sortRowsByCustomDefault = function (rows, column = "W_BO") {
  return [...rows].sort(window.createCustomSorter(column));
};

window.compareCellValues = function (aVal, bVal, asc) {
  const aNum = parseFloat(aVal);
  const bNum = parseFloat(bVal);
  const bothNumeric = Number.isFinite(aNum) && Number.isFinite(bNum);

  if (bothNumeric) {
    return asc ? aNum - bNum : bNum - aNum;
  }

  const aText = String(aVal ?? "");
  const bText = String(bVal ?? "");
  return asc ? aText.localeCompare(bText) : bText.localeCompare(aText);
};

window.sortRowsByColumn = function (rows, column, asc) {
  return [...rows].sort((a, b) => window.compareCellValues(a?.[column], b?.[column], asc));
};

const SECTOR_SUMMARY_CSV = "technical_sector_data.csv";
let sectorRsiLookup = null;
let sectorRsiLookupPromise = null;

function parseSimpleCsv(text) {
  const lines = String(text || "").trim().split("\n");
  if (lines.length < 2) return [];
  const headers = lines[0].split(",").map(h => h.trim());
  return lines.slice(1).map(line => {
    const values = line.split(",");
    const row = {};
    headers.forEach((h, i) => {
      row[h] = (values[i] ?? "").trim();
    });
    return row;
  });
}

window.ensureSectorRsiMapLoaded = function () {
  if (sectorRsiLookup) return Promise.resolve(sectorRsiLookup);
  if (sectorRsiLookupPromise) return sectorRsiLookupPromise;

  sectorRsiLookupPromise = fetch(SECTOR_SUMMARY_CSV)
    .then(r => {
      if (!r.ok) throw new Error(String(r.status));
      return r.text();
    })
    .then(text => {
      const rows = parseSimpleCsv(text);
      const lookup = {};
      rows.forEach(r => {
        const sector = String(r.Sector || "").trim();
        if (!sector) return;
        lookup[sector] = {
          W_RSI: String(r.W_RSI ?? "").trim(),
          M_RSI: String(r.M_RSI ?? "").trim(),
        };
      });
      sectorRsiLookup = lookup;
      return sectorRsiLookup;
    })
    .catch(() => {
      sectorRsiLookup = {};
      return sectorRsiLookup;
    });

  return sectorRsiLookupPromise;
};

window.attachSectorRsiColumns = function (rows) {
  if (!Array.isArray(rows)) return [];
  return rows.map(row => {
    const sector = String(row?.Sector || "").trim();
    const metrics = sectorRsiLookup?.[sector] || {};
    return {
      ...row,
      W_RSI: String(metrics.W_RSI ?? "").trim(),
      M_RSI: String(metrics.M_RSI ?? "").trim(),
    };
  });
};

window.applyCommonCellClasses = function (td, column, value, options = {}) {
  const num = parseFloat(value);
  const isNum = !isNaN(num);

  const chgColumns = options.chgColumns || ["D_CHG", "W_CHG", "M_CHG"];
  const crossColumns = options.crossColumns || [];
  const profitColumns = options.profitColumns || ["PNL", "LT_Pert"];
  const slColumns = options.slColumns || ["W_SL", "M_SL", "W_PSL", "M_PSL"];

  if (["DD_52W", "DD_ATH"].includes(column) && isNum && num < -15) td.classList.add("orange");

  if (slColumns.includes(column) && isNum) {
    if (num < 0) {
      td.classList.add("red");
    } else if (num > 0 && num < 10) {
      td.classList.add("green");
    } else if (num >= 10 && num < 20) {
      td.classList.add("subtle_orange");
    } else if (num >= 20) {
      td.classList.add("orange");
    }
  }

  if (chgColumns.includes(column) && isNum) {
    if (num < 0) {
      td.classList.add("red");
    } else if (num > 0 && num < 10) {
      td.classList.add("green");
    } else if (num >= 10 && num < 20) {
      td.classList.add("subtle_orange");
    } else if (num >= 20) {
      td.classList.add("orange");
    }
  }

  if (crossColumns.includes(column) && isNum && num < 0) {
    td.classList.add("red");
  } else if (crossColumns.includes(column) && isNum) {
    td.classList.add("green");
  }

  if (["D_BO", "W_BO", "M_BO"].includes(column) && isNum && num >= 0) {
    td.classList.add("green");
  }

  if (profitColumns.includes(column) && isNum && num > 4) {
    td.classList.add("green");
  } else if (profitColumns.includes(column) && isNum && num < 0) {
    td.classList.add("red");
  }

  // W_SL/M_SL are styled by slColumns thresholds above.

};

/* =========================================================
   GLOBAL TAB MANAGEMENT
   ========================================================= */

const globalTabs = document.getElementById("globalTabs");
let firstTabActivated = false;

/* ---------- Hide all features ---------- */
function hideAllFeatures() {
  [
    "portfolioFeature",
    "tfwatchFeature",
    "tfcoreFeature",
    "tfstudyFeature",
    "tfstage2Feature",
    "sectorFeature"
  ].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = "none";
  });
}

/* ---------- Tab registration ---------- */
window.registerTabs = function (tabBuilderFn) {
  tabBuilderFn(addGlobalTab);
};

function addGlobalTab(label, onClick) {
  const div = document.createElement("div");
  div.className = "tab";
  div.innerText = label;

  div.onclick = () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    div.classList.add("active");

    closeFilterDialog();
    hideAllFeatures();
    onClick();
    setTimeout(() => {
      const activeFeature = getActiveFeatureElement();
      if (activeFeature) applyFiltersForFeature(activeFeature);
    }, 0);
  };

  globalTabs.appendChild(div);

  if (!firstTabActivated) {
    firstTabActivated = true;
    div.click();
  }
}

/* =========================================================
   FEATURE LOADER
   ========================================================= */

function loadFeature(file) {
  return fetch(file)
    .then(r => r.text())
    .then(html => {
      const app = document.getElementById("app");
      app.insertAdjacentHTML("beforeend", html);

      /* Re-run inline scripts safely */
      app.querySelectorAll("script").forEach(oldScript => {
        const s = document.createElement("script");
        s.textContent = oldScript.textContent;
        document.body.appendChild(s);
        oldScript.remove();
      });
    });
}

/* =========================================================
   DYNAMIC FILTER
   ========================================================= */

const FEATURE_IDS = [
  "portfolioFeature",
  "tfwatchFeature",
  "tfcoreFeature",
  "tfstudyFeature",
  "tfstage2Feature",
  "sectorFeature",
];

const FILTER_EXCLUDED_COLUMNS = new Set([
  "Symbol", "Chart", "Folio", "Category", "Sector", "MarketCap", "Notes",
]);

const FILTER_STORAGE_KEY = "metricFiltersByFeatureV1";
const filterStateByFeature = (() => {
  try {
    return JSON.parse(localStorage.getItem(FILTER_STORAGE_KEY) || "{}") || {};
  } catch (_) {
    return {};
  }
})();

function persistFilterState() {
  try {
    localStorage.setItem(FILTER_STORAGE_KEY, JSON.stringify(filterStateByFeature));
  } catch (_) {
    // Ignore storage errors.
  }
}

function getActiveFeatureElement() {
  for (const id of FEATURE_IDS) {
    const el = document.getElementById(id);
    if (!el) continue;
    const style = window.getComputedStyle(el);
    if (style.display !== "none" && style.visibility !== "hidden") return el;
  }
  return null;
}

function getVisibleFeatureTables(featureEl) {
  return [...featureEl.querySelectorAll("table")].filter(t => t.offsetParent !== null);
}

function getTableHeaderMap(table) {
  const headerRow = table.querySelector("tr");
  if (!headerRow) return [];
  const headers = [...headerRow.querySelectorAll("th")].map(th => String(th.textContent || "").trim());
  return headers;
}

function detectNumericMetrics(featureEl) {
  const metrics = [];
  const seen = new Set();
  const tables = getVisibleFeatureTables(featureEl);

  tables.forEach(table => {
    const headers = getTableHeaderMap(table);
    const rows = [...table.querySelectorAll("tr")].slice(1);

    headers.forEach((header, colIdx) => {
      if (!header || FILTER_EXCLUDED_COLUMNS.has(header) || seen.has(header)) return;

      const hasNumeric = rows.some(row => {
        if (row.querySelector("th")) return false;
        const cells = [...row.querySelectorAll("td")];
        if (!cells[colIdx]) return false;
        const text = String(cells[colIdx].innerText || "").trim();
        if (!text || text === "-") return false;
        const v = parseFloat(text.replace(/,/g, ""));
        return Number.isFinite(v);
      });

      if (hasNumeric) {
        metrics.push(header);
        seen.add(header);
      }
    });
  });

  return metrics;
}

function buildFilterRows(featureId, metrics) {
  const host = document.getElementById("filterRows");
  host.innerHTML = "";
  const saved = filterStateByFeature[featureId] || {};

  if (!metrics.length) {
    const msg = document.createElement("div");
    msg.textContent = "No numeric metrics available for this tab.";
    host.appendChild(msg);
    return;
  }

  metrics.forEach(metric => {
    const row = document.createElement("div");
    row.className = "filter-metric-grid";
    row.setAttribute("data-metric", metric);

    const name = document.createElement("div");
    name.textContent = metric;

    const gte = document.createElement("div");
    gte.textContent = ">=";

    const minInput = document.createElement("input");
    minInput.type = "number";
    minInput.step = "any";
    minInput.placeholder = "value";
    minInput.value = saved[metric]?.min ?? "";

    const lt = document.createElement("div");
    lt.textContent = "<";

    const maxInput = document.createElement("input");
    maxInput.type = "number";
    maxInput.step = "any";
    maxInput.placeholder = "value";
    maxInput.value = saved[metric]?.max ?? "";

    row.appendChild(name);
    row.appendChild(gte);
    row.appendChild(minInput);
    row.appendChild(lt);
    row.appendChild(maxInput);
    host.appendChild(row);
  });
}

function collectDialogFilters() {
  const filters = {};
  const rows = [...document.querySelectorAll("#filterRows .filter-metric-grid")];
  rows.forEach(row => {
    const metric = row.getAttribute("data-metric");
    const inputs = row.querySelectorAll("input");
    const minRaw = String(inputs[0]?.value ?? "").trim();
    const maxRaw = String(inputs[1]?.value ?? "").trim();
    if (!metric || (!minRaw && !maxRaw)) return;
    filters[metric] = { min: minRaw, max: maxRaw };
  });
  return filters;
}

function tablePassesFilters(table, row, filters) {
  const headers = getTableHeaderMap(table);
  const cells = [...row.querySelectorAll("td")];

  for (const metric of Object.keys(filters)) {
    const cond = filters[metric];
    const idx = headers.indexOf(metric);
    if (idx < 0 || !cells[idx]) continue;

    const text = String(cells[idx].innerText || "").trim();
    const value = parseFloat(text.replace(/,/g, ""));
    if (!Number.isFinite(value)) return false;

    if (cond.min !== "" && value < parseFloat(cond.min)) return false;
    if (cond.max !== "" && value >= parseFloat(cond.max)) return false;
  }

  return true;
}

function applyFiltersForFeature(featureEl) {
  if (!featureEl) return;
  const featureId = featureEl.id;
  const filters = filterStateByFeature[featureId] || {};
  const hasActiveFilters = Object.keys(filters).length > 0;

  const tables = getVisibleFeatureTables(featureEl);
  tables.forEach(table => {
    const rows = [...table.querySelectorAll("tr")].slice(1);
    rows.forEach(row => {
      if (row.querySelector("th")) return;
      row.style.display = hasActiveFilters && !tablePassesFilters(table, row, filters) ? "none" : "";
    });
  });
}

window.openFilterDialog = function () {
  const activeFeature = getActiveFeatureElement();
  if (!activeFeature) return;
  const metrics = detectNumericMetrics(activeFeature);
  buildFilterRows(activeFeature.id, metrics);
  document.getElementById("filterOverlay").style.display = "block";
};

window.closeFilterDialog = function () {
  document.getElementById("filterOverlay").style.display = "none";
};

window.applyMetricFilters = function () {
  const activeFeature = getActiveFeatureElement();
  if (!activeFeature) return;
  filterStateByFeature[activeFeature.id] = collectDialogFilters();
  persistFilterState();
  applyFiltersForFeature(activeFeature);
  closeFilterDialog();
};

window.clearMetricFilters = function () {
  const activeFeature = getActiveFeatureElement();
  if (!activeFeature) return;
  filterStateByFeature[activeFeature.id] = {};
  persistFilterState();
  const inputs = document.querySelectorAll("#filterRows input");
  inputs.forEach(input => { input.value = ""; });
  applyFiltersForFeature(activeFeature);
};

let filterApplyTimer;
new MutationObserver(() => {
  clearTimeout(filterApplyTimer);
  filterApplyTimer = setTimeout(() => {
    const activeFeature = getActiveFeatureElement();
    if (activeFeature) applyFiltersForFeature(activeFeature);
  }, 60);
}).observe(document.getElementById("app"), { childList: true, subtree: true });

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeFilterDialog();
});

document.addEventListener("click", e => {
  const wrapper = document.querySelector(".filter-wrapper");
  if (!wrapper) return;
  if (!wrapper.contains(e.target)) closeFilterDialog();
});

/* =========================================================
   LOAD FEATURES (ORDER MATTERS)
   ========================================================= */

loadFeature("portfolio.html")
  .then(() => loadFeature("tfwatch.html"))
  .then(() => loadFeature("tfcore.html"))
  .then(() => loadFeature("tfstudy.html"))
  .then(() => loadFeature("tfstage2.html"))
  .then(() => loadFeature("sector.html"));
</script>

</body>
</html>

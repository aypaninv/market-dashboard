<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Dashboard</title>

<!-- ===== Common UI ===== -->
<link rel="stylesheet" href="common-ui.css">
<script src="common-ui.js" defer></script>

<style>
/* ---------- GLOBAL FONT ---------- */
* {
  font-family: "Courier New", monospace !important;
}

/* ---------- Base ---------- */
body {
  margin: 0;
  background: var(--bg);
}

/* ---------- Header ---------- */
.header {
  display: flex;
  align-items: center;
  gap: 10px;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--panel) 92%, #0a2036), color-mix(in srgb, var(--panel) 85%, #0f2c4a));
  border-bottom: 1px solid var(--grid);
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.16);
  padding: 7px 8px;
  position: sticky;
  top: 0;
  z-index: 20;
  backdrop-filter: blur(8px);
}

/* ---------- Tabs ---------- */
#globalTabs {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  -ms-overflow-style: none;
  scroll-snap-type: x mandatory;
  padding-bottom: 2px;
}

#globalTabs::-webkit-scrollbar {
  display: none;
}

.tab {
  padding: 8px 14px;
  cursor: pointer;
  background: color-mix(in srgb, var(--panel) 65%, #1d3348);
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--grid) 68%, transparent);
  white-space: nowrap;
  color: var(--text);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.25px;
  scroll-snap-align: start;
  min-width: 44px;
  text-align: center;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.16s ease, box-shadow 0.16s ease, background-color 0.16s ease;
}

.tab.active {
  background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 60%, #ffffff 40%));
  color: #ffffff;
  box-shadow: 0 6px 14px color-mix(in srgb, var(--accent) 35%, transparent);
}

.tab:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 14px rgba(0, 0, 0, 0.16);
}

/* ---------- Mobile Header ---------- */
@media (max-width: 768px) {
  .header {
    padding: 4px;
    flex-wrap: nowrap;
  }
  
  .tab {
    padding: 10px 12px;
    font-size: 12px;
  }
  
  .search-input input {
    width: 150px;
  }
}

@media (max-width: 480px) {
  .tab {
    padding: 10px 10px;
    font-size: 11px;
  }
}

/* ---------- Search ---------- */
.search-wrapper {
  margin-left: auto;
  position: relative;
}

.search-icon {
  cursor: pointer;
  font-size: 14px;
  color: var(--text);
  user-select: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 1px solid var(--grid);
  background: color-mix(in srgb, var(--panel) 88%, transparent);
  transition: transform 0.16s ease, background-color 0.16s ease;
}

.search-icon:hover {
  transform: scale(1.05);
  background: color-mix(in srgb, var(--accent) 16%, var(--panel));
}

.search-input {
  position: absolute;
  right: 0;
  top: 24px;
  display: none;
}

.search-input input {
  padding: 7px 10px;
  font-size: 12px;
  width: 200px;
  border-radius: 8px;
  border: 1px solid var(--grid);
  background: var(--panel);
  color: var(--text);
  outline: none;
  box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
}

.search-input input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 24%, transparent);
}

#app {
  animation: appFade 0.35s ease;
}

@keyframes appFade {
  from {
    opacity: 0;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
</head>

<body>

<!-- ===================== HEADER ===================== -->
<div class="header">
  <div id="globalTabs"></div>

  <div class="search-wrapper">
    <span class="search-icon" onclick="toggleSearch()">🔍</span>
    <div class="search-input" id="searchBox">
      <input
        type="text"
        id="globalSearch"
        placeholder="Search…"
        onkeyup="debouncedSearch(this.value)"
      />
    </div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app"></div>

<script>
/* =========================================================
   DEBOUNCE UTILITY
   ========================================================= */

function debounce(fn, delay) {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), delay);
  };
}

window.debouncedSearch = debounce(applyGlobalSearch, 150);

/* =========================================================
   SHARED TABLE UTILITIES
   ========================================================= */

window.createCustomSorter = function (column = "W_BO") {
  return (a, b) => {
    const x = parseFloat(a?.[column]);
    const y = parseFloat(b?.[column]);

    if (isNaN(x) && isNaN(y)) return 0;
    if (isNaN(x)) return 1;
    if (isNaN(y)) return -1;

    if (x > 0 && y > 0) return x - y;
    if (x > 0) return -1;
    if (y > 0) return 1;

    if (x === 0 && y === 0) return 0;
    if (x === 0) return -1;
    if (y === 0) return 1;

    // Negative values after zero, closest to zero first.
    return y - x;
  };
};

window.sortRowsByCustomDefault = function (rows, column = "W_BO") {
  return [...rows].sort(window.createCustomSorter(column));
};

window.compareCellValues = function (aVal, bVal, asc) {
  const aNum = parseFloat(aVal);
  const bNum = parseFloat(bVal);
  const bothNumeric = Number.isFinite(aNum) && Number.isFinite(bNum);

  if (bothNumeric) {
    return asc ? aNum - bNum : bNum - aNum;
  }

  const aText = String(aVal ?? "");
  const bText = String(bVal ?? "");
  return asc ? aText.localeCompare(bText) : bText.localeCompare(aText);
};

window.sortRowsByColumn = function (rows, column, asc) {
  return [...rows].sort((a, b) => window.compareCellValues(a?.[column], b?.[column], asc));
};

window.applyCommonCellClasses = function (td, column, value, options = {}) {
  const num = parseFloat(value);
  const isNum = !isNaN(num);

  const chgColumns = options.chgColumns || ["D_CHG", "W_CHG", "M_CHG"];
  const crossColumns = options.crossColumns || [];
  const profitColumns = options.profitColumns || ["PNL", "LT_Pert"];
  const slColumns = options.slColumns || ["W_SL", "M_SL", "W_PSL", "M_PSL"];

  if (["DD_52W", "DD_ATH"].includes(column) && isNum && num < -15) td.classList.add("orange");

  if (slColumns.includes(column) && isNum) {
    if (num < 0) {
      td.classList.add("red");
    } else if (num > 0 && num < 10) {
      td.classList.add("green");
    } else if (num >= 10 && num < 20) {
      td.classList.add("subtle_orange");
    } else if (num >= 20) {
      td.classList.add("orange");
    }
  }

  if (chgColumns.includes(column) && isNum) {
    if (num < 0) {
      td.classList.add("red");
    } else if (num > 0 && num < 10) {
      td.classList.add("green");
    } else if (num >= 10 && num < 20) {
      td.classList.add("subtle_orange");
    } else if (num >= 20) {
      td.classList.add("orange");
    }
  }

  if (crossColumns.includes(column) && isNum && num < 0) {
    td.classList.add("red");
  } else if (crossColumns.includes(column) && isNum) {
    td.classList.add("green");
  }

  if (["D_BO", "W_BO", "M_BO"].includes(column) && isNum && num >= 0) {
    td.classList.add("green");
  }

  if (profitColumns.includes(column) && isNum && num > 4) {
    td.classList.add("green");
  } else if (profitColumns.includes(column) && isNum && num < 0) {
    td.classList.add("red");
  }

  // W_SL/M_SL are styled by slColumns thresholds above.

};

/* =========================================================
   GLOBAL TAB MANAGEMENT
   ========================================================= */

const globalTabs = document.getElementById("globalTabs");
let firstTabActivated = false;

/* ---------- Hide all features ---------- */
function hideAllFeatures() {
  [
    "portfolioFeature",
    "tfwatchFeature",
    "tfcoreFeature",
    "tfstudyFeature",
    "tfstage2Feature"
  ].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = "none";
  });
}

/* ---------- Tab registration ---------- */
window.registerTabs = function (tabBuilderFn) {
  tabBuilderFn(addGlobalTab);
};

function addGlobalTab(label, onClick) {
  const div = document.createElement("div");
  div.className = "tab";
  div.innerText = label;

  div.onclick = () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    div.classList.add("active");

    clearSearch();
    hideAllFeatures();
    onClick();
  };

  globalTabs.appendChild(div);

  if (!firstTabActivated) {
    firstTabActivated = true;
    div.click();
  }
}

/* =========================================================
   FEATURE LOADER
   ========================================================= */

function loadFeature(file) {
  return fetch(file)
    .then(r => r.text())
    .then(html => {
      const app = document.getElementById("app");
      app.insertAdjacentHTML("beforeend", html);

      /* Re-run inline scripts safely */
      app.querySelectorAll("script").forEach(oldScript => {
        const s = document.createElement("script");
        s.textContent = oldScript.textContent;
        document.body.appendChild(s);
        oldScript.remove();
      });
    });
}

/* =========================================================
   GLOBAL SEARCH
   ========================================================= */

function applyGlobalSearch(text) {
  const q = text.toLowerCase();

  const activeFeature = document.querySelector(
    "#portfolioFeature:not([style*='display: none'])," +
    "#tfwatchFeature:not([style*='display: none'])," +
    "#tfcoreFeature:not([style*='display: none'])," +
    "#tfstudyFeature:not([style*='display: none'])," +
    "#tfstage2Feature:not([style*='display: none'])"
  );

  if (!activeFeature) return;

  const tables = activeFeature.querySelectorAll("table");
  if (!tables.length) return;

  tables.forEach(table => {
    const rows = table.querySelectorAll("tr");
    rows.forEach(row => {
      if (row.querySelector("th")) return;
      row.style.display =
        row.innerText.toLowerCase().includes(q) ? "" : "none";
    });
  });
}

/* ---------- Search toggle ---------- */
function toggleSearch() {
  const box = document.getElementById("searchBox");
  const input = document.getElementById("globalSearch");

  box.style.display = box.style.display === "block" ? "none" : "block";
  if (box.style.display === "block") input.focus();
}

function clearSearch() {
  document.getElementById("globalSearch").value = "";
  applyGlobalSearch("");
  document.getElementById("searchBox").style.display = "none";
}

/* Close search on ESC */
document.addEventListener("keydown", e => {
  if (e.key === "Escape") clearSearch();
});

document.addEventListener("click", e => {
  if (!e.target.closest(".search-wrapper")) {
    document.getElementById("searchBox").style.display = "none";
  }
});

/* =========================================================
   LOAD FEATURES (ORDER MATTERS)
   ========================================================= */

loadFeature("portfolio.html")
  .then(() => loadFeature("tfwatch.html"))
  .then(() => loadFeature("tfcore.html"))
  .then(() => loadFeature("tfstudy.html"))
  .then(() => loadFeature("tfstage2.html"));
</script>

</body>
</html>

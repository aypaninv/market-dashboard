<!-- ===================== FVG FEATURE ===================== -->

<div id="fvgFeature" style="display:none">
  <div class="update-time" id="updateTime_fvg"></div>
  <div class="content">
    <div id="fvgStatus" style="font-size:11px;color:var(--text-muted, #7a889a);margin-bottom:8px;"></div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;">
      <label style="font-size:12px;">Gap % Min
        <select id="fvgMinGap" style="margin-left:4px;">
          <option value="0.2">0.2%</option>
          <option value="0.4" selected>0.4%</option>
          <option value="0.6">0.6%</option>
          <option value="1.0">1.0%</option>
        </select>
      </label>

      <label style="font-size:12px;">Max Age (weeks)
        <select id="fvgMaxAge" style="margin-left:4px;">
          <option value="8">8</option>
          <option value="12" selected>12</option>
          <option value="20">20</option>
          <option value="52">52</option>
        </select>
      </label>

      <button id="fvgApplyBtn" type="button" style="height:24px;padding:0 10px;border:1px solid var(--grid);border-radius:6px;background:transparent;color:var(--text);font-size:11px;font-weight:700;cursor:pointer;">Apply</button>
    </div>

    <div id="fvgSections"></div>
  </div>
</div>

<script>
const CSV_FVG = "files/tfstage2.csv";
const OHLC_WEEKLY_FVG = "nse_data/nse_weekly.csv";

const COLS_FVG = [
  "Symbol", "Chart", "Folio", "FVG_Type", "FVG_Low", "FVG_High", "W_Close", "GapPct", "ZoneAge", "Notes"
];

const HEADER_LABELS_FVG = {
  FVG_Type: "Type",
  FVG_Low: "FVG_Low",
  FVG_High: "FVG_High",
  W_Close: "W_Close",
  GapPct: "Gap%",
  ZoneAge: "AgeW",
};

let rawFVG = [];
let weeklyBySymbolFVG = {};
let fvgSections = { High: [], Low: [] };
let fvgSortState = {};
let fvgSectionOpenState = { High: true, Low: false };
let fvgColWidths = {};

function normalizeSymbolFVG(symbol) {
  return String(symbol || "")
    .trim()
    .toUpperCase()
    .replace(/\.NS$/, "")
    .replace(/\.NSE$/, "");
}

function parseCsvSimpleFVG(text) {
  const lines = text.trim().split("\n");
  const headers = lines[0].split(",").map(h => h.trim());
  return lines.slice(1).map(line => {
    const vals = line.split(",");
    const obj = {};
    headers.forEach((h, i) => { obj[h] = (vals[i] || "").trim(); });
    obj.Symbol = normalizeSymbolFVG(obj.Symbol);
    return obj;
  });
}

function parseWeeklyCsvBySymbolFVG(text) {
  const lines = text.trim().split("\n");
  const headers = lines[0].split(",").map(h => h.trim());
  const bySymbol = {};

  for (let i = 1; i < lines.length; i++) {
    const vals = lines[i].split(",");
    const obj = {};
    headers.forEach((h, j) => { obj[h] = (vals[j] || "").trim(); });
    const sym = normalizeSymbolFVG(obj.Symbol);
    if (!sym) continue;
    if (!bySymbol[sym]) bySymbol[sym] = [];
    bySymbol[sym].push(obj);
  }

  Object.keys(bySymbol).forEach(sym => {
    bySymbol[sym].sort((a, b) => String(a.Date || a.Datetime || "").localeCompare(String(b.Date || b.Datetime || "")));
  });

  return bySymbol;
}

function computeActiveFvgZonesForWeekly(rows, minGapPct) {
  if (!Array.isArray(rows) || rows.length < 3) return [];
  const zones = [];

  for (let i = 2; i < rows.length; i++) {
    const c1 = rows[i - 2];
    const c2 = rows[i - 1];
    const c3 = rows[i];

    const h1 = +c1.High;
    const l1 = +c1.Low;
    const o2 = +c2.Open;
    const h2 = +c2.High;
    const l2 = +c2.Low;
    const c2Close = +c2.Close;
    const h3 = +c3.High;
    const l3 = +c3.Low;

    if (![h1, l1, o2, h2, l2, c2Close, h3, l3].every(Number.isFinite)) continue;

    const c2Range = h2 - l2;
    if (!(c2Range > 0)) continue;

    const c2BodyRatio = Math.abs(c2Close - o2) / c2Range;
    if (c2BodyRatio < 0.30) continue;

    const minGap = Math.max(0.0001, Math.abs(c2Close) * (minGapPct / 100));

    const bullGap = l3 - h1;
    const isBull = bullGap >= minGap && c2Close > o2 && h2 > h1;

    const bearGap = l1 - h3;
    const isBear = bearGap >= minGap && c2Close < o2 && l2 < l1;

    if (!isBull && !isBear) continue;

    if (isBull) {
      zones.push({ type: "bull", startIndex: i, lower: h1, upper: l3, gap: bullGap });
    }

    if (isBear) {
      zones.push({ type: "bear", startIndex: i, lower: h3, upper: l1, gap: bearGap });
    }
  }

  return zones.filter(zone => {
    for (let j = zone.startIndex + 1; j < rows.length; j++) {
      const rowLow = +rows[j].Low;
      const rowHigh = +rows[j].High;
      if (!Number.isFinite(rowLow) || !Number.isFinite(rowHigh)) continue;

      if (zone.type === "bull" && rowLow <= zone.lower) return false;
      if (zone.type === "bear" && rowHigh >= zone.upper) return false;
    }
    return true;
  });
}

function computeSharedColWidthsFVG(allRows) {
  if (!allRows.length) return {};
  const visibleCols = COLS_FVG.filter(h => h !== "Chart" && h in allRows[0]);
  if (!visibleCols.length) return {};

  const probe = document.createElement("table");
  probe.className = "portfolio-section-table";
  Object.assign(probe.style, {
    position: "absolute",
    visibility: "hidden",
    top: "-9999px",
    left: "-9999px",
    tableLayout: "auto",
    width: "max-content",
  });
  document.body.appendChild(probe);

  const hrow = document.createElement("tr");
  visibleCols.forEach(h => {
    const th = document.createElement("th");
    th.style.whiteSpace = "nowrap";
    th.innerText = HEADER_LABELS_FVG[h] || h;
    hrow.appendChild(th);
  });
  probe.appendChild(hrow);

  allRows.forEach(r => {
    const row = document.createElement("tr");
    visibleCols.forEach(h => {
      const td = document.createElement("td");
      td.style.whiteSpace = "nowrap";
      td.innerText = r[h] ?? "";
      row.appendChild(td);
    });
    probe.appendChild(row);
  });

  const ths = probe.querySelectorAll("tr:first-child th");
  const widths = {};
  visibleCols.forEach((h, i) => {
    widths[h] = ths[i] ? Math.ceil(ths[i].getBoundingClientRect().width) : 0;
  });
  document.body.removeChild(probe);
  return widths;
}

function buildFvgRowsForSymbol(baseRow, weeklyRows, minGapPct, maxAge) {
  if (!Array.isArray(weeklyRows) || !weeklyRows.length) return [];

  const activeZones = computeActiveFvgZonesForWeekly(weeklyRows, minGapPct);
  if (!activeZones.length) return [];

  const last = weeklyRows[weeklyRows.length - 1];
  const close = +last.Close;
  if (!Number.isFinite(close)) return [];

  return activeZones
    .map(zone => {
      const inZone = close >= zone.lower && close <= zone.upper;
      if (!inZone) return null;

      const age = (weeklyRows.length - 1) - zone.startIndex;
      if (age > maxAge) return null;

      const gapPct = close !== 0 ? (Math.abs(zone.upper - zone.lower) / Math.abs(close)) * 100 : 0;

      return {
        Symbol: baseRow.Symbol,
        Folio: baseRow.Folio || "TFStage2",
        Notes: baseRow.Notes || "",
        FVG_Type: zone.type === "bull" ? "High" : "Low",
        FVG_Low: zone.lower.toFixed(2),
        FVG_High: zone.upper.toFixed(2),
        W_Close: close.toFixed(2),
        GapPct: gapPct.toFixed(2),
        ZoneAge: String(age),
      };
    })
    .filter(Boolean);
}

function rebuildFvgSections() {
  const minGapPct = parseFloat(document.getElementById("fvgMinGap")?.value || "0.4");
  const maxAge = parseInt(document.getElementById("fvgMaxAge")?.value || "12", 10);

  const highRows = [];
  const lowRows = [];

  rawFVG.forEach(baseRow => {
    const symbol = baseRow.Symbol;
    if (!symbol) return;
    const rows = buildFvgRowsForSymbol(baseRow, weeklyBySymbolFVG[symbol] || [], minGapPct, maxAge);
    rows.forEach(r => {
      if (r.FVG_Type === "High") highRows.push(r);
      else lowRows.push(r);
    });
  });

  fvgSections = {
    High: window.sortRowsByColumn(highRows, "GapPct", true),
    Low: window.sortRowsByColumn(lowRows, "GapPct", true),
  };

  const statusEl = document.getElementById("fvgStatus");
  if (statusEl) {
    const covered = rawFVG.filter(r => weeklyBySymbolFVG[r.Symbol]).length;
    statusEl.textContent =
      "Symbols: " + rawFVG.length +
      " | Weekly matched: " + covered +
      " | High: " + highRows.length +
      " | Low: " + lowRows.length;
  }

  fvgColWidths = computeSharedColWidthsFVG([...highRows, ...lowRows]);
  fvgSortState = {};
  drawFvgSections();
}

function drawFvgSections() {
  const container = document.getElementById("fvgSections");
  container.innerHTML = "";
  container.appendChild(createFvgSection("High", fvgSections.High, "High"));
  container.appendChild(createFvgSection("Low", fvgSections.Low, "Low"));
}

function createFvgSection(title, rows, sectionKey) {
  const details = document.createElement("details");
  details.className = "portfolio-dropdown";
  details.open = Boolean(fvgSectionOpenState[sectionKey]);
  details.addEventListener("toggle", () => {
    fvgSectionOpenState[sectionKey] = details.open;
  });

  const summary = document.createElement("summary");
  summary.textContent = `${title} (${rows.length})`;
  summary.style.cursor = "pointer";
  summary.onclick = (e) => {
    e.preventDefault();
    details.open = !details.open;
  };
  details.appendChild(summary);

  const wrapper = document.createElement("div");
  wrapper.className = "portfolio-dropdown-content";

  const table = document.createElement("table");
  drawFvgTable(table, rows, sectionKey);

  wrapper.appendChild(table);
  details.appendChild(wrapper);
  return details;
}

function drawFvgTable(table, rows, sectionKey) {
  table.innerHTML = "";
  const sortInfo = fvgSortState[sectionKey];
  const data = sortInfo
    ? window.sortRowsByColumn(rows, sortInfo.col, sortInfo.asc)
    : rows;

  if (!data.length) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.innerText = "No data";
    td.className = "text";
    td.colSpan = COLS_FVG.length;
    tr.appendChild(td);
    table.appendChild(tr);
    return;
  }

  if (fvgColWidths && Object.keys(fvgColWidths).length) {
    const colgroup = document.createElement("colgroup");
    COLS_FVG.forEach(h => {
      const col = document.createElement("col");
      if (h === "Chart") {
        col.style.width = "42px";
      } else if (h in data[0] && fvgColWidths[h]) {
        col.style.width = fvgColWidths[h] + "px";
      }
      colgroup.appendChild(col);
    });
    table.appendChild(colgroup);
    table.style.tableLayout = "fixed";
    table.style.width = "max-content";
  }

  const tr = document.createElement("tr");
  COLS_FVG.forEach(h => {
    if (h !== "Chart" && !(h in data[0])) return;
    const th = document.createElement("th");
    th.innerText = HEADER_LABELS_FVG[h] || h;
    if (h !== "Chart") {
      th.onclick = () => {
        const existing = fvgSortState[sectionKey];
        const asc = existing && existing.col === h ? !existing.asc : true;
        fvgSortState[sectionKey] = { col: h, asc };
        fvgSectionOpenState[sectionKey] = true;
        drawFvgSections();
      };
    }
    if (h === "Symbol") th.classList.add("symbol-col");
    tr.appendChild(th);
  });
  table.appendChild(tr);

  data.forEach(r => {
    const row = document.createElement("tr");
    COLS_FVG.forEach(h => {
      if (h !== "Chart" && !(h in r)) return;
      const td = document.createElement("td");
      const v = r[h];

      if (h === "Symbol") {
        td.className = "symbol-col text";
        td.innerHTML = `<a href="#" onclick="openChartFVG('${v}')">${v}</a>`;
      } else if (h === "Chart") {
        td.className = "text";
        td.style.whiteSpace = "nowrap";
        ["D", "W", "M"].forEach(tf => {
          const a = document.createElement("a");
          a.href = "#";
          a.textContent = tf;
          a.className = "chart-icon chart-icon-" + tf;
          a.onclick = e => { e.preventDefault(); e.stopPropagation(); openCandleChart(r.Symbol, tf); };
          td.appendChild(a);
        });
      } else {
        td.innerText = v;
        td.className = (!isNaN(v) && v !== "") ? "num" : "text";
      }

      if (h === "FVG_Type") {
        td.classList.add(v === "High" ? "green" : "red");
      }

      row.appendChild(td);
    });
    table.appendChild(row);
  });
}

function openChartFVG(symbol) {
  window.open(`https://in.tradingview.com/chart/?symbol=NSE:${encodeURIComponent(symbol)}`, "_blank");
}

function updateFVGTime() {
  fetch(CSV_FVG, { method: "HEAD" })
    .then(res => {
      const d = new Date(res.headers.get("Last-Modified"));
      document.getElementById("updateTime_fvg").innerText =
        d.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", hour12: false }) +
        " / " +
        d.toLocaleDateString("en-IN", { year: "numeric", month: "short", day: "2-digit" });
    });
}

window.registerTabs(addTab => {
  Promise.all([
    fetch(CSV_FVG).then(r => r.text()),
    fetch(OHLC_WEEKLY_FVG).then(r => r.text()),
  ]).then(([baseCsv, weeklyCsv]) => {
    rawFVG = parseCsvSimpleFVG(baseCsv);
    weeklyBySymbolFVG = parseWeeklyCsvBySymbolFVG(weeklyCsv);

    addTab("FVG", () => {
      hideAllFeatures();
      document.getElementById("fvgFeature").style.display = "block";
      rebuildFvgSections();
    });

    updateFVGTime();

    const applyBtn = document.getElementById("fvgApplyBtn");
    if (applyBtn) applyBtn.onclick = rebuildFvgSections;
  }).catch((err) => {
    addTab("FVG", () => {
      hideAllFeatures();
      document.getElementById("fvgFeature").style.display = "block";
      const statusEl = document.getElementById("fvgStatus");
      if (statusEl) {
        statusEl.textContent = "Unable to load weekly OHLC for FVG: " + (err?.message || "unknown error");
      }
      const container = document.getElementById("fvgSections");
      if (container) container.innerHTML = "";
    });
  });
});
</script>

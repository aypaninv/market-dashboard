<!-- ===================== TFSTUDY FEATURE ===================== -->

<div id="tfstudyFeature" style="display:none">
  <div class="update-time" id="updateTime_tfs"></div>
  <div class="content">
    <table id="dataTable_tfs"></table>
  </div>
</div>

<script>
const CSV_TFS = "tfstudy_report.csv";

const COLS_TFS = [
  "Symbol","Folio","DD_High",
  "4H_10V20","D_10V20","W_10V20","M_10V20",
  // "W_RSI","M_RSI",
  "W_CHG","M_CHG",
  "CurPrice","Sector","MarketCap","Notes"
];

const HEADER_LABELS_TFS = {
  "4H_10V20": "4H_XC",
  "D_10V20": "D_XC",
  "W_10V20": "W_XC",
  "M_10V20": "M_XC",
};

let rawTFS = [];
let curTFS = [];
let tfsSortState = {};
let csvPathTFS = CSV_TFS;

function fetchCsvStudyWithFallback(fileName) {
  const candidates = [fileName, `output/${fileName}`, `../output/${fileName}`];

  const tryFetch = index => {
    if (index >= candidates.length) {
      return Promise.reject(new Error(`Unable to load ${fileName} from runtime paths`));
    }

    return fetch(candidates[index], { cache: "no-store" })
      .then(res => {
        if (!res.ok) throw new Error("Not found");
        csvPathTFS = candidates[index];
        return res.text();
      })
      .catch(() => tryFetch(index + 1));
  };

  return tryFetch(0);
}

function parseCSVStudy(text) {
  const lines = text.trim().split("\n");
  const h = lines[0].split(",");
  return lines.slice(1).map(r => {
    const v = r.split(",");
    let o = {};
    h.forEach((k, i) => o[k] = v[i] ?? "");
    return o;
  });
}

window.registerTabs(addTab => {
  fetchCsvStudyWithFallback(CSV_TFS)
    .then(t => {
      rawTFS = parseCSVStudy(t);
      [...new Set(rawTFS.map(d => d.Folio).filter(Boolean))]
        .forEach(folio =>
          addTab(folio, () => {
            hideAllFeatures();
            document.getElementById("tfstudyFeature").style.display = "block";
            renderTFS(rawTFS.filter(d => d.Folio === folio));
          })
        );
      updateTFSTime();
    })
    .catch(err => {
      console.error(err.message);
    });
});

function renderTFS(data) {
  curTFS = [...data];
  tfsSortState = {};

  curTFS = window.sortRowsByCustomDefault(curTFS, "4H_10V20");

  drawTFS(curTFS);
}


function drawTFS(data) {
  const table = document.getElementById("dataTable_tfs");
  table.innerHTML = "";

  const tr = document.createElement("tr");
  COLS_TFS.forEach(h => {
    if (!(h in data[0])) return;
    const th = document.createElement("th");
    th.innerText = HEADER_LABELS_TFS[h] || h;
    th.onclick = () => sortTFS(h);
    if (h === "Symbol") th.classList.add("symbol-col");
    tr.appendChild(th);
  });
  table.appendChild(tr);

  data.forEach(r => {
    const row = document.createElement("tr");
    COLS_TFS.forEach(h => {
      if (!(h in r)) return;
      const td = document.createElement("td");
      const v = r[h];

      if (h === "Symbol") {
        td.className = "symbol-col text";
        td.innerHTML = `<a href="#" onclick="openChartStudy('${v}')">${v}</a>`;
      } else {
        td.innerText = v;
        td.className = (!isNaN(v) && v !== "") ? "num" : "text";
      }

      window.applyCommonCellClasses(td, h, v, {
        chgColumns: ["W_CHG", "M_CHG"],
      });
      row.appendChild(td);
    });
    table.appendChild(row);
  });
}

function sortTFS(col) {
  const asc = !tfsSortState[col];
  tfsSortState = { [col]: asc };
  curTFS = window.sortRowsByColumn(curTFS, col, asc);
  drawTFS(curTFS);
}

function openChartStudy(symbol) {
  window.open(`https://in.tradingview.com/chart/?symbol=NSE:${encodeURIComponent(symbol)}`, "_blank");
}

function updateTFSTime() {
  fetch(csvPathTFS, { method: "HEAD" })
    .then(res => {
      const d = new Date(res.headers.get("Last-Modified"));
      document.getElementById("updateTime_tfs").innerText =
        d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",hour12:false}) +
        " / " +
        d.toLocaleDateString("en-IN",{year:"numeric",month:"short",day:"2-digit"});
    })
    .catch(() => {});
}
</script>

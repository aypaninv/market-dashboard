<!-- ===================== TFSTUDY FEATURE ===================== -->

<div id="tfstudyFeature" style="display:none">
  <div class="update-time" id="updateTime_tfs"></div>
  <div class="content">
    <div id="tfstudySections"></div>
  </div>
</div>

<script>
const CSV_TFS = "tfstudy_report.csv";

const COLS_TFS = [
  "Symbol","Folio","DD_High",
  "4H_10V20","D_10V20","W_10V20","M_10V20",
  // "W_RSI","M_RSI",
  "W_CHG","M_CHG",
  "CurPrice","Sector","MarketCap","Notes"
];

const HEADER_LABELS_TFS = {
  "4H_10V20": "4H_XC",
  "D_10V20": "D_XC",
  "W_10V20": "W_XC",
  "M_10V20": "M_XC",
};

let rawTFS = [];
let tfsSections = { High: [], Low: [] };
let tfsSortState = {};

function toNumber(value) {
  const num = parseFloat(value);
  return Number.isFinite(num) ? num : NaN;
}

function splitHighLow(rows) {
  const highRows = [];
  const lowRows = [];

  rows.forEach(r => {
    const w10v20 = toNumber(r.W_10V20);
    const h4_10v20 = toNumber(r["4H_10V20"]);

    if (w10v20 > 0 && h4_10v20 > 0) highRows.push(r);
    else lowRows.push(r);
  });

  return { highRows, lowRows };
}

function parseCSVStudy(text) {
  const lines = text.trim().split("\n");
  const h = lines[0].split(",");
  return lines.slice(1).map(r => {
    const v = r.split(",");
    let o = {};
    h.forEach((k, i) => o[k] = v[i] ?? "");
    return o;
  });
}

window.registerTabs(addTab => {
  fetch(CSV_TFS)
    .then(r => r.text())
    .then(t => {
      rawTFS = parseCSVStudy(t);
      [...new Set(rawTFS.map(d => d.Folio).filter(Boolean))]
        .forEach(folio =>
          addTab(folio, () => {
            hideAllFeatures();
            document.getElementById("tfstudyFeature").style.display = "block";
            renderTFS(rawTFS.filter(d => d.Folio === folio));
          })
        );
      updateTFSTime();
    });
});

function renderTFS(data) {
  const { highRows, lowRows } = splitHighLow([...data]);
  tfsSections = {
    High: window.sortRowsByCustomDefault(highRows, "4H_10V20"),
    Low: window.sortRowsByCustomDefault(lowRows, "4H_10V20"),
  };
  tfsSortState = {};
  drawTFSSections();
}

function drawTFSSections() {
  const container = document.getElementById("tfstudySections");
  container.innerHTML = "";

  container.appendChild(createTFSSection("High", tfsSections.High, "High", true));
  container.appendChild(createTFSSection("Low", tfsSections.Low, "Low", false));
}

function createTFSSection(title, rows, sectionKey, isOpenByDefault) {
  const details = document.createElement("details");
  details.className = "portfolio-dropdown";
  details.open = isOpenByDefault;

  const summary = document.createElement("summary");
  summary.textContent = `${title} (${rows.length})`;
  details.appendChild(summary);

  const wrapper = document.createElement("div");
  wrapper.className = "portfolio-dropdown-content";

  const table = document.createElement("table");
  drawTFSTable(table, rows, sectionKey);

  wrapper.appendChild(table);
  details.appendChild(wrapper);
  return details;
}

function drawTFSTable(table, rows, sectionKey) {
  table.innerHTML = "";
  const sortInfo = tfsSortState[sectionKey];
  const data = sortInfo
    ? window.sortRowsByColumn(rows, sortInfo.col, sortInfo.asc)
    : rows;

  if (!data.length) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.innerText = "No data";
    td.className = "text";
    td.colSpan = COLS_TFS.length;
    tr.appendChild(td);
    table.appendChild(tr);
    return;
  }

  const tr = document.createElement("tr");
  COLS_TFS.forEach(h => {
    if (!(h in data[0])) return;
    const th = document.createElement("th");
    th.innerText = HEADER_LABELS_TFS[h] || h;
    th.onclick = () => {
      const existing = tfsSortState[sectionKey];
      const asc = existing && existing.col === h ? !existing.asc : true;
      tfsSortState[sectionKey] = { col: h, asc };
      drawTFSSections();
    };
    if (h === "Symbol") th.classList.add("symbol-col");
    tr.appendChild(th);
  });
  table.appendChild(tr);

  data.forEach(r => {
    const row = document.createElement("tr");
    COLS_TFS.forEach(h => {
      if (!(h in r)) return;
      const td = document.createElement("td");
      const v = r[h];

      if (h === "Symbol") {
        td.className = "symbol-col text";
        td.innerHTML = `<a href="#" onclick="openChartStudy('${v}')">${v}</a>`;
      } else {
        td.innerText = v;
        td.className = (!isNaN(v) && v !== "") ? "num" : "text";
      }

      window.applyCommonCellClasses(td, h, v, {
        chgColumns: ["W_CHG", "M_CHG"],
      });
      row.appendChild(td);
    });
    table.appendChild(row);
  });
}

function openChartStudy(symbol) {
  window.open(`https://in.tradingview.com/chart/?symbol=NSE:${encodeURIComponent(symbol)}`, "_blank");
}

function updateTFSTime() {
  fetch(CSV_TFS, { method: "HEAD" })
    .then(res => {
      const d = new Date(res.headers.get("Last-Modified"));
      document.getElementById("updateTime_tfs").innerText =
        d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",hour12:false}) +
        " / " +
        d.toLocaleDateString("en-IN",{year:"numeric",month:"short",day:"2-digit"});
    });
}
</script>

<!-- ===================== TREND FEATURE ===================== -->

<div id="trendFeature" style="display:none">
  <div class="update-time" id="updateTime_trend"></div>
  <div class="content">
    <table id="dataTable_trend"></table>
  </div>
</div>

<script>
const CSV_TREND = "trend_report.csv";

const COLS_TREND = [
  "Symbol","Folio","DD_High",
  "4H_MACD","D_MACD","W_MACD","M_MACD",
  "W_Low","W_Return",
  "CurPrice","Sector","MarketCap","Notes"
];

let rawTrend = [];
let curTrend = [];
let trendSortState = {};

function parseCSV(text) {
  const lines = text.trim().split("\n");
  const h = lines[0].split(",");
  return lines.slice(1).map(r => {
    const v = r.split(",");
    let o = {};
    h.forEach((k, i) => o[k] = v[i] ?? "");
    return o;
  });
}

window.registerTabs(addTab => {
  fetch(CSV_TREND)
    .then(r => r.text())
    .then(t => {
      rawTrend = parseCSV(t);

      [...new Set(rawTrend.map(d => d.Folio).filter(Boolean))]
        .forEach(folio =>
          addTab(folio, () => {
            hideAllFeatures();
            document.getElementById("trendFeature").style.display = "block";
            renderTrend(rawTrend.filter(d => d.Folio === folio));
          })
        );

      updateTrendTime();
    });
});

function renderTrend(data) {
  curTrend = [...data];
  trendSortState = {};

  curTrend.sort((a, b) => {
    const x = parseFloat(a.W_MACD);
    const y = parseFloat(b.W_MACD);
    if (x > 0 && y <= 0) return -1;
    if (x <= 0 && y > 0) return 1;
    return x - y;
  });

  drawTrend(curTrend);
}

function drawTrend(data) {
  const table = document.getElementById("dataTable_trend");
  table.innerHTML = "";

  const tr = document.createElement("tr");
  COLS_TREND.forEach(h => {
    if (!(h in data[0])) return;
    const th = document.createElement("th");
    th.innerText = h;
    th.onclick = () => sortTrend(h);
    if (h === "Symbol") th.classList.add("symbol-col");
    tr.appendChild(th);
  });
  table.appendChild(tr);

  data.forEach(r => {
    const row = document.createElement("tr");

    COLS_TREND.forEach(h => {
      if (!(h in r)) return;
      const td = document.createElement("td");
      const v = r[h];

      if (h === "Symbol") {
        td.className = "symbol-col text";
        td.innerHTML = `<a href="#" onclick="openChart('${v}')">${v}</a>`;
      } else {
        td.innerText = v;
        td.className = (!isNaN(v) && v !== "") ? "num" : "text";
      }

      if (h === "DD_High" && parseFloat(v) < -16) td.classList.add("red");
      if (h.includes("MACD") && v !== "")
        td.classList.add(parseFloat(v) >= 0 ? "green" : "red");

      row.appendChild(td);
    });

    table.appendChild(row);
  });
}

function sortTrend(col) {
  const asc = !trendSortState[col];
  trendSortState = { [col]: asc };

  curTrend.sort((a, b) =>
    asc ? parseFloat(a[col]) - parseFloat(b[col])
        : parseFloat(b[col]) - parseFloat(a[col])
  );

  drawTrend(curTrend);
}

function openChart(symbol) {
  window.open(
    `https://in.tradingview.com/chart/?symbol=NSE:${encodeURIComponent(symbol)}`,
    "_blank"
  );
}

function updateTrendTime() {
  fetch(CSV_TREND, { method: "HEAD" })
    .then(res => {
      const d = new Date(res.headers.get("Last-Modified"));
      document.getElementById("updateTime_trend").innerText =
        d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",hour12:false}) +
        " / " +
        d.toLocaleDateString("en-IN",{year:"numeric",month:"short",day:"2-digit"});
    });
}
</script>

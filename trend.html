<!-- ===================== SECTOR TECHNICAL REPORT ===================== -->

<style>
.update-time {
  position: fixed;
  top: 6px;
  right: 10px;
  font-size: 11px;
  color: #bbb;
  z-index: 999;
}

.content {
  height: calc(100vh - 60px);
  overflow: auto;
  padding: 8px;
}

table {
  border-collapse: collapse;
  width: max-content;
  font-size: 13px;
}

th, td {
  border: 1px solid #ccc;
  padding: 6px 8px;
  background: white;
}

th {
  background: #f0f0f0;
  position: sticky;
  top: 0;
  cursor: pointer;
  z-index: 5;
}

th.sector-col,
td.sector-col {
  position: sticky;
  left: 0;
  background: #fafafa;
  z-index: 6;
  font-weight: bold;
}

tbody tr:nth-child(even) td {
  background: #f9f9f9;
}

td.text { text-align: left; }
td.num  { text-align: right; }

.green { background: #c8f7c5 !important; }
.red   { background: #f7c5c5 !important; }
</style>

<div id="sectorFeature" style="display:none">
  <div class="update-time" id="updateTime_sector"></div>
  <div class="content">
    <table id="sectorTable"></table>
  </div>
</div>

<script>
const CSV_SECTOR = "technical_sector_report.csv";

const COLS = [
  "Sector",
  "D_MACD","W_MACD","M_MACD",
  "D_RSI","W_RSI","M_RSI"
];

let sectorData = [];
let sortState = {};

/* ---------- CSV Parser ---------- */
function parseCSV(text) {
  const lines = text.trim().split("\n");
  const headers = lines[0].split(",");
  return lines.slice(1).map(row => {
    const values = row.split(",");
    let obj = {};
    headers.forEach((h, i) => obj[h] = values[i] ?? "");
    return obj;
  });
}

/* ---------- Register Feature ---------- */
window.registerTabs(addTab => {
  addTab("Sector", () => {
    document.getElementById("portfolioFeature")?.style.setProperty("display","none");
    document.getElementById("tfwatchFeature")?.style.setProperty("display","none");
    document.getElementById("trendFeature")?.style.setProperty("display","none");
    document.getElementById("sectorFeature").style.display = "block";

    if (!sectorData.length) loadSectorData();
    else renderTable(sectorData);
  });
});

/* ---------- Load Data ---------- */
function loadSectorData() {
  fetch(CSV_SECTOR)
    .then(r => r.text())
    .then(t => {
      sectorData = parseCSV(t);
      renderTable(sectorData);
      updateTime();
    });
}

/* ---------- Render Table ---------- */
function renderTable(data) {
  const table = document.getElementById("sectorTable");
  table.innerHTML = "";
  sortState = {};

  // Header
  const tr = document.createElement("tr");
  COLS.forEach(col => {
    if (!(col in data[0])) return;
    const th = document.createElement("th");
    th.innerText = col;

    th.onclick = () => {
      const asc = !sortState[col];
      sortState = { [col]: asc };

      data.sort((a, b) => {
        const x = parseFloat(a[col]);
        const y = parseFloat(b[col]);
        if (isNaN(x) || isNaN(y)) return asc ? 1 : -1;
        return asc ? x - y : y - x;
      });
      renderTable(data);
    };

    if (col === "Sector") th.classList.add("sector-col");
    tr.appendChild(th);
  });
  table.appendChild(tr);

  // Rows
  data.forEach(r => {
    const row = document.createElement("tr");

    COLS.forEach(col => {
      if (!(col in r)) return;
      const td = document.createElement("td");
      const v = r[col];

      if (col === "Sector") {
        td.className = "sector-col text";
        td.innerText = v;
      } else {
        td.innerText = v;
        td.className = (!isNaN(v) && v !== "") ? "num" : "text";
      }

      if (col.includes("MACD") && v !== "")
        td.classList.add(parseFloat(v) >= 0 ? "green" : "red");

      if (col.includes("RSI") && v !== "")
        td.classList.add(parseFloat(v) >= 53 ? "green" : "red");

      row.appendChild(td);
    });

    table.appendChild(row);
  });
}

/* ---------- Update Timestamp ---------- */
function updateTime() {
  fetch(CSV_SECTOR, { method: "HEAD" })
    .then(res => {
      const d = new Date(res.headers.get("Last-Modified"));
      document.getElementById("updateTime_sector").innerText =
        d.toLocaleTimeString("en-IN", {
          timeZone: "Asia/Kolkata",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false
        }) + " / " +
        d.toLocaleDateString("en-IN", {
          timeZone: "Asia/Kolkata",
          year: "numeric",
          month: "short",
          day: "2-digit"
        });
    });
}
</script>

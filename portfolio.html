<!-- ===================== PORTFOLIO FEATURE ===================== -->

<div id="portfolioFeature">
  <div class="update-time" id="updateTime"></div>
  <div class="content">
    <div id="folioSections"></div>
  </div>
</div>

<script>
const CSV_FILE = "portfolio_report.csv";

const DEFAULT_COLUMN_ORDER = [
  "Symbol","Chart","Folio","IC","CC", "PnL",
  "DD_High","D_BO","W_BO","M_BO",
  "LT_Type","LT_days","LT_Pert",
  "D_XL","W_XL","M_XL",
  "D_XL","W_XL","M_XL",
  "D_CHG","W_CHG","M_CHG",
  "W_SL","M_SL","W_EMA10","M_EMA10","AvgPrice","CurPrice",
  "Sector","MarketCap","Notes"
];

// Customize table columns per folio type.
const COLUMN_ORDER_BY_FOLIO = {
  Trade: [
    "Symbol","Chart","Folio","IC","CC","PnL",
    "DD_High",
    "LT_Type","LT_days","LT_Pert",
    "D_BO","W_BO","M_BO",
    "W_XL","M_XL",
    "W_CHG","M_CHG",
    "W_EMA10","M_EMA10",
    "W_SL","M_SL",
    "AvgPrice","CurPrice","Notes"
  ],
  Sate: [
    "Symbol","Chart","Folio","IC","CC","PnL",
    "DD_High",
    "LT_Type","LT_days","LT_Pert",
    "D_BO","W_BO","M_BO",
    "W_XL","M_XL",
    "W_CHG","M_CHG",
    "W_EMA10","M_EMA10",
    "W_SL","M_SL",
    "AvgPrice","CurPrice","Sector","MarketCap","Notes"
  ],
  Core: [
    "Symbol","Chart","Folio","IC","CC","PnL",
    "DD_High",
    "LT_Type","LT_days","LT_Pert",
    "D_BO","W_BO","M_BO",
    "W_CHG","M_CHG",
    "W_EMA10","M_EMA10",
    "W_SL","M_SL",
    "AvgPrice","CurPrice","Sector","MarketCap","Notes"
  ],
};

const HEADER_LABELS = {
  "LT_Type": "LT_T",
  "LT_days": "LT_D",
  "LT_Pert": "LT_P",
  "D_XL": "D_XL",
  "W_XL": "W_XL",
  "M_XL": "M_XL",
  "W_EMA10": "W_E10",
  "M_EMA10": "M_E10",
  "W_BO": "W_BO",
  "M_BO": "M_BO",
  "D_BO": "D_BO",
  "W_SL": "W_SL",
  "M_SL": "M_SL",
};

let rawData = [];
let sectionSortState = {};

function parseCSV(text) {
  const lines = text.trim().split("\n");
  const headers = lines[0].split(",");
  return lines.slice(1).map(r => {
    const v = r.split(",");
    let o = {};
    headers.forEach((h, i) => o[h] = v[i] ?? "");
    return o;
  });
}

function folioPriority(name) {
  if (name === "Trade") return 1;
  if (name === "Sate") return 2;
  if (name === "Sate_Low") return 3;
  if (name === "Core") return 4;
  if (name === "Core_Low") return 5;
  if (name.startsWith("Sate")) return 6;
  if (name.startsWith("Core")) return 7;
  return 8;
}

function toNumber(value) {
  const num = parseFloat(value);
  return Number.isFinite(num) ? num : NaN;
}

function getColumnOrderForFolio(folio) {
  return COLUMN_ORDER_BY_FOLIO[folio] || DEFAULT_COLUMN_ORDER;
}

function defaultAddCondition(d) {
  const ltPert = toNumber(d.LT_Pert);
  const wBO = toNumber(d["W_BO"]);

  return (
    ltPert > 4 && wBO > 0
  );
}

function defaultSellCondition(d) {
  return toNumber(d.W_BO) < 0;
}

// Returns true when IC value is high but PnL hasn't caught up — triggers red highlight
function isICAlert(ic, pnl) {
  if (ic >= 6) return pnl < 50;
  if (ic >= 5) return pnl < 40;
  if (ic >= 4) return pnl < 32;
  if (ic >= 3) return pnl < 24;
  if (ic >= 2) return pnl < 15;
  if (ic >= 1) return pnl < 8;
  if (ic >= 0.5) return pnl < 0;
  return false;
}

// Check if position meets performance threshold based on IC and PnL
function meetsPnLThreshold(ic, pnl) {
  if (ic >= 6) return pnl >= 50;
  if (ic >= 5) return pnl >= 40;
  if (ic >= 4) return pnl >= 32;
  if (ic >= 3) return pnl >= 24;
  if (ic >= 2) return pnl >= 15;
  if (ic >= 1) return pnl >= 8;
  if (ic >= 0.5) return pnl > 0;
  return true; // No threshold for IC <= 0.5
}

const addConditionsByFolio = {
  Trade: d => {
    const ltPert = toNumber(d.LT_Pert);
    const wBO = toNumber(d["W_BO"]);
    const wSL = toNumber(d["W_SL"]);
    return ltPert > 4 && wSL > 0 && wSL < 12;
  },
  Sate: d => {
    const ltPert = toNumber(d.LT_Pert);
    const ic = toNumber(d["IC"]);
    const pnl = toNumber(d["PnL"]);
    const wBO = toNumber(d["W_BO"]);
    const wSL = toNumber(d["W_SL"]);
    return ic < 6 && ltPert > 4 && wSL > 0 && wSL < 12 && meetsPnLThreshold(ic, pnl);
  },
  Core: d => {
    const ltPert = toNumber(d.LT_Pert);
    const ic = toNumber(d["IC"]);
    const pnl = toNumber(d["PnL"]);
    const wBO = toNumber(d["W_BO"]);
    const mSL = toNumber(d["M_SL"]);
    return ic < 7 && ltPert > 4 && mSL > 0 && mSL < 12 && meetsPnLThreshold(ic, pnl);
  },
};

const sellConditionsByFolio = { 
  Sate: d => toNumber(d["IC"]) >= 0.5 && (toNumber(d["W_SL"]) < 0),
  Core: d => toNumber(d["IC"]) >= 0.5 && (toNumber(d["W_SL"]) < 0),
};

const holdConditionsByFolio = {
  Sate: d => toNumber(d["IC"]) >= 0.5 && d.LT_Type === "Sell",
  Core: d => toNumber(d["IC"]) >= 0.5 && d.LT_Type === "Sell",
};

const pullbackConditionsByFolio = {
  // Pullback uses the shared default condition unless overridden per folio.
};

const exitConditionsByFolio = {
  Sate: d => (
                toNumber(d["PNL"]) < -8
              ) || (  
                toNumber(d["IC"]) >= 0.5 && 
                toNumber(d.M_SL) < 0
              ), 
  Core: d => (
                toNumber(d["PNL"]) < -8
              ) || ( 
                toNumber(d["IC"]) >= 0.5 && 
                toNumber(d["M_SL"]) < 0
              ),
  Trade: d => (
                toNumber(d["W_SL"]) < 0
              ) || (
                toNumber(d["W_CHG"]) < -8
              ),
};
  
function getAddCondition(folio) {
  return addConditionsByFolio[folio] || defaultAddCondition;
}

function getSellCondition(folio) {
  return sellConditionsByFolio[folio] || defaultSellCondition;
}

function getHoldCondition(folio) {
  return holdConditionsByFolio[folio] || (() => false);
}

function getExitCondition(folio) {
  return exitConditionsByFolio[folio] || (() => false);
}

function defaultPullbackCondition(d) {
  const dBO = toNumber(d["D_BO"]);
  const mSL = toNumber(d["M_SL"]);
  const ic = toNumber(d["IC"]);
  const pnl = toNumber(d["PnL"]);
  return dBO > 0 && dBO < 5 && mSL < 10 && meetsPnLThreshold(ic, pnl);
}

function getPullbackCondition(folio) {
  return pullbackConditionsByFolio[folio] || defaultPullbackCondition;
}

const CHART_TIMEFRAMES_PORTFOLIO = { Trade: ["D", "W", "M"], Sate: ["D", "W", "M"], Core: ["D", "W", "M"] };

// ==============================================================

window.registerTabs(addTab => {
  fetch(CSV_FILE)
    .then(r => r.text())
    .then(t => {
      rawData = parseCSV(t);

      const uniqueFolios = [...new Set(rawData.map(d => d.Folio).filter(Boolean).map(f => f.replace(/_Low$/, '')))];

      uniqueFolios
        .sort((a, b) => {
          const priorityDiff = folioPriority(a) - folioPriority(b);
          return priorityDiff !== 0 ? priorityDiff : a.localeCompare(b);
        })
        .forEach(folio => {
          addTab(folio, () => {
            document.getElementById("portfolioFeature").style.display = "block";
            const folioBase = folio.replace(/_Low$/, '');
            renderFolioSections(folio, rawData.filter(d => d.Folio === folioBase || d.Folio === folioBase + "_Low"));
          });
        });

      updateLastRunTime();
    });
});

function getDefaultSortColumnForFolio(folio) {
  const folioBase = (folio || "").replace(/_Low$/, "");
  if (folioBase === "Core") return "W_BO";
  if (folioBase === "Sate" || folioBase === "Trade") return "D_BO";
  return "W_BO";
}

function sortByDefault(data, folio) {
  return window.sortRowsByColumn(data, getDefaultSortColumnForFolio(folio), false);
}

function getSortedSectionRows(rows, sectionKey) {
  const sortInfo = sectionSortState[sectionKey];
  if (!sortInfo) {
    return rows;
  }

  const { col, asc } = sortInfo;
  return window.sortRowsByColumn(rows, col, asc);
}

function computeSharedColWidths(allRows, columnOrder) {
  if (!allRows.length) return {};
  const visibleCols = columnOrder.filter(h => h !== "Chart" && h in allRows[0]);
  if (!visibleCols.length) return {};

  const probe = document.createElement("table");
  probe.className = "portfolio-section-table";
  Object.assign(probe.style, {
    position: "absolute",
    visibility: "hidden",
    top: "-9999px",
    left: "-9999px",
    tableLayout: "auto",
    width: "max-content",
  });
  document.body.appendChild(probe);

  const hrow = document.createElement("tr");
  visibleCols.forEach(h => {
    const th = document.createElement("th");
    th.style.whiteSpace = "nowrap";
    th.innerText = HEADER_LABELS[h] || h;
    hrow.appendChild(th);
  });
  probe.appendChild(hrow);

  allRows.forEach(r => {
    const row = document.createElement("tr");
    visibleCols.forEach(h => {
      const td = document.createElement("td");
      td.style.whiteSpace = "nowrap";
      td.innerText = r[h] ?? "";
      row.appendChild(td);
    });
    probe.appendChild(row);
  });

  const ths = probe.querySelectorAll("tr:first-child th");
  const widths = {};
  visibleCols.forEach((h, i) => {
    widths[h] = ths[i] ? Math.ceil(ths[i].getBoundingClientRect().width) : 0;
  });
  document.body.removeChild(probe);
  return widths;
}

function renderFolioSections(folio, folioRows) {
  const columnOrder = getColumnOrderForFolio(folio);
  const colWidths = computeSharedColWidths(folioRows, columnOrder);
  const container = document.getElementById("folioSections");
  container.innerHTML = "";

  // Trade folio has custom 2-section layout
  if (folio === "Trade") {
    const addCondition = getAddCondition(folio);
    const exitCondition = getExitCondition(folio);
    const addRows = [];
    const exitRows = [];
    const holdingRows = [];

    folioRows.forEach(d => {
      if (addCondition(d)) {
        addRows.push(d);
      } else if (exitCondition(d)) {
        exitRows.push(d);
      } else {
        holdingRows.push(d);
      }
    });

    container.appendChild(createSection("Add", sortByDefault(addRows, folio), `${folio}__Add`, true, colWidths, columnOrder));
    container.appendChild(createSection("Exit", sortByDefault(exitRows, folio), `${folio}__Exit`, true, colWidths, columnOrder));
    container.appendChild(createSection("Holding", sortByDefault(holdingRows, folio), `${folio}__Holding`, true, colWidths, columnOrder));
  } else {
    // Standard 6-section layout for other folios
    const addCondition = getAddCondition(folio);
    const sellCondition = getSellCondition(folio);
    const holdCondition = getHoldCondition(folio);
    const exitCondition = getExitCondition(folio);
    const pullbackCondition = getPullbackCondition(folio);

    // Prioritize conditions: Add > Pullback > Exit > Hold > Sell > Others
    const addRows = [];
    const exitRows = [];
    const holdRows = [];
    const sellRows = [];
    const pullbackRows = [];
    const otherRows = [];

    folioRows.forEach(d => {
      if (addCondition(d)) {
        addRows.push(d);
      } else if (pullbackCondition(d)) {
        pullbackRows.push(d);
      } else if (exitCondition(d)) {
        exitRows.push(d);
      } else if (holdCondition(d)) {
        holdRows.push(d);
      } else if (sellCondition(d)) {
        sellRows.push(d);
      } else {
        otherRows.push(d);
      }
    });

    container.appendChild(createSection("Add", sortByDefault(addRows, folio), `${folio}__Add`, true, colWidths, columnOrder));
    container.appendChild(createSection("Pullback", sortByDefault(pullbackRows, folio), `${folio}__Pullback`, true, colWidths, columnOrder));
    container.appendChild(createSection("Sell", sortByDefault(sellRows, folio), `${folio}__Sell`, true, colWidths, columnOrder));
    container.appendChild(createSection("Hold", sortByDefault(holdRows, folio), `${folio}__Hold`, true, colWidths, columnOrder));
    container.appendChild(createSection("Exit", sortByDefault(exitRows, folio), `${folio}__Exit`, true, colWidths, columnOrder));
    container.appendChild(createSection("Others", sortByDefault(otherRows, folio), `${folio}__Others`, false, colWidths, columnOrder));
  }
}

function createSection(title, rows, sectionKey, isOpenByDefault, colWidths, columnOrder) {
  const details = document.createElement("details");
  details.className = "portfolio-dropdown";
  details.open = isOpenByDefault;

  const summary = document.createElement("summary");
  summary.textContent = `${title} (${rows.length})`;
  summary.style.cursor = "pointer";
  summary.onclick = (e) => {
    e.preventDefault();
    details.open = !details.open;
  };
  details.appendChild(summary);

  const wrapper = document.createElement("div");
  wrapper.className = "portfolio-dropdown-content";

  const table = document.createElement("table");
  table.className = "portfolio-section-table";
  renderTable(table, rows, sectionKey, colWidths, columnOrder);

  wrapper.appendChild(table);
  details.appendChild(wrapper);
  return details;
}

function renderTable(table, baseRows, sectionKey, colWidths, columnOrder) {
  table.innerHTML = "";
  const data = getSortedSectionRows(baseRows, sectionKey);

  if (!data.length) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.innerText = "No data";
    td.className = "text";
    td.colSpan = columnOrder.length;
    tr.appendChild(td);
    table.appendChild(tr);
    return;
  }

  if (colWidths && Object.keys(colWidths).length) {
    const colgroup = document.createElement("colgroup");
    columnOrder.forEach(h => {
      const col = document.createElement("col");
      if (h === "Chart") {
        col.style.width = "42px";
      } else if (h in data[0] && colWidths[h]) {
        col.style.width = colWidths[h] + "px";
      }
      colgroup.appendChild(col);
    });
    table.appendChild(colgroup);
    table.style.tableLayout = "fixed";
    table.style.width = "max-content";
  }

  const tr = document.createElement("tr");
  columnOrder.forEach(h => {
    if (h !== "Chart" && !(h in data[0])) return;
    const th = document.createElement("th");
    th.innerText = HEADER_LABELS[h] || h;
    th.style.whiteSpace = "nowrap";
    if (h !== "Chart") {
      th.onclick = () => {
        const existing = sectionSortState[sectionKey];
        const asc = existing && existing.col === h ? !existing.asc : true;
        sectionSortState[sectionKey] = { col: h, asc };
        renderTable(table, baseRows, sectionKey, colWidths, columnOrder);
      };
    }
    if (h === "Symbol") th.classList.add("symbol-col");
    tr.appendChild(th);
  });
  table.appendChild(tr);

  data.forEach(r => {
    const row = document.createElement("tr");
    columnOrder.forEach(h => {
      if (h !== "Chart" && !(h in r)) return;
      const td = document.createElement("td");
      const v = r[h];

      if (h === "Symbol") {
        td.className = "symbol-col text";
        td.innerHTML = `<a href="#" onclick="openChart('${v}')">${v}</a>`;
      } else if (h === "Chart") {
        td.className = "text";
        td.style.whiteSpace = "nowrap";
        const folioBase = sectionKey.split("__")[0].replace(/_Low$/, "");
        const tfs = CHART_TIMEFRAMES_PORTFOLIO[folioBase] || ["D"];
        tfs.forEach(tf => {
          const a = document.createElement("a");
          a.href = "#";
          a.textContent = tf;
          a.className = "chart-icon chart-icon-" + tf;
          a.onclick = e => { e.preventDefault(); e.stopPropagation(); openCandleChart(r.Symbol, tf); };
          td.appendChild(a);
        });
      } else {
        // Format BO columns as integers
        if (["D_BO", "W_BO", "M_BO"].includes(h) && v !== "") {
          td.innerText = Math.round(parseFloat(v));
        } else {
          td.innerText = v;
        }
        td.className = (!isNaN(v) && v !== "") ? "num" : "text";
      }

      if (h !== "Chart") {
        window.applyCommonCellClasses(td, h, v, {
          chgColumns: ["D_CHG", "W_CHG", "M_CHG"],
          profitColumns: ["PnL", "LT_Pert"],
        });
      }

      if (h === "IC") {
        const ic = toNumber(v);
        const pnl = toNumber(r["PnL"]);
        if (isICAlert(ic, pnl)) {
          td.classList.add("red");
        }
      }

      row.appendChild(td);
    });
    table.appendChild(row);
  });
}

function openChart(symbol) {
  window.open(`https://in.tradingview.com/chart/?symbol=NSE:${encodeURIComponent(symbol)}`, "_blank");
}

function updateLastRunTime() {
  fetch(CSV_FILE, { method: "HEAD" })
    .then(res => {
      const d = new Date(res.headers.get("Last-Modified"));
      document.getElementById("updateTime").innerText =
        d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",hour12:false}) +
        " / " +
        d.toLocaleDateString("en-IN",{year:"numeric",month:"short",day:"2-digit"});
    });
}
</script>

<!-- ===================== PORTFOLIO FEATURE ===================== -->

<style>
.chart-icon{font-size:10px;font-weight:700;padding:1px 4px;border-radius:3px;border:1px solid var(--accent);color:var(--accent);text-decoration:none;margin-right:2px;line-height:1.6;display:inline-block}
.chart-icon:hover{background:var(--accent);color:#fff;text-decoration:none}
</style>

<div id="portfolioFeature">
  <div class="update-time" id="updateTime"></div>
  <div class="content">
    <div id="folioSections"></div>
  </div>
</div>

<div id="chartOverlay" onclick="closeChart()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:1000;align-items:center;justify-content:center;">
  <div id="chartPopup" style="background:var(--panel);border-radius:12px;padding:14px 16px;box-shadow:0 8px 32px rgba(0,0,0,0.45);">
    <div id="chartTitle" style="font-size:12px;font-weight:700;letter-spacing:0.4px;color:var(--text);margin-bottom:8px;"></div>
    <canvas id="chartCanvas"></canvas>
  </div>
</div>

<script>
const CSV_FILE = "portfolio_report.csv";

const DEFAULT_COLUMN_ORDER = [
  "Symbol","Chart","Folio","IC","CC", "PnL",
  "DD_High","D_BO","W_BO",
  "LT_Type","LT_days","LT_Pert",
  "D_XL","W_XL","M_XL",
  "4H_XC","D_XC","W_XC","M_XC",
  "D_EMA20","W_EMA10","D_CHG","W_CHG","M_CHG",
  "AvgPrice","CurPrice",
  "Sector","MarketCap","Notes"
];

// Customize table columns per folio type.
const COLUMN_ORDER_BY_FOLIO = {
  Trade: [
    "Symbol","Chart","Folio","IC","CC","PnL",
    "DD_High","D_BO","W_BO",
    "LT_Type","LT_days","LT_Pert",
    "D_XL","4H_XC","D_XC","W_XC","D_CHG",
    "AvgPrice","CurPrice","Notes"
  ],
  Sate: [
    "Symbol","Chart","Folio","IC","CC","PnL",
    "DD_High","W_BO",
    "LT_Type","LT_days","LT_Pert",
    "D_XL","W_XL",
    "4H_XC","D_XC","W_XC",
    "D_EMA20","W_CHG",
    "AvgPrice","CurPrice",
    "Sector","MarketCap","Notes"
  ],
  Core: [
    "Symbol","Chart","Folio","IC","CC","PnL",
    "DD_High","W_BO",
    "LT_Type","LT_days","LT_Pert",
    "W_XL","M_XL",
    "W_XC","M_XC",
    "W_EMA10","W_CHG","M_CHG",
    "AvgPrice","CurPrice",
    "Sector","MarketCap","Notes"
  ],
};

const HEADER_LABELS = {
  "LT_Type": "LT_T",
  "LT_days": "LT_D",
  "LT_Pert": "LT_P",
  "D_XL": "D_XL",
  "W_XL": "W_XL",
  "M_XL": "M_XL",

  "4H_XC": "4H_XC",
  "D_XC": "D_XC",
  "W_XC": "W_XC",
  "W_BO": "W_BO",
  "D_BO": "D_BO",
  "M_XC": "M_XC",
  "D_EMA20": "D_E20",
  "W_EMA10": "W_E10",
};

let rawData = [];
let sectionSortState = {};

function parseCSV(text) {
  const lines = text.trim().split("\n");
  const headers = lines[0].split(",");
  return lines.slice(1).map(r => {
    const v = r.split(",");
    let o = {};
    headers.forEach((h, i) => o[h] = v[i] ?? "");
    return o;
  });
}

function folioPriority(name) {
  if (name === "Trade") return 1;
  if (name === "Sate") return 2;
  if (name === "Sate_Low") return 3;
  if (name === "Core") return 4;
  if (name === "Core_Low") return 5;
  if (name.startsWith("Sate")) return 6;
  if (name.startsWith("Core")) return 7;
  return 8;
}

function toNumber(value) {
  const num = parseFloat(value);
  return Number.isFinite(num) ? num : NaN;
}

function getColumnOrderForFolio(folio) {
  return COLUMN_ORDER_BY_FOLIO[folio] || DEFAULT_COLUMN_ORDER;
}

function defaultAddCondition(d) {
  const ltPert = toNumber(d.LT_Pert);
  const co_d = toNumber(d["D_XC"]);

  return (
    ltPert > 4 && co_d > 0
  );
}

function defaultSellCondition(d) {
  return toNumber(d.D_XC) < 0;
}

const addConditionsByFolio = {
  Trade: d => {
    const dChg = toNumber(d["D_CHG"]);
    return dChg > 0;
  },
  Sate: d => {
    const wChg = toNumber(d["W_CHG"]);
    return wChg > 0;
  },
  Core: d => {
    const mChg = toNumber(d["M_CHG"]);
    return mChg > 0;
  },
};

const sellConditionsByFolio = {
  Sate: d => toNumber(d["IC"]) > 0.5 && (toNumber(d.W_CHG) < -8 || toNumber(d["W_XL"]) < 0),
  Core: d => toNumber(d["IC"]) > 0.5 && (toNumber(d.M_CHG) < -8 || toNumber(d["M_XL"]) < 0),
};

const holdConditionsByFolio = {
  Sate: d => toNumber(d["IC"]) > 0.5 && d.LT_Type === "Sell",
  Core: d => toNumber(d["IC"]) > 0.5 && d.LT_Type === "Sell",
};

const trackConditionsByFolio = {
  // Track if IC < 0.5 (default for all folios)
};

const exitConditionsByFolio = {
  Sate: d => (
                toNumber(d["PNL"]) < -8
              ) || (  
                toNumber(d["IC"]) > 0.5 && 
                toNumber(d.W_XC) < -1
              ), 
  Core: d => (
                toNumber(d["PNL"]) < -8
              ) || ( 
                toNumber(d["IC"]) > 0.5 && 
                toNumber(d.M_XC) < 0
              ),
  Trade: d => (
                toNumber(d["D_XL"]) < -1
              ),
};
  
function getAddCondition(folio) {
  return addConditionsByFolio[folio] || defaultAddCondition;
}

function getSellCondition(folio) {
  return sellConditionsByFolio[folio] || defaultSellCondition;
}

function getHoldCondition(folio) {
  return holdConditionsByFolio[folio] || (() => false);
}

function getExitCondition(folio) {
  return exitConditionsByFolio[folio] || (() => false);
}

function defaultTrackCondition(d) {
  return toNumber(d.IC) < 0.5;
}

function getTrackCondition(folio) {
  return trackConditionsByFolio[folio] || defaultTrackCondition;
}

// ===================== CANDLESTICK CHART =====================

const CHART_TIMEFRAMES_BY_FOLIO = {
  Trade: ["D"],
  Sate:  ["D", "W"],
  Core:  ["W", "M"],
};

const OHLC_FILES = {
  D: "nse_data/nse_daily.csv",
  W: "nse_data/nse_weekly.csv",
  M: "nse_data/nse_monthly.csv",
};

const OHLC_LABELS = { D: "Daily", W: "Weekly", M: "Monthly" };
const ohlcCache = {};

function parseOHLC(text) {
  const lines = text.trim().split("\n");
  const headers = lines[0].split(",").map(h => h.trim());
  const bySymbol = {};
  for (let i = 1; i < lines.length; i++) {
    const vals = lines[i].split(",");
    const obj = {};
    headers.forEach((h, j) => { obj[h] = (vals[j] || "").trim(); });
    const sym = obj.Symbol;
    if (!sym) continue;
    if (!bySymbol[sym]) bySymbol[sym] = [];
    bySymbol[sym].push(obj);
  }
  return bySymbol;
}

function loadOHLC(tf) {
  if (ohlcCache[tf]) return Promise.resolve(ohlcCache[tf]);
  return fetch(OHLC_FILES[tf])
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(t => { ohlcCache[tf] = parseOHLC(t); return ohlcCache[tf]; });
}

function openCandleChart(symbol, tf) {
  loadOHLC(tf)
    .then(data => {
      const rows = data[symbol];
      if (!rows || !rows.length) { alert("No " + (OHLC_LABELS[tf] || tf) + " data for " + symbol); return; }
      showChart(symbol, tf, rows.slice(-20));
    })
    .catch(() => alert("Failed to load chart data"));
}

function showChart(symbol, tf, candles) {
  const canvas = document.getElementById("chartCanvas");
  canvas.width  = Math.min(620, window.innerWidth - 48);
  canvas.height = Math.round(canvas.width * 0.52);
  document.getElementById("chartTitle").textContent =
    symbol + "  \u2014  " + (OHLC_LABELS[tf] || tf) + "  (last " + candles.length + ")";
  drawCandles(canvas, candles);
  document.getElementById("chartOverlay").style.display = "flex";
}

function closeChart() {
  document.getElementById("chartOverlay").style.display = "none";
}

function drawCandles(canvas, candles) {
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  const P = { t: 20, r: 16, b: 26, l: 58 };
  const cW = W - P.l - P.r, cH = H - P.t - P.b;
  const dark = document.body.classList.contains("dark");
  const bgC    = dark ? "#161b22" : "#ffffff";
  const gridC  = dark ? "#2b313a" : "#e5e5e5";
  const labelC = dark ? "#8b949e" : "#666666";

  ctx.fillStyle = bgC;
  ctx.fillRect(0, 0, W, H);

  let minP = Infinity, maxP = -Infinity;
  candles.forEach(c => {
    const h = +c.high, l = +c.low;
    if (isFinite(h)) maxP = Math.max(maxP, h);
    if (isFinite(l))  minP = Math.min(minP, l);
  });
  if (!isFinite(minP)) return;

  const pad = (maxP - minP) * 0.05 || 1;
  const lo = minP - pad, hi = maxP + pad, rng = hi - lo;
  const py = p => P.t + cH * (1 - (p - lo) / rng);

  const n = candles.length;
  const slotW = cW / n;
  const bW = Math.max(2, Math.floor(slotW * 0.62));

  // Horizontal grid + price labels
  ctx.strokeStyle = gridC;
  ctx.lineWidth = 0.5;
  ctx.fillStyle = labelC;
  ctx.font = "10px Courier New";
  ctx.textAlign = "right";
  for (let i = 0; i <= 4; i++) {
    const pv = lo + rng * i / 4;
    const y  = py(pv);
    ctx.beginPath(); ctx.moveTo(P.l, y); ctx.lineTo(W - P.r, y); ctx.stroke();
    ctx.fillText(pv.toFixed(0), P.l - 4, y + 3);
  }

  // Candles
  candles.forEach((c, i) => {
    const o = +c.open, h = +c.high, l = +c.low, cl = +c.close;
    if (![o, h, l, cl].every(isFinite)) return;
    const col = cl >= o ? "#26a69a" : "#ef5350";
    const cx  = P.l + (i + 0.5) * slotW;

    ctx.strokeStyle = col;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx, py(h)); ctx.lineTo(cx, py(l)); ctx.stroke();

    const yTop = py(Math.max(o, cl));
    const bH   = Math.max(1, py(Math.min(o, cl)) - yTop);
    ctx.fillStyle = col;
    ctx.fillRect(cx - bW / 2, yTop, bW, bH);
  });

  // X-axis date labels (every ~4 candles)
  ctx.fillStyle = labelC;
  ctx.font = "9px Courier New";
  ctx.textAlign = "center";
  const step = Math.max(1, Math.floor(n / 5));
  candles.forEach((c, i) => {
    if (i % step !== 0) return;
    const d = (c.date || "").slice(5); // MM-DD
    ctx.fillText(d, P.l + (i + 0.5) * slotW, H - 8);
  });
}

// ==============================================================

window.registerTabs(addTab => {
  fetch(CSV_FILE)
    .then(r => r.text())
    .then(t => {
      rawData = parseCSV(t);

      const uniqueFolios = [...new Set(rawData.map(d => d.Folio).filter(Boolean).map(f => f.replace(/_Low$/, '')))];

      uniqueFolios
        .sort((a, b) => {
          const priorityDiff = folioPriority(a) - folioPriority(b);
          return priorityDiff !== 0 ? priorityDiff : a.localeCompare(b);
        })
        .forEach(folio => {
          addTab(folio, () => {
            document.getElementById("portfolioFeature").style.display = "block";
            const folioBase = folio.replace(/_Low$/, '');
            renderFolioSections(folio, rawData.filter(d => d.Folio === folioBase || d.Folio === folioBase + "_Low"));
          });
        });

      updateLastRunTime();
    });
});

function sortByDefault(data) {
  return window.sortRowsByCustomDefault(data, "D_XC");
}

function getSortedSectionRows(rows, sectionKey) {
  const sortInfo = sectionSortState[sectionKey];
  if (!sortInfo) {
    return rows;
  }

  const { col, asc } = sortInfo;
  return window.sortRowsByColumn(rows, col, asc);
}

function computeSharedColWidths(allRows, columnOrder) {
  if (!allRows.length) return {};
  const visibleCols = columnOrder.filter(h => h !== "Chart" && h in allRows[0]);
  if (!visibleCols.length) return {};

  const probe = document.createElement("table");
  probe.className = "portfolio-section-table";
  Object.assign(probe.style, {
    position: "absolute",
    visibility: "hidden",
    top: "-9999px",
    left: "-9999px",
    tableLayout: "auto",
    width: "max-content",
  });
  document.body.appendChild(probe);

  const hrow = document.createElement("tr");
  visibleCols.forEach(h => {
    const th = document.createElement("th");
    th.style.whiteSpace = "nowrap";
    th.innerText = HEADER_LABELS[h] || h;
    hrow.appendChild(th);
  });
  probe.appendChild(hrow);

  allRows.forEach(r => {
    const row = document.createElement("tr");
    visibleCols.forEach(h => {
      const td = document.createElement("td");
      td.style.whiteSpace = "nowrap";
      td.innerText = r[h] ?? "";
      row.appendChild(td);
    });
    probe.appendChild(row);
  });

  const ths = probe.querySelectorAll("tr:first-child th");
  const widths = {};
  visibleCols.forEach((h, i) => {
    widths[h] = ths[i] ? Math.ceil(ths[i].getBoundingClientRect().width) : 0;
  });
  document.body.removeChild(probe);
  return widths;
}

function renderFolioSections(folio, folioRows) {
  const columnOrder = getColumnOrderForFolio(folio);
  const colWidths = computeSharedColWidths(folioRows, columnOrder);
  const container = document.getElementById("folioSections");
  container.innerHTML = "";

  // Trade folio has custom 2-section layout
  if (folio === "Trade") {
    const addCondition = getAddCondition(folio);
    const exitCondition = getExitCondition(folio);
    const addRows = [];
    const exitRows = [];
    const holdingRows = [];

    folioRows.forEach(d => {
      if (addCondition(d)) {
        addRows.push(d);
      } else if (exitCondition(d)) {
        exitRows.push(d);
      } else {
        holdingRows.push(d);
      }
    });

    container.appendChild(createSection("Add", sortByDefault(addRows), `${folio}__Add`, true, colWidths, columnOrder));
    container.appendChild(createSection("Exit", sortByDefault(exitRows), `${folio}__Exit`, true, colWidths, columnOrder));
    container.appendChild(createSection("Holding", sortByDefault(holdingRows), `${folio}__Holding`, true, colWidths, columnOrder));
  } else {
    // Standard 6-section layout for other folios
    const addCondition = getAddCondition(folio);
    const sellCondition = getSellCondition(folio);
    const holdCondition = getHoldCondition(folio);
    const exitCondition = getExitCondition(folio);
    const trackCondition = getTrackCondition(folio);

    // Prioritize conditions: Add > Track > Exit > Hold > Sell > Others
    const addRows = [];
    const exitRows = [];
    const holdRows = [];
    const sellRows = [];
    const trackRows = [];
    const otherRows = [];

    folioRows.forEach(d => {
      if (addCondition(d)) {
        addRows.push(d);
      } else if (trackCondition(d)) {
        trackRows.push(d);
      } else if (exitCondition(d)) {
        exitRows.push(d);
      } else if (holdCondition(d)) {
        holdRows.push(d);
      } else if (sellCondition(d)) {
        sellRows.push(d);
      } else {
        otherRows.push(d);
      }
    });

    container.appendChild(createSection("Add", sortByDefault(addRows), `${folio}__Add`, true, colWidths, columnOrder));
    container.appendChild(createSection("Sell", sortByDefault(sellRows), `${folio}__Sell`, true, colWidths, columnOrder));
    container.appendChild(createSection("Hold", sortByDefault(holdRows), `${folio}__Hold`, true, colWidths, columnOrder));
    container.appendChild(createSection("Exit", sortByDefault(exitRows), `${folio}__Exit`, true, colWidths, columnOrder));
    container.appendChild(createSection("Others", sortByDefault(otherRows), `${folio}__Others`, false, colWidths, columnOrder));
    container.appendChild(createSection("Track", sortByDefault(trackRows), `${folio}__Track`, false, colWidths, columnOrder));
  }
}

function createSection(title, rows, sectionKey, isOpenByDefault, colWidths, columnOrder) {
  const details = document.createElement("details");
  details.className = "portfolio-dropdown";
  details.open = isOpenByDefault;

  const summary = document.createElement("summary");
  summary.textContent = `${title} (${rows.length})`;
  details.appendChild(summary);

  const wrapper = document.createElement("div");
  wrapper.className = "portfolio-dropdown-content";

  const table = document.createElement("table");
  table.className = "portfolio-section-table";
  renderTable(table, rows, sectionKey, colWidths, columnOrder);

  wrapper.appendChild(table);
  details.appendChild(wrapper);
  return details;
}

function renderTable(table, baseRows, sectionKey, colWidths, columnOrder) {
  table.innerHTML = "";
  const data = getSortedSectionRows(baseRows, sectionKey);

  if (!data.length) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.innerText = "No data";
    td.className = "text";
    td.colSpan = columnOrder.length;
    tr.appendChild(td);
    table.appendChild(tr);
    return;
  }

  if (colWidths && Object.keys(colWidths).length) {
    const colgroup = document.createElement("colgroup");
    columnOrder.forEach(h => {
      const col = document.createElement("col");
      if (h === "Chart") {
        col.style.width = "42px";
      } else {
        if (!(h in data[0]) || !colWidths[h]) return;
        col.style.width = colWidths[h] + "px";
      }
      colgroup.appendChild(col);
    });
    table.appendChild(colgroup);
    table.style.tableLayout = "fixed";
    table.style.width = "max-content";
  }

  const tr = document.createElement("tr");
  columnOrder.forEach(h => {
    if (h !== "Chart" && !(h in data[0])) return;
    const th = document.createElement("th");
    th.innerText = HEADER_LABELS[h] || h;
    th.style.whiteSpace = "nowrap";
    if (h !== "Chart") {
      th.onclick = () => {
        const existing = sectionSortState[sectionKey];
        const asc = existing && existing.col === h ? !existing.asc : true;
        sectionSortState[sectionKey] = { col: h, asc };
        renderTable(table, baseRows, sectionKey, colWidths, columnOrder);
      };
    }
    if (h === "Symbol") th.classList.add("symbol-col");
    tr.appendChild(th);
  });
  table.appendChild(tr);

  data.forEach(r => {
    const row = document.createElement("tr");
    columnOrder.forEach(h => {
      if (h !== "Chart" && !(h in r)) return;
      const td = document.createElement("td");
      const v = r[h];

      if (h === "Symbol") {
        td.className = "symbol-col text";
        td.innerHTML = `<a href="#" onclick="openChart('${v}')">${v}</a>`;
      } else if (h === "Chart") {
        td.className = "text";
        const folioBase = sectionKey.split("__")[0].replace(/_Low$/, "");
        const tfs = CHART_TIMEFRAMES_BY_FOLIO[folioBase] || ["D"];
        tfs.forEach(tf => {
          const a = document.createElement("a");
          a.href = "#";
          a.textContent = tf;
          a.className = "chart-icon";
          a.onclick = e => { e.preventDefault(); e.stopPropagation(); openCandleChart(r.Symbol, tf); };
          td.appendChild(a);
        });
      } else {
        td.innerText = v;
        td.className = (!isNaN(v) && v !== "") ? "num" : "text";
      }

      if (h !== "Chart") {
        window.applyCommonCellClasses(td, h, v, {
          chgColumns: ["D_CHG", "W_CHG", "M_CHG"],
          profitColumns: ["PnL", "LT_Pert"],
        });
      }

      row.appendChild(td);
    });
    table.appendChild(row);
  });
}

function openChart(symbol) {
  window.open(`https://in.tradingview.com/chart/?symbol=NSE:${encodeURIComponent(symbol)}`, "_blank");
}

function updateLastRunTime() {
  fetch(CSV_FILE, { method: "HEAD" })
    .then(res => {
      const d = new Date(res.headers.get("Last-Modified"));
      document.getElementById("updateTime").innerText =
        d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",hour12:false}) +
        " / " +
        d.toLocaleDateString("en-IN",{year:"numeric",month:"short",day:"2-digit"});
    });
}
</script>

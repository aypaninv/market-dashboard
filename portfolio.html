<!-- ===================== PORTFOLIO FEATURE ===================== -->

<div id="portfolioFeature">
  <div class="update-time" id="updateTime"></div>
  <div class="content">
    <div id="folioSections"></div>
  </div>
</div>

<script>
const CSV_FILE = "portfolio_report.csv";

const COLUMN_ORDER = [
  "Symbol","Folio","IC","CC",
  "DD_High","PnL","LT_Type","LT_days","LT_Pert",
  "D_MACD","W_MACD","M_MACD","D_EMA10","D_EMA20","D_10V20","W_EMA10","W_EMA20","W_10V20",
  // "W_RSI","M_RSI",
  "W_CHG","M_CHG",
  "AvgPrice","CurPrice",
  "Sector","MarketCap","Notes"
];

let rawData = [];
let sectionSortState = {};

function parseCSV(text) {
  const lines = text.trim().split("\n");
  const headers = lines[0].split(",");
  return lines.slice(1).map(r => {
    const v = r.split(",");
    let o = {};
    headers.forEach((h, i) => o[h] = v[i] ?? "");
    return o;
  });
}

function folioPriority(name) {
  if (name === "Sate") return 1;
  if (name === "Sate_Low") return 2;
  if (name === "Core") return 3;
  if (name === "Core_Low") return 4;
  if (name === "Trade") return 5;
  if (name.startsWith("Sate")) return 6;
  if (name.startsWith("Core")) return 7;
  return 8;
}

function toNumber(value) {
  const num = parseFloat(value);
  return Number.isFinite(num) ? num : NaN;
}

function defaultAddCondition(d) {
  const ltPert = toNumber(d.LT_Pert);
  const wChg = toNumber(d.W_CHG);

  return (
    ltPert > 4 && wChg > -4 
  );
}

function defaultSellCondition(d) {
  return toNumber(d.W_CHG) < -8;
}

const addConditionsByFolio = {
  Sate: d => {
    const ltPert = toNumber(d.LT_Pert);
    const wChg = toNumber(d.W_CHG);
    return ltPert > 4 && wChg > 0;
  },
  Core: d => {
    const ltPert = toNumber(d.LT_Pert);
    const wChg = toNumber(d.W_CHG);
    const mChg = toNumber(d.M_CHG);
    return ltPert > 4 && wChg > 0 && mChg > 0;
  },
};

const sellConditionsByFolio = {
  Sate: d => toNumber(d.W_CHG) < -8,
  Core: d => toNumber(d.M_CHG) < -10,
};

function getAddCondition(folio) {
  return addConditionsByFolio[folio] || defaultAddCondition;
}

function getSellCondition(folio) {
  return sellConditionsByFolio[folio] || defaultSellCondition;
}

window.registerTabs(addTab => {
  fetch(CSV_FILE)
    .then(r => r.text())
    .then(t => {
      rawData = parseCSV(t);

      const uniqueFolios = [...new Set(rawData.map(d => d.Folio).filter(Boolean))];

      uniqueFolios
        .sort((a, b) => {
          const priorityDiff = folioPriority(a) - folioPriority(b);
          return priorityDiff !== 0 ? priorityDiff : a.localeCompare(b);
        })
        .forEach(folio => {
          addTab(folio, () => {
            document.getElementById("portfolioFeature").style.display = "block";
            renderFolioSections(folio, rawData.filter(d => d.Folio === folio));
          });
        });

      updateLastRunTime();
    });
});

function sortByDefault(data) {
  return [...data].sort((a, b) => {
    const x = parseFloat(a["W_CHG"]);
    const y = parseFloat(b["W_CHG"]);

    if (isNaN(x) && isNaN(y)) return 0;
    if (isNaN(x)) return 1;
    if (isNaN(y)) return -1;

    return y - x;
  });
}

function compareCellValues(aVal, bVal, asc) {
  const aNum = parseFloat(aVal);
  const bNum = parseFloat(bVal);
  const bothNumeric = Number.isFinite(aNum) && Number.isFinite(bNum);

  if (bothNumeric) {
    return asc ? aNum - bNum : bNum - aNum;
  }

  const aText = String(aVal ?? "");
  const bText = String(bVal ?? "");
  return asc ? aText.localeCompare(bText) : bText.localeCompare(aText);
}

function getSortedSectionRows(rows, sectionKey) {
  const sortInfo = sectionSortState[sectionKey];
  if (!sortInfo) {
    return rows;
  }

  const { col, asc } = sortInfo;
  return [...rows].sort((a, b) => compareCellValues(a[col], b[col], asc));
}

function renderFolioSections(folio, folioRows) {
  const addCondition = getAddCondition(folio);
  const sellCondition = getSellCondition(folio);

  const addRows = sortByDefault(folioRows.filter(d => addCondition(d)));
  const sellRows = sortByDefault(folioRows.filter(d => sellCondition(d)));
  const otherRows = sortByDefault(folioRows.filter(d => !addCondition(d) && !sellCondition(d)));

  const container = document.getElementById("folioSections");
  container.innerHTML = "";

  container.appendChild(createSection("Add", addRows, `${folio}__Add`, true));
  container.appendChild(createSection("Sell", sellRows, `${folio}__Sell`, true));
  container.appendChild(createSection("Others", otherRows, `${folio}__Others`, false));
}

function createSection(title, rows, sectionKey, isOpenByDefault) {
  const details = document.createElement("details");
  details.className = "portfolio-dropdown";
  details.open = isOpenByDefault;

  const summary = document.createElement("summary");
  summary.textContent = `${title} (${rows.length})`;
  details.appendChild(summary);

  const wrapper = document.createElement("div");
  wrapper.className = "portfolio-dropdown-content";

  const table = document.createElement("table");
  table.className = "portfolio-section-table";
  renderTable(table, rows, sectionKey);

  wrapper.appendChild(table);
  details.appendChild(wrapper);
  return details;
}

function renderTable(table, baseRows, sectionKey) {
  table.innerHTML = "";
  const data = getSortedSectionRows(baseRows, sectionKey);

  if (!data.length) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.innerText = "No data";
    td.className = "text";
    td.colSpan = COLUMN_ORDER.length;
    tr.appendChild(td);
    table.appendChild(tr);
    return;
  }

  const tr = document.createElement("tr");
  COLUMN_ORDER.forEach(h => {
    if (!(h in data[0])) return;
    const th = document.createElement("th");
    th.innerText = h;
    th.onclick = () => {
      const existing = sectionSortState[sectionKey];
      const asc = existing && existing.col === h ? !existing.asc : true;
      sectionSortState[sectionKey] = { col: h, asc };
      renderTable(table, baseRows, sectionKey);
    };
    if (h === "Symbol") th.classList.add("symbol-col");
    tr.appendChild(th);
  });
  table.appendChild(tr);

  data.forEach(r => {
    const row = document.createElement("tr");
    COLUMN_ORDER.forEach(h => {
      if (!(h in r)) return;
      const td = document.createElement("td");
      const v = r[h];

      if (h === "Symbol") {
        td.className = "symbol-col text";
        td.innerHTML = `<a href="#" onclick="openChart('${v}')">${v}</a>`;
      } else {
        td.innerText = v;
        td.className = (!isNaN(v) && v !== "") ? "num" : "text";
      }

      if (h === "DD_High" && parseFloat(v) < -15) td.classList.add("orange");
      if (h.includes("MACD") && v !== "") td.classList.add(parseFloat(v) >= 0 ? "green" : "orange");
      if (["D_CHG", "W_CHG", "M_CHG"].includes(h) && !isNaN(v) && parseFloat(v) < -8) {
        td.classList.add("orange");
      }
      if ((h === "W_RSI" || h === "M_RSI") && v !== "") {
        const rsi = parseFloat(v);
        if (rsi > 54) td.classList.add("green");
        else if (rsi < 54) td.classList.add("red");
      }
      if (["D_EMA10", "D_EMA20", "D_10V20", "W_EMA10", "W_EMA20", "W_10V20"].includes(h) && !isNaN(v)) {
        if (parseFloat(v) < 0) {
          td.classList.add("red");
        }
      }
      if ((h === "PnL" || h === "LT_Pert") && !isNaN(v)) {
        if (v < -8) td.classList.add("red");
        else if (v > 0) td.classList.add("green");
      }

      row.appendChild(td);
    });
    table.appendChild(row);
  });
}

function openChart(symbol) {
  window.open(`https://in.tradingview.com/chart/?symbol=NSE:${encodeURIComponent(symbol)}`, "_blank");
}

function updateLastRunTime() {
  fetch(CSV_FILE, { method: "HEAD" })
    .then(res => {
      const d = new Date(res.headers.get("Last-Modified"));
      document.getElementById("updateTime").innerText =
        d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",hour12:false}) +
        " / " +
        d.toLocaleDateString("en-IN",{year:"numeric",month:"short",day:"2-digit"});
    });
}
</script>

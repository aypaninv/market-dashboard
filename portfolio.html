<!-- ===================== PORTFOLIO FEATURE ===================== -->

<div id="portfolioFeature">
  <div class="update-time" id="updateTime"></div>
  <div class="content">
    <table id="dataTable"></table>
  </div>
</div>

<script>
const CSV_FILE = "portfolio_report.csv";

const COLUMN_ORDER = [
  "Symbol","Folio","DD_High","PnL","SL_Pert",
  "LT_days","LT_Pert",
  "4H_MACD","D_MACD","W_MACD","M_MACD",
  "W_Low","W_Return",
  "AvgPrice","StopLoss","CurPrice",
  "IC","CC",
  "Sector","MarketCap","Notes"
];

let rawData = [];
let currentData = [];
let sortState = {};

function parseCSV(text) {
  const lines = text.trim().split("\n");
  const headers = lines[0].split(",");
  return lines.slice(1).map(r => {
    const v = r.split(",");
    let o = {};
    headers.forEach((h, i) => o[h] = v[i] ?? "");
    return o;
  });
}

function folioPriority(name) {
  if (name === "Trade") return 1;
  if (name.startsWith("Sate")) return 2;
  if (name.startsWith("Core")) return 3;
  return 4;
}

window.registerTabs(addTab => {
  fetch(CSV_FILE)
    .then(r => r.text())
    .then(t => {
      rawData = parseCSV(t);

      addTab("Exit", () => {
        document.getElementById("portfolioFeature").style.display = "block";
        renderAndDefaultSort(
          rawData.filter(d =>
            d.StopLoss &&
            !isNaN(d.CurPrice) &&
            parseFloat(d.CurPrice) < parseFloat(d.StopLoss)
          )
        );
      });

      const uniqueFolios = [...new Set(rawData.map(d => d.Folio).filter(Boolean))];

      if (uniqueFolios.some(f => f.startsWith("Trade"))) {
        addTab("Trade", () => {
          document.getElementById("portfolioFeature").style.display = "block";
          renderAndDefaultSort(rawData.filter(d => d.Folio.startsWith("Trade")));
        });
      }

      uniqueFolios
        .filter(f => !f.startsWith("Trade"))
        .sort((a, b) => folioPriority(a) - folioPriority(b))
        .forEach(folio => {
          addTab(folio, () => {
            document.getElementById("portfolioFeature").style.display = "block";
            renderAndDefaultSort(rawData.filter(d => d.Folio === folio));
          });
        });

      updateLastRunTime();
    });
});

function renderAndDefaultSort(data) {
  currentData = [...data];
  sortState = {};
  defaultSort();
  renderTable(currentData);
}

function defaultSort() {
  currentData.sort((a, b) => {
    const x = parseFloat(a.D_MACD);
    const y = parseFloat(b.D_MACD);
    if (x > 0 && y <= 0) return -1;
    if (x <= 0 && y > 0) return 1;
    return x - y;
  });
}

function renderTable(data) {
  const table = document.getElementById("dataTable");
  table.innerHTML = "";

  const tr = document.createElement("tr");
  COLUMN_ORDER.forEach(h => {
    if (!(h in data[0])) return;
    const th = document.createElement("th");
    th.innerText = h;
    th.onclick = () => sortBy(h);
    if (h === "Symbol") th.classList.add("symbol-col");
    tr.appendChild(th);
  });
  table.appendChild(tr);

  data.forEach(r => {
    const row = document.createElement("tr");
    COLUMN_ORDER.forEach(h => {
      if (!(h in r)) return;
      const td = document.createElement("td");
      const v = r[h];

      if (h === "Symbol") {
        td.className = "symbol-col text";
        td.innerHTML = `<a href="#" onclick="openChart('${v}')">${v}</a>`;
      } else {
        td.innerText = v;
        td.className = (!isNaN(v) && v !== "") ? "num" : "text";
      }

      if (h === "DD_High" && parseFloat(v) < -16) td.classList.add("red");
      if (h.includes("MACD") && v !== "") td.classList.add(parseFloat(v) >= 0 ? "green" : "red");
      if ((h === "PnL" || h === "SL_Pert" || h === "LT_Pert") && !isNaN(v)) {
        if (v < -8) td.classList.add("red");
        else if (v <= 0) td.classList.add("orange");
        else td.classList.add("green");
      }

      row.appendChild(td);
    });
    table.appendChild(row);
  });
}

function sortBy(col) {
  const asc = !sortState[col];
  sortState = { [col]: asc };
  currentData.sort((a, b) =>
    asc ? parseFloat(a[col]) - parseFloat(b[col])
        : parseFloat(b[col]) - parseFloat(a[col])
  );
  renderTable(currentData);
}

function openChart(symbol) {
  window.open(`https://in.tradingview.com/chart/?symbol=NSE:${encodeURIComponent(symbol)}`, "_blank");
}

function updateLastRunTime() {
  fetch(CSV_FILE, { method: "HEAD" })
    .then(res => {
      const d = new Date(res.headers.get("Last-Modified"));
      document.getElementById("updateTime").innerText =
        d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",hour12:false}) +
        " / " +
        d.toLocaleDateString("en-IN",{year:"numeric",month:"short",day:"2-digit"});
    });
}
</script>

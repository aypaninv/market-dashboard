<!-- ===================== TFCORE FEATURE ===================== -->

<div id="tfcoreFeature" style="display:none">
  <div class="update-time" id="updateTime_tfc"></div>
  <div class="content">
    <table id="dataTable_tfc"></table>
  </div>
</div>

<script>
const CSV_TFC = "tfcore_report.csv";

const COLS_TFC = [
  "Symbol","Folio","DD_High",
  "4H_10V20","D_10V20","W_10V20","M_10V20",
  // "W_RSI","M_RSI",
  "W_CHG","M_CHG",
  "CurPrice","Sector","MarketCap","Notes"
];

const HEADER_LABELS_TFC = {
  "4H_10V20": "4H_XC",
  "D_10V20": "D_XC",
  "W_10V20": "W_XC",
  "M_10V20": "M_XC",
};

let rawTFC = [];
let curTFC = [];
let tfcSortState = {};
let csvPathTFC = CSV_TFC;

function fetchCsvCoreWithFallback(fileName) {
  const candidates = [fileName, `output/${fileName}`, `../output/${fileName}`];

  const tryFetch = index => {
    if (index >= candidates.length) {
      return Promise.reject(new Error(`Unable to load ${fileName} from runtime paths`));
    }

    return fetch(candidates[index], { cache: "no-store" })
      .then(res => {
        if (!res.ok) throw new Error("Not found");
        csvPathTFC = candidates[index];
        return res.text();
      })
      .catch(() => tryFetch(index + 1));
  };

  return tryFetch(0);
}

function parseCSVCore(text) {
  const lines = text.trim().split("\n");
  const h = lines[0].split(",");
  return lines.slice(1).map(r => {
    const v = r.split(",");
    let o = {};
    h.forEach((k, i) => o[k] = v[i] ?? "");
    return o;
  });
}

window.registerTabs(addTab => {
  fetchCsvCoreWithFallback(CSV_TFC)
    .then(t => {
      rawTFC = parseCSVCore(t);
      [...new Set(rawTFC.map(d => d.Folio).filter(Boolean))]
        .forEach(folio =>
          addTab(folio, () => {
            hideAllFeatures();
            document.getElementById("tfcoreFeature").style.display = "block";
            renderTFC(rawTFC.filter(d => d.Folio === folio));
          })
        );
      updateTFCTime();
    })
    .catch(err => {
      console.error(err.message);
    });
});

function renderTFC(data) {
  curTFC = [...data];
  tfcSortState = {};

  curTFC = window.sortRowsByCustomDefault(curTFC, "4H_10V20");

  drawTFC(curTFC);
}


function drawTFC(data) {
  const table = document.getElementById("dataTable_tfc");
  table.innerHTML = "";

  const tr = document.createElement("tr");
  COLS_TFC.forEach(h => {
    if (!(h in data[0])) return;
    const th = document.createElement("th");
    th.innerText = HEADER_LABELS_TFC[h] || h;
    th.onclick = () => sortTFC(h);
    if (h === "Symbol") th.classList.add("symbol-col");
    tr.appendChild(th);
  });
  table.appendChild(tr);

  data.forEach(r => {
    const row = document.createElement("tr");
    COLS_TFC.forEach(h => {
      if (!(h in r)) return;
      const td = document.createElement("td");
      const v = r[h];

      if (h === "Symbol") {
        td.className = "symbol-col text";
        td.innerHTML = `<a href="#" onclick="openChartCore('${v}')">${v}</a>`;
      } else {
        td.innerText = v;
        td.className = (!isNaN(v) && v !== "") ? "num" : "text";
      }

      window.applyCommonCellClasses(td, h, v, {
        chgColumns: ["W_CHG", "M_CHG"],
      });
      row.appendChild(td);
    });
    table.appendChild(row);
  });
}

function sortTFC(col) {
  const asc = !tfcSortState[col];
  tfcSortState = { [col]: asc };
  curTFC = window.sortRowsByColumn(curTFC, col, asc);
  drawTFC(curTFC);
}

function openChartCore(symbol) {
  window.open(`https://in.tradingview.com/chart/?symbol=NSE:${encodeURIComponent(symbol)}`, "_blank");
}

function updateTFCTime() {
  fetch(csvPathTFC, { method: "HEAD" })
    .then(res => {
      const d = new Date(res.headers.get("Last-Modified"));
      document.getElementById("updateTime_tfc").innerText =
        d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",hour12:false}) +
        " / " +
        d.toLocaleDateString("en-IN",{year:"numeric",month:"short",day:"2-digit"});
    })
    .catch(() => {});
}
</script>

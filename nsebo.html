<!-- ===================== NSEBO FEATURE ===================== -->

<div id="nseboFeature" style="display:none">
  <div class="update-time" id="updateTime_nsebo"></div>
  <div class="content">
    <div id="nseboSection"></div>
  </div>
</div>

<script>
const CSV_NSEBO = "nsebo_report.csv";

const COLS_NSEBO = [
  "Symbol","Chart","Folio",
  "DD_ATH","DD_52W",
  "D_BO","W_BO","M_BO",
  "W_SL","W_PSL","M_SL", "M_PSL",
  "Trend","CurPrice","Sector","W_RSI","M_RSI","MarketCap","Notes"
];

const HEADER_LABELS_NSEBO = {
  "W_BO": "W_BO",
  "D_BO": "D_BO",
  "W_SL": "W_SL",
  "M_SL": "M_SL",
  "Trend": "TD",
};

// ── Hardcoded entry-quality filter ──────────────────────────────────────────
// Only symbols passing ALL conditions are shown in the table.
const NSEBO_FILTER = {
  DD_ATH: r => parseFloat(r.DD_ATH) < 15,
  TD: r => parseFloat(r.Trend) >= 5,
  M_SL:   r => parseFloat(r.M_SL) >= 0,
  BO_ANY: r => parseFloat(r.D_BO) >= 0 || parseFloat(r.W_BO) >= 0 || parseFloat(r.M_BO) >= 0,
};

let rawNseBo = [];
let nseboSortState = { col: "D_BO", asc: false };
let nseboColWidths = {};

function toNumberNseBo(value) {
  const num = parseFloat(value);
  return Number.isFinite(num) ? num : NaN;
}

function applyNseboFilter(rows) {
  return rows.filter(r =>
    Object.values(NSEBO_FILTER).every(fn => {
      const result = fn(r);
      return result && !isNaN(result === true ? 1 : result);
    })
  );
}

function computeNseboColWidths(rows) {
  if (!rows.length) return {};
  const visibleCols = COLS_NSEBO.filter(h => h !== "Chart" && h in rows[0]);
  if (!visibleCols.length) return {};

  const probe = document.createElement("table");
  probe.className = "portfolio-section-table";
  Object.assign(probe.style, {
    position: "absolute", visibility: "hidden",
    top: "-9999px", left: "-9999px",
    tableLayout: "auto", width: "max-content",
  });
  document.body.appendChild(probe);

  const hrow = document.createElement("tr");
  visibleCols.forEach(h => {
    const th = document.createElement("th");
    th.style.whiteSpace = "nowrap";
    th.innerText = HEADER_LABELS_NSEBO[h] || h;
    hrow.appendChild(th);
  });
  probe.appendChild(hrow);

  rows.forEach(r => {
    const row = document.createElement("tr");
    visibleCols.forEach(h => {
      const td = document.createElement("td");
      td.style.whiteSpace = "nowrap";
      td.innerText = r[h] ?? "";
      row.appendChild(td);
    });
    probe.appendChild(row);
  });

  const ths = probe.querySelectorAll("tr:first-child th");
  const widths = {};
  visibleCols.forEach((h, i) => {
    widths[h] = ths[i] ? Math.ceil(ths[i].getBoundingClientRect().width) : 0;
  });
  document.body.removeChild(probe);
  return widths;
}

function parseCSVNseBo(text) {
  const lines = text.trim().split("\n");
  const h = lines[0].split(",");
  return lines.slice(1).map(r => {
    const v = r.split(",");
    const o = {};
    h.forEach((k, i) => o[k] = v[i] ?? "");
    return o;
  });
}

window.registerTabs(addTab => {
  Promise.all([
    window.ensureSectorRsiMapLoaded(),
    fetch(CSV_NSEBO).then(r => r.text()),
  ])
    .then(([, t]) => {
      rawNseBo = window.attachSectorRsiColumns(window.normalizeDrawdownRows(parseCSVNseBo(t)));
      addTab("NSEBO", () => {
        hideAllFeatures();
        document.getElementById("nseboFeature").style.display = "block";
        renderNseBo(rawNseBo);
      });
      updateNseboTime();
    });
});

function renderNseBo(data) {
  const filtered = applyNseboFilter([...data]);
  const sorted   = window.sortRowsByColumn(filtered, nseboSortState.col, nseboSortState.asc);
  nseboColWidths = computeNseboColWidths(sorted);
  drawNseboTable(sorted);
}

function drawNseboTable(rows) {
  const container = document.getElementById("nseboSection");
  container.innerHTML = "";

  const wrapper = document.createElement("div");
  wrapper.className = "portfolio-dropdown-content";

  const countEl = document.createElement("div");
  countEl.style.cssText = "padding:4px 8px;font-size:0.85em;color:var(--text-muted,#888)";
  countEl.textContent = `${rows.length} symbols`;
  wrapper.appendChild(countEl);

  const table = document.createElement("table");
  table.className = "portfolio-section-table";
  buildNseboTable(table, rows);
  wrapper.appendChild(table);
  container.appendChild(wrapper);
}

function buildNseboTable(table, rows) {
  table.innerHTML = "";

  if (!rows.length) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.innerText = "No symbols match the filter criteria.";
    td.className = "text";
    td.colSpan = COLS_NSEBO.length;
    tr.appendChild(td);
    table.appendChild(tr);
    return;
  }

  if (nseboColWidths && Object.keys(nseboColWidths).length) {
    const colgroup = document.createElement("colgroup");
    COLS_NSEBO.forEach(h => {
      const col = document.createElement("col");
      if (h === "Chart") {
        col.style.width = "42px";
      } else if (h in rows[0] && nseboColWidths[h]) {
        col.style.width = nseboColWidths[h] + "px";
      }
      colgroup.appendChild(col);
    });
    table.appendChild(colgroup);
    table.style.tableLayout = "fixed";
    table.style.width = "max-content";
  }

  // Header row
  const tr = document.createElement("tr");
  COLS_NSEBO.forEach(h => {
    if (h !== "Chart" && !(h in rows[0])) return;
    const th = document.createElement("th");
    th.innerText = HEADER_LABELS_NSEBO[h] || h;
    if (h !== "Chart") {
      th.onclick = () => {
        if (nseboSortState.col === h) {
          nseboSortState.asc = !nseboSortState.asc;
        } else {
          nseboSortState = { col: h, asc: false };
        }
        renderNseBo(rawNseBo);
      };
    }
    if (h === "Symbol") th.classList.add("symbol-col");
    tr.appendChild(th);
  });
  table.appendChild(tr);

  // Data rows
  rows.forEach(r => {
    const row = document.createElement("tr");
    COLS_NSEBO.forEach(h => {
      if (h !== "Chart" && !(h in r)) return;
      const td = document.createElement("td");
      const v = r[h];

      if (h === "Symbol") {
        td.className = "symbol-col text";
        td.innerHTML = `<a href="#" onclick="openChartNseBo('${v}')">${v}</a>`;
      } else if (h === "Chart") {
        td.className = "text";
        td.style.whiteSpace = "nowrap";
        ["D", "W", "M"].forEach(tf => {
          const a = document.createElement("a");
          a.href = "#";
          a.textContent = tf;
          a.className = "chart-icon chart-icon-" + tf;
          a.onclick = e => { e.preventDefault(); e.stopPropagation(); openCandleChart(r.Symbol, tf); };
          td.appendChild(a);
        });
      } else {
        if (h === "Trend" && v !== "") {
          td.className = "num";
          const a = document.createElement("a");
          a.href = "#";
          a.textContent = String(Math.round(parseFloat(v)));
          a.onclick = e => {
            e.preventDefault();
            e.stopPropagation();
            openCandleChart(r.Symbol, "Y");
          };
          td.appendChild(a);
        } else if (["D_BO", "W_BO", "M_BO"].includes(h) && v !== "") {
          // BO columns are discrete levels; display as integer.
          td.innerText = Math.round(parseFloat(v));
        } else {
          td.innerText = v;
        }
        if (h !== "Trend") {
          td.className = (!isNaN(v) && v !== "") ? "num" : "text";
        }
        td.style.whiteSpace = "nowrap";
      }

      if (h !== "Chart") {
        window.applyCommonCellClasses(td, h, v, {
          chgColumns: ["D_CHG", "W_CHG", "M_CHG"],
        });
      }
      row.appendChild(td);
    });
    table.appendChild(row);
  });
}

function openChartNseBo(symbol) {
  window.open(`https://in.tradingview.com/chart/?symbol=NSE:${encodeURIComponent(symbol)}`, "_blank");
}

function updateNseboTime() {
  fetch(CSV_NSEBO, { method: "HEAD" })
    .then(res => {
      const d = new Date(res.headers.get("Last-Modified"));
      if (Number.isNaN(d.getTime())) return;
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      const hh = String(d.getHours()).padStart(2, "0");
      const mm = String(d.getMinutes()).padStart(2, "0");
      document.getElementById("updateTime_nsebo").innerText = `${y}-${m}-${day}:${hh}:${mm}`;
    });
}
</script>

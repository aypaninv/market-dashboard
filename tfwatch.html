<!-- ===================== TFWATCH FEATURE ===================== -->

<div id="tfwatchFeature" style="display:none">
  <div class="update-time" id="updateTime_tf"></div>
  <div class="content">
    <div id="tfwatchSections"></div>
  </div>
</div>

<script>
const CSV_TFW = "tfwatch_report.csv";

const COLS_TFW = [
  "Symbol","Folio","DD_High",
  "4H_10V20","D_10V20","W_10V20","M_10V20",
  // "W_RSI","M_RSI",
  "W_CHG","M_CHG",
  "CurPrice","Sector","MarketCap","Notes"
];

const HEADER_LABELS_TFW = {
  "4H_10V20": "4H_XC",
  "D_10V20": "D_XC",
  "W_10V20": "W_XC",
  "M_10V20": "M_XC",
};

let rawTF = [];
let tfSections = { High: [], Low: [] };
let tfSortState = {};
let tfSectionOpenState = { High: true, Low: false };
let tfColWidths = {};

function toNumber(value) {
  const num = parseFloat(value);
  return Number.isFinite(num) ? num : NaN;
}

function splitHighLow(rows) {
  const highRows = [];
  const lowRows = [];

  rows.forEach(r => {
    const w10v20 = toNumber(r.W_10V20);
    const h4_10v20 = toNumber(r["4H_10V20"]);

    if (w10v20 > 0 && h4_10v20 > 0) highRows.push(r);
    else lowRows.push(r);
  });

  return { highRows, lowRows };
}

function computeSharedColWidths(allRows) {
  if (!allRows.length) return {};
  const visibleCols = COLS_TFW.filter(h => h in allRows[0]);
  if (!visibleCols.length) return {};

  const probe = document.createElement("table");
  probe.className = "portfolio-section-table";
  Object.assign(probe.style, {
    position: "absolute",
    visibility: "hidden",
    top: "-9999px",
    left: "-9999px",
    tableLayout: "auto",
    width: "max-content",
  });
  document.body.appendChild(probe);

  const hrow = document.createElement("tr");
  visibleCols.forEach(h => {
    const th = document.createElement("th");
    th.style.whiteSpace = "nowrap";
    th.innerText = HEADER_LABELS_TFW[h] || h;
    hrow.appendChild(th);
  });
  probe.appendChild(hrow);

  allRows.forEach(r => {
    const row = document.createElement("tr");
    visibleCols.forEach(h => {
      const td = document.createElement("td");
      td.style.whiteSpace = "nowrap";
      td.innerText = r[h] ?? "";
      row.appendChild(td);
    });
    probe.appendChild(row);
  });

  const ths = probe.querySelectorAll("tr:first-child th");
  const widths = {};
  visibleCols.forEach((h, i) => {
    widths[h] = ths[i] ? Math.ceil(ths[i].getBoundingClientRect().width) : 0;
  });
  document.body.removeChild(probe);
  return widths;
}

function parseCSV(text) {
  const lines = text.trim().split("\n");
  const h = lines[0].split(",");
  return lines.slice(1).map(r => {
    const v = r.split(",");
    let o = {};
    h.forEach((k, i) => o[k] = v[i] ?? "");
    return o;
  });
}

window.registerTabs(addTab => {
  fetch(CSV_TFW)
    .then(r => r.text())
    .then(t => {
      rawTF = parseCSV(t);
      [...new Set(rawTF.map(d => d.Folio).filter(Boolean))]
        .forEach(folio =>
          addTab(folio, () => {
            hideAllFeatures();
            document.getElementById("tfwatchFeature").style.display = "block";
            renderTF(rawTF.filter(d => d.Folio === folio));
          })
        );
      updateTFTime();
    });
});

function renderTF(data) {
  const { highRows, lowRows } = splitHighLow([...data]);
  tfSections = {
    High: window.sortRowsByCustomDefault(highRows, "4H_10V20"),
    Low: window.sortRowsByCustomDefault(lowRows, "4H_10V20"),
  };
  tfColWidths = computeSharedColWidths([...highRows, ...lowRows]);
  tfSortState = {};
  tfSectionOpenState = { High: true, Low: false };
  drawTFSections();
}

function drawTFSections() {
  const container = document.getElementById("tfwatchSections");
  container.innerHTML = "";

  container.appendChild(createTFSection("High", tfSections.High, "High"));
  container.appendChild(createTFSection("Low", tfSections.Low, "Low"));
}

function createTFSection(title, rows, sectionKey) {
  const details = document.createElement("details");
  details.className = "portfolio-dropdown";
  details.open = Boolean(tfSectionOpenState[sectionKey]);
  details.addEventListener("toggle", () => {
    tfSectionOpenState[sectionKey] = details.open;
  });

  const summary = document.createElement("summary");
  summary.textContent = `${title} (${rows.length})`;
  details.appendChild(summary);

  const wrapper = document.createElement("div");
  wrapper.className = "portfolio-dropdown-content";

  const table = document.createElement("table");
  drawTFTable(table, rows, sectionKey);

  wrapper.appendChild(table);
  details.appendChild(wrapper);
  return details;
}

function drawTFTable(table, rows, sectionKey) {
  table.innerHTML = "";
  const sortInfo = tfSortState[sectionKey];
  const data = sortInfo
    ? window.sortRowsByColumn(rows, sortInfo.col, sortInfo.asc)
    : rows;

  if (!data.length) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.innerText = "No data";
    td.className = "text";
    td.colSpan = COLS_TFW.length;
    tr.appendChild(td);
    table.appendChild(tr);
    return;
  }

  if (tfColWidths && Object.keys(tfColWidths).length) {
    const colgroup = document.createElement("colgroup");
    COLS_TFW.forEach(h => {
      if (!(h in data[0]) || !tfColWidths[h]) return;
      const col = document.createElement("col");
      col.style.width = tfColWidths[h] + "px";
      colgroup.appendChild(col);
    });
    table.appendChild(colgroup);
    table.style.tableLayout = "fixed";
    table.style.width = "max-content";
  }

  const tr = document.createElement("tr");
  COLS_TFW.forEach(h => {
    if (!(h in data[0])) return;
    const th = document.createElement("th");
    th.innerText = HEADER_LABELS_TFW[h] || h;
    th.onclick = () => {
      const existing = tfSortState[sectionKey];
      const asc = existing && existing.col === h ? !existing.asc : true;
      tfSortState[sectionKey] = { col: h, asc };
      tfSectionOpenState[sectionKey] = true;
      drawTFSections();
    };
    if (h === "Symbol") th.classList.add("symbol-col");
    tr.appendChild(th);
  });
  table.appendChild(tr);

  data.forEach(r => {
    const row = document.createElement("tr");
    COLS_TFW.forEach(h => {
      if (!(h in r)) return;
      const td = document.createElement("td");
      const v = r[h];

      if (h === "Symbol") {
        td.className = "symbol-col text";
        td.innerHTML = `<a href="#" onclick="openChart('${v}')">${v}</a>`;
      } else {
        td.innerText = v;
        td.className = (!isNaN(v) && v !== "") ? "num" : "text";
      }

      window.applyCommonCellClasses(td, h, v, {
        chgColumns: ["W_CHG", "M_CHG"],
      });
      row.appendChild(td);
    });
    table.appendChild(row);
  });
}

function openChart(symbol) {
  window.open(`https://in.tradingview.com/chart/?symbol=NSE:${encodeURIComponent(symbol)}`, "_blank");
}

function updateTFTime() {
  fetch(CSV_TFW, { method: "HEAD" })
    .then(res => {
      const d = new Date(res.headers.get("Last-Modified"));
      document.getElementById("updateTime_tf").innerText =
        d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",hour12:false}) +
        " / " +
        d.toLocaleDateString("en-IN",{year:"numeric",month:"short",day:"2-digit"});
    });
}
</script>

<!-- ===================== TFWATCH FEATURE ===================== -->

<div id="tfwatchFeature" style="display:none">
  <div class="update-time" id="updateTime_tfw"></div>
  <div class="content">
    <div id="tfwatchSections"></div>
  </div>
</div>

<script>
const CSV_TFW = "tfwatch_report.csv";

const COLS_TFW = [
  "Symbol","Chart","Folio",
  "DD_High",
  "D_BO","W_BO","M_BO",
  // "W_EMA10","M_EMA10",
  "W_SL","M_SL",
  "W_CHG","M_CHG",
  "CurPrice","Sector","MarketCap","Notes"
];

const HEADER_LABELS_TFW = {
  "W_BO": "W_BO",
  "D_BO": "D_BO",
  "W_SL": "W_SL",
  "M_SL": "M_SL",
  "W_EMA10": "W_E10",
  "M_EMA10": "M_E10",
  "D_EMA10": "D_E10",
};

let rawTF = [];
let tfSections = { ALL: [], Week: [], Daily: [] };
let tfSortState = {};
let tfSectionOpenState = { High: true, Low: false };
let tfColWidths = {};


function toNumberTFW(value) {
  const num = parseFloat(value);
  return Number.isFinite(num) ? num : NaN;
}

function splitHighLowTFW(rows) {
  const highRows = [];
  const lowRows = [];

  rows.forEach(r => {
    const dBO = toNumberTFW(r.D_BO);
    const mBO = toNumberTFW(r.M_BO);
    const wSL = toNumberTFW(r.W_SL);

    if (dBO >= 0 && wSL > 0 && wSL < 12 && mBO >= 0 ) {
      highRows.push(r);
    } else {
      lowRows.push(r);
    }
  });

  return { highRows, lowRows };
}

function computeSharedColWidthsTFW(allRows) {
  if (!allRows.length) return {};
  const visibleCols = COLS_TFW.filter(h => h !== "Chart" && h in allRows[0]);
  if (!visibleCols.length) return {};

  const probe = document.createElement("table");
  probe.className = "portfolio-section-table";
  Object.assign(probe.style, {
    position: "absolute",
    visibility: "hidden",
    top: "-9999px",
    left: "-9999px",
    tableLayout: "auto",
    width: "max-content",
  });
  document.body.appendChild(probe);

  const hrow = document.createElement("tr");
  visibleCols.forEach(h => {
    const th = document.createElement("th");
    th.style.whiteSpace = "nowrap";
    th.innerText = HEADER_LABELS_TFW[h] || h;
    hrow.appendChild(th);
  });
  probe.appendChild(hrow);

  allRows.forEach(r => {
    const row = document.createElement("tr");
    visibleCols.forEach(h => {
      const td = document.createElement("td");
      td.style.whiteSpace = "nowrap";
      td.innerText = r[h] ?? "";
      row.appendChild(td);
    });
    probe.appendChild(row);
  });

  const ths = probe.querySelectorAll("tr:first-child th");
  const widths = {};
  visibleCols.forEach((h, i) => {
    widths[h] = ths[i] ? Math.ceil(ths[i].getBoundingClientRect().width) : 0;
  });
  document.body.removeChild(probe);
  return widths;
}

function parseCSVTFW(text) {
  const lines = text.trim().split("\n");
  const h = lines[0].split(",");
  return lines.slice(1).map(r => {
    const v = r.split(",");
    let o = {};
    h.forEach((k, i) => o[k] = v[i] ?? "");
    return o;
  });
}

window.registerTabs(addTab => {
  fetch(CSV_TFW)
    .then(r => r.text())
    .then(t => {
      rawTF = parseCSVTFW(t);
      [...new Set(rawTF.map(d => d.Folio).filter(Boolean).map(f => f.replace(/_Low$/, '')))]
        .forEach(folio =>
          addTab(folio, () => {
            hideAllFeatures();
            document.getElementById("tfwatchFeature").style.display = "block";
            const folioBase = folio.replace(/_Low$/, '');
            renderTF(rawTF.filter(d => d.Folio === folioBase || d.Folio === folioBase + "_Low"));
          })
        );
      updateTFTime();
    });
});

function renderTF(data) {
  const { highRows, lowRows } = splitHighLowTFW([...data]);
  tfSections = {
    High: window.sortRowsByColumn(highRows, "D_BO", false),
    Low: window.sortRowsByColumn(lowRows, "D_BO", false),
  };
  tfColWidths = computeSharedColWidthsTFW([...highRows, ...lowRows]);
  tfSortState = {};
  tfSectionOpenState = { High: true, Low: false };
  drawTFSections();
}

function drawTFSections() {
  const container = document.getElementById("tfwatchSections");
  container.innerHTML = "";

  container.appendChild(createTFSection("High", tfSections.High, "High"));
  container.appendChild(createTFSection("Low", tfSections.Low, "Low"));
}

function createTFSection(title, rows, sectionKey) {
  const details = document.createElement("details");
  details.className = "portfolio-dropdown";
  details.open = Boolean(tfSectionOpenState[sectionKey]);
  details.addEventListener("toggle", () => {
    tfSectionOpenState[sectionKey] = details.open;
  });

  const summary = document.createElement("summary");
  summary.textContent = `${title} (${rows.length})`;
  summary.style.cursor = "pointer";
  summary.onclick = (e) => {
    e.preventDefault();
    details.open = !details.open;
  };
  details.appendChild(summary);

  const wrapper = document.createElement("div");
  wrapper.className = "portfolio-dropdown-content";

  const table = document.createElement("table");
  drawTFTable(table, rows, sectionKey);

  wrapper.appendChild(table);
  details.appendChild(wrapper);
  return details;
}

function drawTFTable(table, rows, sectionKey) {
  table.innerHTML = "";
  const sortInfo = tfSortState[sectionKey];
  const data = sortInfo
    ? window.sortRowsByColumn(rows, sortInfo.col, sortInfo.asc)
    : rows;

  if (!data.length) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.innerText = "No data";
    td.className = "text";
    td.colSpan = COLS_TFW.length;
    tr.appendChild(td);
    table.appendChild(tr);
    return;
  }

  if (tfColWidths && Object.keys(tfColWidths).length) {
    const colgroup = document.createElement("colgroup");
    COLS_TFW.forEach(h => {
      const col = document.createElement("col");
      if (h === "Chart") {
        col.style.width = "42px";
      } else if (h in data[0] && tfColWidths[h]) {
        col.style.width = tfColWidths[h] + "px";
      }
      colgroup.appendChild(col);
    });
    table.appendChild(colgroup);
    table.style.tableLayout = "fixed";
    table.style.width = "max-content";
  }

  const tr = document.createElement("tr");
  COLS_TFW.forEach(h => {
    if (h !== "Chart" && !(h in data[0])) return;
    const th = document.createElement("th");
    th.innerText = HEADER_LABELS_TFW[h] || h;
    if (h !== "Chart") {
      th.onclick = () => {
        const existing = tfSortState[sectionKey];
        const asc = existing && existing.col === h ? !existing.asc : true;
        tfSortState[sectionKey] = { col: h, asc };
        tfSectionOpenState[sectionKey] = true;
        drawTFSections();
      };
    }
    if (h === "Symbol") th.classList.add("symbol-col");
    tr.appendChild(th);
  });
  table.appendChild(tr);

  data.forEach(r => {
    const row = document.createElement("tr");
    COLS_TFW.forEach(h => {
      if (h !== "Chart" && !(h in r)) return;
      const td = document.createElement("td");
      const v = r[h];

      if (h === "Symbol") {
        td.className = "symbol-col text";
        td.innerHTML = `<a href="#" onclick="openTVChart('${v}')">${v}</a>`;
      } else if (h === "Chart") {
        td.className = "text";
        td.style.whiteSpace = "nowrap";
        const tfs = ["D", "W", "M"];
        tfs.forEach(tf => {
          const a = document.createElement("a");
          a.href = "#";
          a.textContent = tf;
          a.className = "chart-icon chart-icon-" + tf;
          a.onclick = e => { e.preventDefault(); e.stopPropagation(); openCandleChart(r.Symbol, tf); };
          td.appendChild(a);
        });
      } else {
        // Format BO columns as integers
        if (["D_BO", "W_BO", "M_BO"].includes(h) && v !== "") {
          td.innerText = Math.round(parseFloat(v));
        } else {
          td.innerText = v;
        }
        td.className = (!isNaN(v) && v !== "") ? "num" : "text";
      }

      if (h !== "Chart") {
        window.applyCommonCellClasses(td, h, v, {
          chgColumns: ["D_CHG", "W_CHG", "M_CHG"],
        });
      }
      row.appendChild(td);
    });
    table.appendChild(row);
  });
}

function openTVChart(symbol) {
  window.open(`https://in.tradingview.com/chart/?symbol=NSE:${encodeURIComponent(symbol)}`, "_blank");
}

function updateTFTime() {
  fetch(CSV_TFW, { method: "HEAD" })
    .then(res => {
      const d = new Date(res.headers.get("Last-Modified"));
      document.getElementById("updateTime_tfw").innerText =
        d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",hour12:false}) +
        " / " +
        d.toLocaleDateString("en-IN",{year:"numeric",month:"short",day:"2-digit"});
    });
}
</script>

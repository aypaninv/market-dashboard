<!-- ===================== TFWATCH FEATURE ===================== -->

<div id="tfwatchFeature" style="display:none">
  <div class="update-time" id="updateTime_tf"></div>
  <div class="content">
    <table id="dataTable_tf"></table>
  </div>
</div>

<script>
const CSV_TFW = "tfwatch_report.csv";

const COLS_TFW = [
  "Symbol","Folio","DD_High",
  "4H_10V20","D_10V20","W_10V20","M_10V20",
  // "W_RSI","M_RSI",
  "W_CHG","M_CHG",
  "CurPrice","Sector","MarketCap","Notes"
];

const HEADER_LABELS_TFW = {
  "4H_10V20": "4H_XC",
  "D_10V20": "D_XC",
  "W_10V20": "W_XC",
  "M_10V20": "M_XC",
};

let rawTF = [];
let curTF = [];
let tfSortState = {};
let csvPathTF = CSV_TFW;

function fetchCsvTextWithFallback(fileName) {
  const candidates = [fileName, `output/${fileName}`, `../output/${fileName}`];

  const tryFetch = index => {
    if (index >= candidates.length) {
      return Promise.reject(new Error(`Unable to load ${fileName} from runtime paths`));
    }

    return fetch(candidates[index], { cache: "no-store" })
      .then(res => {
        if (!res.ok) throw new Error("Not found");
        csvPathTF = candidates[index];
        return res.text();
      })
      .catch(() => tryFetch(index + 1));
  };

  return tryFetch(0);
}

function parseCSV(text) {
  const lines = text.trim().split("\n");
  const h = lines[0].split(",");
  return lines.slice(1).map(r => {
    const v = r.split(",");
    let o = {};
    h.forEach((k, i) => o[k] = v[i] ?? "");
    return o;
  });
}

window.registerTabs(addTab => {
  fetchCsvTextWithFallback(CSV_TFW)
    .then(t => {
      rawTF = parseCSV(t);
      [...new Set(rawTF.map(d => d.Folio).filter(Boolean))]
        .forEach(folio =>
          addTab(folio, () => {
            hideAllFeatures();
            document.getElementById("tfwatchFeature").style.display = "block";
            renderTF(rawTF.filter(d => d.Folio === folio));
          })
        );
      updateTFTime();
    })
    .catch(err => {
      console.error(err.message);
    });
});

function renderTF(data) {
  curTF = [...data];
  tfSortState = {};

  curTF = window.sortRowsByCustomDefault(curTF, "4H_10V20");

  drawTF(curTF);
}


function drawTF(data) {
  const table = document.getElementById("dataTable_tf");
  table.innerHTML = "";

  const tr = document.createElement("tr");
  COLS_TFW.forEach(h => {
    if (!(h in data[0])) return;
    const th = document.createElement("th");
    th.innerText = HEADER_LABELS_TFW[h] || h;
    th.onclick = () => sortTF(h);
    if (h === "Symbol") th.classList.add("symbol-col");
    tr.appendChild(th);
  });
  table.appendChild(tr);

  data.forEach(r => {
    const row = document.createElement("tr");
    COLS_TFW.forEach(h => {
      if (!(h in r)) return;
      const td = document.createElement("td");
      const v = r[h];

      if (h === "Symbol") {
        td.className = "symbol-col text";
        td.innerHTML = `<a href="#" onclick="openChart('${v}')">${v}</a>`;
      } else {
        td.innerText = v;
        td.className = (!isNaN(v) && v !== "") ? "num" : "text";
      }

      window.applyCommonCellClasses(td, h, v, {
        chgColumns: ["W_CHG", "M_CHG"],
      });
      row.appendChild(td);
    });
    table.appendChild(row);
  });
}

function sortTF(col) {
  const asc = !tfSortState[col];
  tfSortState = { [col]: asc };
  curTF = window.sortRowsByColumn(curTF, col, asc);
  drawTF(curTF);
}

function openChart(symbol) {
  window.open(`https://in.tradingview.com/chart/?symbol=NSE:${encodeURIComponent(symbol)}`, "_blank");
}

function updateTFTime() {
  fetch(csvPathTF, { method: "HEAD" })
    .then(res => {
      const d = new Date(res.headers.get("Last-Modified"));
      document.getElementById("updateTime_tf").innerText =
        d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",hour12:false}) +
        " / " +
        d.toLocaleDateString("en-IN",{year:"numeric",month:"short",day:"2-digit"});
    })
    .catch(() => {});
}
</script>

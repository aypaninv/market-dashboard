<!-- ===================== TFWATCH FEATURE ===================== -->

<div id="tfwatchFeature" style="display:none">
  <div class="update-time" id="updateTime_tf"></div>
  <div class="content">
    <table id="dataTable_tf"></table>
  </div>
</div>

<script>
const CSV_TFW = "tfwatch_report.csv";

const COLS_TFW = [
  "Symbol","Folio","DD_High",
  "D_MACD","D_EMA20","W_EMA10","D_10V20","W_10V20",
  // "W_RSI","M_RSI",
  "W_CHG","M_CHG",
  "CurPrice","Sector","MarketCap","Notes"
];

let rawTF = [];
let curTF = [];
let tfSortState = {};

function parseCSV(text) {
  const lines = text.trim().split("\n");
  const h = lines[0].split(",");
  return lines.slice(1).map(r => {
    const v = r.split(",");
    let o = {};
    h.forEach((k, i) => o[k] = v[i] ?? "");
    return o;
  });
}

window.registerTabs(addTab => {
  fetch(CSV_TFW)
    .then(r => r.text())
    .then(t => {
      rawTF = parseCSV(t);
      [...new Set(rawTF.map(d => d.Folio).filter(Boolean))]
        .forEach(folio =>
          addTab(folio, () => {
            hideAllFeatures();
            document.getElementById("tfwatchFeature").style.display = "block";
            renderTF(rawTF.filter(d => d.Folio === folio));
          })
        );
      updateTFTime();
    });
});

function sortByDMACDDefault(a, b) {
  const x = parseFloat(a["D_MACD"]);
  const y = parseFloat(b["D_MACD"]);

  if (isNaN(x) && isNaN(y)) return 0;
  if (isNaN(x)) return 1;
  if (isNaN(y)) return -1;

  if (x > 0 && y > 0) return x - y;
  if (x > 0) return -1;
  if (y > 0) return 1;

  if (x === 0 && y === 0) return 0;
  if (x === 0) return -1;
  if (y === 0) return 1;

  return x - y;
}

function renderTF(data) {
  curTF = [...data];
  tfSortState = {};

  curTF.sort(sortByDMACDDefault);

  drawTF(curTF);
}


function drawTF(data) {
  const table = document.getElementById("dataTable_tf");
  table.innerHTML = "";

  const tr = document.createElement("tr");
  COLS_TFW.forEach(h => {
    if (!(h in data[0])) return;
    const th = document.createElement("th");
    th.innerText = h;
    th.onclick = () => sortTF(h);
    if (h === "Symbol") th.classList.add("symbol-col");
    tr.appendChild(th);
  });
  table.appendChild(tr);

  data.forEach(r => {
    const row = document.createElement("tr");
    COLS_TFW.forEach(h => {
      if (!(h in r)) return;
      const td = document.createElement("td");
      const v = r[h];

      if (h === "Symbol") {
        td.className = "symbol-col text";
        td.innerHTML = `<a href="#" onclick="openChart('${v}')">${v}</a>`;
      } else {
        td.innerText = v;
        td.className = (!isNaN(v) && v !== "") ? "num" : "text";
      }

      if (h === "DD_High" && parseFloat(v) < -15) td.classList.add("orange");
      if (h.includes("MACD") && v !== "") td.classList.add(parseFloat(v) >= 0 ? "green" : "orange");
      if (["W_CHG", "M_CHG"].includes(h) && !isNaN(v) && parseFloat(v) < -8) {
        td.classList.add("orange");
      }
      if ((h === "W_RSI" || h === "M_RSI") && v !== "") {
        const rsi = parseFloat(v);
        if (rsi > 54) td.classList.add("green");
        else if (rsi < 54) td.classList.add("red");
      }
      if (["D_10V20", "W_EMA10", "D_EMA20", "W_10V20"].includes(h) && !isNaN(v)) {
        if (parseFloat(v) < 0) {
          td.classList.add("red");
        }
      }
      if (["W_EMA10", "D_EMA20"].includes(h) && !isNaN(v)) {
        if (parseFloat(v) >= 12) {
          td.classList.add("orange");
        }
      }
      row.appendChild(td);
    });
    table.appendChild(row);
  });
}

function sortTF(col) {
  const asc = !tfSortState[col];
  tfSortState = { [col]: asc };
  curTF.sort((a,b)=>asc?parseFloat(a[col])-parseFloat(b[col]):parseFloat(b[col])-parseFloat(a[col]));
  drawTF(curTF);
}

function openChart(symbol) {
  window.open(`https://in.tradingview.com/chart/?symbol=NSE:${encodeURIComponent(symbol)}`, "_blank");
}

function updateTFTime() {
  fetch(CSV_TFW, { method: "HEAD" })
    .then(res => {
      const d = new Date(res.headers.get("Last-Modified"));
      document.getElementById("updateTime_tf").innerText =
        d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",hour12:false}) +
        " / " +
        d.toLocaleDateString("en-IN",{year:"numeric",month:"short",day:"2-digit"});
    });
}
</script>

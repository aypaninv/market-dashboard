<!-- ===================== TFSTAGE2 FEATURE ===================== -->

<div id="tfstage2Feature" style="display:none">
  <div class="update-time" id="updateTime_tfs2"></div>
  <div class="content">
    <div id="tfstage2Sections"></div>
  </div>
</div>

<script>
const CSV_TFS2 = "tfstage2_report.csv";

const COLS_TFS2 = [
  "Symbol","Chart","Folio",
  "DD_High","D_BO","W_BO","M_BO",
  "4H_XC","D_XC","W_XC","M_XC",
  "D_EMA20","W_EMA10","D_CHG","W_CHG","M_CHG",
  "CurPrice","Sector","MarketCap","Notes"
];

const HEADER_LABELS_TFS2 = {

  "4H_XC": "4H_XC",
  "D_XC": "D_XC",
  "W_XC": "W_XC",
  "W_BO": "W_BO",
  "D_BO": "D_BO",
  "M_XC": "M_XC",
  "D_EMA20": "D_E20",
  "W_EMA10": "W_E10",
};

let rawTFS2 = [];
let tfs2Sections = { High: [], Low: [] };
let tfs2SortState = {};
let tfs2SectionOpenState = { High: true, Low: false };
let tfs2ColWidths = {};

function toNumberTFS2(value) {
  const num = parseFloat(value);
  return Number.isFinite(num) ? num : NaN;
}

function splitHighLowTFS2(rows) {
  const allRows = [];
  const weekRows = [];
  const dailyRows = [];

  rows.forEach(r => {
    const mBO = toNumberTFS2(r.M_BO);
    const wBO = toNumberTFS2(r.W_BO);
    const dBO = toNumberTFS2(r.D_BO);

    // ALL: M_BO >= 0 && W_BO >= 0 && D_BO >= 0
    if (mBO >= 0 && wBO >= 0 && dBO >= 0) {
      allRows.push(r);
    }
    
    // Week: W_BO >= 0
    if (wBO >= 0) {
      weekRows.push(r);
    }
    
    // Daily: D_BO >= 0
    if (dBO >= 0) {
      dailyRows.push(r);
    }
  });

  return { allRows, weekRows, dailyRows };
}

function computeSharedColWidthsTFS2(allRows) {
  if (!allRows.length) return {};
  const visibleCols = COLS_TFS2.filter(h => h !== "Chart" && h in allRows[0]);
  if (!visibleCols.length) return {};

  const probe = document.createElement("table");
  probe.className = "portfolio-section-table";
  Object.assign(probe.style, {
    position: "absolute",
    visibility: "hidden",
    top: "-9999px",
    left: "-9999px",
    tableLayout: "auto",
    width: "max-content",
  });
  document.body.appendChild(probe);

  const hrow = document.createElement("tr");
  visibleCols.forEach(h => {
    const th = document.createElement("th");
    th.style.whiteSpace = "nowrap";
    th.innerText = HEADER_LABELS_TFS2[h] || h;
    hrow.appendChild(th);
  });
  probe.appendChild(hrow);

  allRows.forEach(r => {
    const row = document.createElement("tr");
    visibleCols.forEach(h => {
      const td = document.createElement("td");
      td.style.whiteSpace = "nowrap";
      td.innerText = r[h] ?? "";
      row.appendChild(td);
    });
    probe.appendChild(row);
  });

  const ths = probe.querySelectorAll("tr:first-child th");
  const widths = {};
  visibleCols.forEach((h, i) => {
    widths[h] = ths[i] ? Math.ceil(ths[i].getBoundingClientRect().width) : 0;
  });
  document.body.removeChild(probe);
  return widths;
}

function parseCSVStage2(text) {
  const lines = text.trim().split("\n");
  const h = lines[0].split(",");
  return lines.slice(1).map(r => {
    const v = r.split(",");
    let o = {};
    h.forEach((k, i) => o[k] = v[i] ?? "");
    return o;
  });
}

window.registerTabs(addTab => {
  fetch(CSV_TFS2)
    .then(r => r.text())
    .then(t => {
      rawTFS2 = parseCSVStage2(t);
      [...new Set(rawTFS2.map(d => d.Folio).filter(Boolean).map(f => f.replace(/_Low$/, '')))]
        .forEach(folio =>
          addTab(folio, () => {
            hideAllFeatures();
            document.getElementById("tfstage2Feature").style.display = "block";
            const folioBase = folio.replace(/_Low$/, '');
            renderTFS2(rawTFS2.filter(d => d.Folio === folioBase || d.Folio === folioBase + "_Low"));
          })
        );
      updateTFS2Time();
    });
});

function renderTFS2(data) {
  const { allRows, weekRows, dailyRows } = splitHighLowTFS2([...data]);
  tfs2Sections = {
    ALL: window.sortRowsByColumn(allRows, "D_BO", false),
    Week: window.sortRowsByColumn(weekRows, "D_BO", false),
    Daily: window.sortRowsByColumn(dailyRows, "D_BO", false),
  };
  tfs2ColWidths = computeSharedColWidthsTFS2([...allRows, ...weekRows, ...dailyRows]);
  tfs2SortState = {};
  tfs2SectionOpenState = { ALL: false, Week: false, Daily: false };
  drawTFS2Sections();
}

function drawTFS2Sections() {
  const container = document.getElementById("tfstage2Sections");
  container.innerHTML = "";

  container.appendChild(createTFS2Section("ALL", tfs2Sections.ALL, "ALL"));
  container.appendChild(createTFS2Section("Week", tfs2Sections.Week, "Week"));
  container.appendChild(createTFS2Section("Daily", tfs2Sections.Daily, "Daily"));
}

function createTFS2Section(title, rows, sectionKey) {
  const details = document.createElement("details");
  details.className = "portfolio-dropdown";
  details.open = Boolean(tfs2SectionOpenState[sectionKey]);
  details.addEventListener("toggle", () => {
    tfs2SectionOpenState[sectionKey] = details.open;
  });

  const summary = document.createElement("summary");
  summary.textContent = `${title} (${rows.length})`;
  summary.style.cursor = "pointer";
  summary.onclick = (e) => {
    e.preventDefault();
    details.open = !details.open;
  };
  details.appendChild(summary);

  const wrapper = document.createElement("div");
  wrapper.className = "portfolio-dropdown-content";

  const table = document.createElement("table");
  drawTFS2Table(table, rows, sectionKey);

  wrapper.appendChild(table);
  details.appendChild(wrapper);
  return details;
}

function drawTFS2Table(table, rows, sectionKey) {
  table.innerHTML = "";
  const sortInfo = tfs2SortState[sectionKey];
  const data = sortInfo
    ? window.sortRowsByColumn(rows, sortInfo.col, sortInfo.asc)
    : rows;

  if (!data.length) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.innerText = "No data";
    td.className = "text";
    td.colSpan = COLS_TFS2.length;
    tr.appendChild(td);
    table.appendChild(tr);
    return;
  }

  if (tfs2ColWidths && Object.keys(tfs2ColWidths).length) {
    const colgroup = document.createElement("colgroup");
    COLS_TFS2.forEach(h => {
      const col = document.createElement("col");
      if (h === "Chart") {
        col.style.width = "42px";
      } else if (h in data[0] && tfs2ColWidths[h]) {
        col.style.width = tfs2ColWidths[h] + "px";
      }
      colgroup.appendChild(col);
    });
    table.appendChild(colgroup);
    table.style.tableLayout = "fixed";
    table.style.width = "max-content";
  }

  const tr = document.createElement("tr");
  COLS_TFS2.forEach(h => {
    if (h !== "Chart" && !(h in data[0])) return;
    const th = document.createElement("th");
    th.innerText = HEADER_LABELS_TFS2[h] || h;
    if (h !== "Chart") {
      th.onclick = () => {
        const existing = tfs2SortState[sectionKey];
        const asc = existing && existing.col === h ? !existing.asc : true;
        tfs2SortState[sectionKey] = { col: h, asc };
        tfs2SectionOpenState[sectionKey] = true;
        drawTFS2Sections();
      };
    }
    if (h === "Symbol") th.classList.add("symbol-col");
    tr.appendChild(th);
  });
  table.appendChild(tr);

  data.forEach(r => {
    const row = document.createElement("tr");
    COLS_TFS2.forEach(h => {
      if (h !== "Chart" && !(h in r)) return;
      const td = document.createElement("td");
      const v = r[h];

      if (h === "Symbol") {
        td.className = "symbol-col text";
        td.innerHTML = `<a href="#" onclick="openChartTFS2('${v}')">${v}</a>`;
      } else if (h === "Chart") {
        td.className = "text";
        td.style.whiteSpace = "nowrap";
        const tfs = ["D", "W", "M"];
        tfs.forEach(tf => {
          const a = document.createElement("a");
          a.href = "#";
          a.textContent = tf;
          a.className = "chart-icon chart-icon-" + tf;
          a.onclick = e => { e.preventDefault(); e.stopPropagation(); openCandleChart(r.Symbol, tf); };
          td.appendChild(a);
        });
      } else {
        // Format BO columns as integers
        if (["D_BO", "W_BO", "M_BO"].includes(h) && v !== "") {
          td.innerText = Math.round(parseFloat(v));
        } else {
          td.innerText = v;
        }
        td.className = (!isNaN(v) && v !== "") ? "num" : "text";
      }

      if (h !== "Chart") {
        window.applyCommonCellClasses(td, h, v, {
          chgColumns: ["D_CHG", "W_CHG", "M_CHG"],
        });
      }
      row.appendChild(td);
    });
    table.appendChild(row);
  });
}

function openChartTFS2(symbol) {
  window.open(`https://in.tradingview.com/chart/?symbol=NSE:${encodeURIComponent(symbol)}`, "_blank");
}

function updateTFS2Time() {
  fetch(CSV_TFS2, { method: "HEAD" })
    .then(res => {
      const d = new Date(res.headers.get("Last-Modified"));
      document.getElementById("updateTime_tfs2").innerText =
        d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",hour12:false}) +
        " / " +
        d.toLocaleDateString("en-IN",{year:"numeric",month:"short",day:"2-digit"});
    });
}
</script>

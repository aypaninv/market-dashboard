<!-- ===================== NSERC FEATURE ===================== -->

<div id="nsercFeature" style="display:none">
  <div class="update-time" id="updateTime_nserc"></div>
  <div class="content">
    <div id="nsercSection"></div>
  </div>
</div>

<script>
const CSV_NSERC = "nserc_report.csv";

const COLS_NSERC = [
  "Symbol","Chart","Folio",
  "DD_ATH","DD_52W",
  "D_BO",//"W_BO","M_BO",
  "BO_P","SL_P","BO_T","SL_T",
  "MA20","MA50","MA100",
  "Trend","CurPrice","Sector","W_RSI","M_RSI","MarketCap","Notes"
];

const HEADER_LABELS_NSERC = {
  "W_BO": "W_BO",
  "D_BO": "D_BO",
  "Trend": "TD",
};

const NSERC_FILTER = {
  DD_ATH: r => parseFloat(r.DD_ATH) >= 15,
  MA100: r => parseFloat(r.MA100) > 0,
};

let rawNseRcr = [];
let nsercSortState = { col: "D_BO", asc: false };
let nsercColWidths = {};

function toNumberNseRcr(value) {
  const num = parseFloat(value);
  return Number.isFinite(num) ? num : NaN;
}

function applyNsercFilter(rows) {
  return rows.filter(r =>
    Object.values(NSERC_FILTER).every(fn => {
      const result = fn(r);
      return result && !isNaN(result === true ? 1 : result);
    })
  );
}

function computeNsercColWidths(rows) {
  if (!rows.length) return {};
  const visibleCols = COLS_NSERC.filter(h => h !== "Chart" && h in rows[0]);
  if (!visibleCols.length) return {};

  const probe = document.createElement("table");
  probe.className = "portfolio-section-table";
  Object.assign(probe.style, {
    position: "absolute", visibility: "hidden",
    top: "-9999px", left: "-9999px",
    tableLayout: "auto", width: "max-content",
  });
  document.body.appendChild(probe);

  const hrow = document.createElement("tr");
  visibleCols.forEach(h => {
    const th = document.createElement("th");
    th.style.whiteSpace = "nowrap";
    th.innerText = HEADER_LABELS_NSERC[h] || h;
    hrow.appendChild(th);
  });
  probe.appendChild(hrow);

  rows.forEach(r => {
    const row = document.createElement("tr");
    visibleCols.forEach(h => {
      const td = document.createElement("td");
      td.style.whiteSpace = "nowrap";
      td.innerText = r[h] ?? "";
      row.appendChild(td);
    });
    probe.appendChild(row);
  });

  const ths = probe.querySelectorAll("tr:first-child th");
  const widths = {};
  visibleCols.forEach((h, i) => {
    widths[h] = ths[i] ? Math.ceil(ths[i].getBoundingClientRect().width) : 0;
  });
  document.body.removeChild(probe);
  return widths;
}

function parseCSVNseRcr(text) {
  const lines = text.trim().split("\n");
  const h = lines[0].split(",");
  return lines.slice(1).map(r => {
    const v = r.split(",");
    const o = {};
    h.forEach((k, i) => o[k] = v[i] ?? "");
    return o;
  });
}

window.registerTabs(addTab => {
  Promise.all([
    window.ensureSectorRsiMapLoaded(),
    fetch(CSV_NSERC).then(r => r.text()),
  ])
    .then(([, t]) => {
      rawNseRcr = window.attachSectorRsiColumns(window.normalizeDrawdownRows(parseCSVNseRcr(t)));
      addTab("NSERC", () => {
        hideAllFeatures();
        document.getElementById("nsercFeature").style.display = "block";
        renderNseRcr(rawNseRcr);
      });
      updateNsercTime();
    });
});

function renderNseRcr(data) {
  const filtered = applyNsercFilter([...data]);
  const sorted = window.sortRowsByColumn(filtered, nsercSortState.col, nsercSortState.asc);
  nsercColWidths = computeNsercColWidths(sorted);
  drawNseRcrTable(sorted);
}

function drawNseRcrTable(rows) {
  const container = document.getElementById("nsercSection");
  container.innerHTML = "";

  const wrapper = document.createElement("div");
  wrapper.className = "portfolio-dropdown-content";

  const countEl = document.createElement("div");
  countEl.style.cssText = "padding:4px 8px;font-size:0.85em;color:var(--text-muted,#888)";
  countEl.textContent = `${rows.length} symbols`;
  wrapper.appendChild(countEl);

  const table = document.createElement("table");
  table.className = "portfolio-section-table";
  buildNseRcrTable(table, rows);
  wrapper.appendChild(table);
  container.appendChild(wrapper);
}

function buildNseRcrTable(table, rows) {
  table.innerHTML = "";

  if (!rows.length) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.innerText = "No symbols match the filter criteria.";
    td.className = "text";
    td.colSpan = COLS_NSERC.length;
    tr.appendChild(td);
    table.appendChild(tr);
    return;
  }

  if (nsercColWidths && Object.keys(nsercColWidths).length) {
    const colgroup = document.createElement("colgroup");
    COLS_NSERC.forEach(h => {
      const col = document.createElement("col");
      if (h === "Chart") {
        col.style.width = "42px";
      } else if (h in rows[0] && nsercColWidths[h]) {
        col.style.width = nsercColWidths[h] + "px";
      }
      colgroup.appendChild(col);
    });
    table.appendChild(colgroup);
    table.style.tableLayout = "fixed";
    table.style.width = "max-content";
  }

  const tr = document.createElement("tr");
  COLS_NSERC.forEach(h => {
    if (h !== "Chart" && !(h in rows[0])) return;
    const th = document.createElement("th");
    th.innerText = HEADER_LABELS_NSERC[h] || h;
    if (h !== "Chart") {
      th.onclick = () => {
        if (nsercSortState.col === h) {
          nsercSortState.asc = !nsercSortState.asc;
        } else {
          nsercSortState = { col: h, asc: false };
        }
        renderNseRcr(rawNseRcr);
      };
    }
    if (h === "Symbol") th.classList.add("symbol-col");
    tr.appendChild(th);
  });
  table.appendChild(tr);

  rows.forEach(r => {
    const row = document.createElement("tr");
    COLS_NSERC.forEach(h => {
      if (h !== "Chart" && !(h in r)) return;
      const td = document.createElement("td");
      const v = r[h];

      if (h === "Symbol") {
        td.className = "symbol-col text";
        td.innerHTML = `<a href="#" onclick="openChartNseRcr('${v}')">${v}</a>`;
      } else if (h === "Chart") {
        td.className = "text";
        td.style.whiteSpace = "nowrap";
        ["D", "W", "M"].forEach(tf => {
          const a = document.createElement("a");
          a.href = "#";
          a.textContent = tf;
          a.className = "chart-icon chart-icon-" + tf;
          a.onclick = e => { e.preventDefault(); e.stopPropagation(); openCandleChart(r.Symbol, tf); };
          td.appendChild(a);
        });
      } else {
        if (h === "Trend" && v !== "") {
          td.className = "num";
          const a = document.createElement("a");
          a.href = "#";
          a.textContent = String(Math.round(parseFloat(v)));
          a.onclick = e => {
            e.preventDefault();
            e.stopPropagation();
            openCandleChart(r.Symbol, "Y");
          };
          td.appendChild(a);
        } else if (["D_BO", "W_BO", "M_BO"].includes(h) && v !== "") {
          td.innerText = Math.round(parseFloat(v));
        } else {
          td.innerText = v;
        }
        if (h !== "Trend") {
          td.className = (!isNaN(v) && v !== "") ? "num" : "text";
        }
        td.style.whiteSpace = "nowrap";
      }

      if (h !== "Chart") {
        window.applyCommonCellClasses(td, h, v);
      }
      row.appendChild(td);
    });
    table.appendChild(row);
  });
}

function openChartNseRcr(symbol) {
  window.open(`https://in.tradingview.com/chart/?symbol=NSE:${encodeURIComponent(symbol)}`, "_blank");
}

function updateNsercTime() {
  fetch(CSV_NSERC, { method: "HEAD" })
    .then(res => {
      const d = new Date(res.headers.get("Last-Modified"));
      if (Number.isNaN(d.getTime())) return;
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      const hh = String(d.getHours()).padStart(2, "0");
      const mm = String(d.getMinutes()).padStart(2, "0");
      document.getElementById("updateTime_nserc").innerText = `${y}-${m}-${day}:${hh}:${mm}`;
    });
}
</script>

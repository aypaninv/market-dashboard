<!-- ===================== SUMMARY FEATURE ===================== -->

<div id="summaryFeature" style="display:none">
  <div class="content summary-shell">
    <div class="summary-header">
      <h2>Portfolio Summary</h2>
      <div class="summary-subtitle">Core vs Sate allocation, sector mix, and PnL trend</div>
    </div>

    <div id="summaryCards" class="summary-cards"></div>

    <div class="summary-grid">
      <div class="chart-card">
        <div class="chart-title">Core MarketCap Allocation</div>
        <canvas id="corePieChart" width="360" height="260"></canvas>
        <div id="corePieLegend" class="chart-legend"></div>
      </div>

      <div class="chart-card">
        <div class="chart-title">Sate MarketCap Allocation</div>
        <canvas id="satePieChart" width="360" height="260"></canvas>
        <div id="satePieLegend" class="chart-legend"></div>
      </div>

      <div class="chart-card wide-card">
        <div class="chart-title">Sector Allocation % by Invested Capital</div>
        <canvas id="sectorBarChart" width="760" height="280"></canvas>
        <div id="sectorBarLegend" class="chart-legend"></div>
      </div>

      <div class="chart-card wide-card">
        <div class="chart-title">IC vs PnL Trend</div>
        <canvas id="trendChart" width="760" height="280"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const SUMMARY_CSV = "portfolio_report.csv";
  const SUMMARY_COLORS = [
    "#4ade80", "#60a5fa", "#fbbf24", "#f472b6",
    "#2dd4bf", "#c084fc", "#f87171", "#f59e0b",
    "#38bdf8", "#a3e635"
  ];

  function toNumber(value) {
    const v = parseFloat(value);
    return Number.isFinite(v) ? v : 0;
  }

  function parseCSV(text) {
    const lines = text.trim().split(/\r?\n/).filter(Boolean);
    if (!lines.length) return [];
    const headers = lines[0].split(",");
    return lines.slice(1).map(line => {
      const parts = line.split(",");
      const row = {};
      headers.forEach((header, idx) => {
        row[header] = (parts[idx] ?? "").trim();
      });
      return row;
    });
  }

  function pickFirstNonEmpty(row, keys) {
    for (const key of keys) {
      const value = (row[key] ?? "").toString().trim();
      if (value) return value;
    }
    return "";
  }

  function formatCurrency(value) {
    return new Intl.NumberFormat("en-IN", {
      style: "currency",
      currency: "INR",
      maximumFractionDigits: 0,
    }).format(value || 0);
  }

  function formatPercent(value) {
    return `${(value || 0).toFixed(1)}%`;
  }

  function formatSigned(value) {
    const abs = Math.abs(value || 0);
    return `${value >= 0 ? "+" : "-"}${formatCurrency(abs)}`;
  }

  function netInvestedValue(row) {
    const qty = toNumber(row.Qty);
    const avg = toNumber(row.AvgPrice);
    return qty * avg;
  }

  function sectorName(row) {
    return pickFirstNonEmpty(row, ["Sector", "Sector_x", "Sector_y"]) || "Unassigned";
  }

  function marketCapName(row) {
    return pickFirstNonEmpty(row, ["MarketCap", "MarketCap_x", "MarketCap_y"]) || "Unknown";
  }

  function aggregateMap(rows, keyFn) {
    const map = {};
    rows.forEach(row => {
      const key = keyFn(row);
      const invested = netInvestedValue(row);
      if (!key) return;
      map[key] = (map[key] || 0) + invested;
    });
    return Object.entries(map).sort((a, b) => b[1] - a[1]);
  }

  function buildSummary(rows) {
    const dataByFolio = { Core: [], Sate: [] };

    rows.forEach(row => {
      const folio = (row.Folio || "").trim();
      if (folio === "Core" || folio === "Sate") {
        dataByFolio[folio].push(row);
      }
    });

    const summary = {};
    ["Core", "Sate"].forEach(folio => {
      const list = dataByFolio[folio];
      const totalInvested = list.reduce((sum, row) => sum + netInvestedValue(row), 0);
      const totalPnL = list.reduce((sum, row) => sum + toNumber(row.PnL), 0);
      const totalCurrentValue = list.reduce((sum, row) => sum + (toNumber(row.Qty) * toNumber(row.CurPrice)), 0);

      const sectors = aggregateMap(list, sectorName);
      const marketCaps = aggregateMap(list, marketCapName);
      const trend = list
        .map(row => ({
          symbol: row.Symbol || "",
          ic: toNumber(row.IC),
          pnl: toNumber(row.PnL),
          invested: netInvestedValue(row),
        }))
        .filter(point => point.symbol && (Number.isFinite(point.ic) || Number.isFinite(point.pnl)));

      summary[folio] = {
        totalInvested,
        totalPnL,
        totalCurrentValue,
        sectors,
        marketCaps,
        trend,
      };
    });

    return summary;
  }

  function drawPieChart(canvasId, entries, total, folioLabel) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const rect = canvas.getBoundingClientRect();
    const ratio = window.devicePixelRatio || 1;
    canvas.width = rect.width || 360;
    canvas.height = rect.height || 260;
    canvas.width *= ratio;
    canvas.height *= ratio;
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

    const w = canvas.width / ratio;
    const h = canvas.height / ratio;
    const cx = w * 0.42;
    const cy = h * 0.52;
    const radius = Math.min(w * 0.28, h * 0.52);

    ctx.clearRect(0, 0, w, h);
    if (!entries.length || total <= 0) {
      ctx.fillStyle = "#6b7280";
      ctx.font = "14px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(`${folioLabel} — no data`, w / 2, h / 2);
      return;
    }

    let start = -Math.PI / 2;
    entries.forEach(([label, value], index) => {
      const angle = (value / total) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, radius, start, start + angle);
      ctx.closePath();
      ctx.fillStyle = SUMMARY_COLORS[index % SUMMARY_COLORS.length];
      ctx.fill();
      start += angle;
    });

    ctx.beginPath();
    ctx.arc(cx, cy, radius * 0.46, 0, Math.PI * 2);
    ctx.fillStyle = "#111827";
    ctx.fill();

    ctx.fillStyle = "#e5e7eb";
    ctx.font = "600 15px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(folioLabel, cx, cy + 5);

    const legend = document.getElementById(canvasId.replace("Chart", "Legend"));
    if (legend) {
      legend.innerHTML = entries.map(([label, value], index) => {
        const pct = total ? (value / total) * 100 : 0;
        return `
          <div class="legend-item">
            <span class="legend-swatch" style="background:${SUMMARY_COLORS[index % SUMMARY_COLORS.length]}"></span>
            <span>${label}</span>
            <strong>${formatPercent(pct)}</strong>
          </div>
        `;
      }).join("");
    }
  }

  function drawSectorBarChart(chartId, coreEntries, sateEntries) {
    const canvas = document.getElementById(chartId);
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const rect = canvas.getBoundingClientRect();
    const ratio = window.devicePixelRatio || 1;
    canvas.width = rect.width || 760;
    canvas.height = rect.height || 280;
    canvas.width *= ratio;
    canvas.height *= ratio;
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

    const w = canvas.width / ratio;
    const h = canvas.height / ratio;
    const padding = { top: 25, right: 20, bottom: 70, left: 40 };
    const chartWidth = w - padding.left - padding.right;
    const chartHeight = h - padding.top - padding.bottom;

    const coreMap = Object.fromEntries(coreEntries || []);
    const sateMap = Object.fromEntries(sateEntries || []);
    const allLabels = [...new Set([...Object.keys(coreMap), ...Object.keys(sateMap)])].sort((a, b) => {
      const va = (coreMap[a] || 0) + (sateMap[a] || 0);
      const vb = (coreMap[b] || 0) + (sateMap[b] || 0);
      return vb - va;
    });

    const totalCore = (coreEntries || []).reduce((sum, [, value]) => sum + value, 0) || 1;
    const totalSate = (sateEntries || []).reduce((sum, [, value]) => sum + value, 0) || 1;

    ctx.clearRect(0, 0, w, h);
    if (!allLabels.length) {
      ctx.fillStyle = "#9ca3af";
      ctx.font = "14px sans-serif";
      ctx.fillText("No sector allocation data", 40, h / 2);
      return;
    }

    const maxPct = Math.max(...allLabels.map(label => {
      const corePct = totalCore ? ((coreMap[label] || 0) / totalCore) * 100 : 0;
      const satePct = totalSate ? ((sateMap[label] || 0) / totalSate) * 100 : 0;
      return Math.max(corePct, satePct);
    }), 1);

    const groupWidth = Math.max(18, chartWidth / allLabels.length);
    const barWidth = Math.min(20, groupWidth * 0.26);

    allLabels.forEach((label, idx) => {
      const xBase = padding.left + (idx * groupWidth) + 16;
      const corePct = totalCore ? ((coreMap[label] || 0) / totalCore) * 100 : 0;
      const satePct = totalSate ? ((sateMap[label] || 0) / totalSate) * 100 : 0;

      const coreHeight = (corePct / maxPct) * chartHeight;
      const sateHeight = (satePct / maxPct) * chartHeight;

      ctx.fillStyle = "#4ade80";
      ctx.fillRect(xBase, h - padding.bottom - coreHeight, barWidth, coreHeight);

      ctx.fillStyle = "#60a5fa";
      ctx.fillRect(xBase + barWidth + 8, h - padding.bottom - sateHeight, barWidth, sateHeight);

      ctx.fillStyle = "#94a3b8";
      ctx.font = "11px sans-serif";
      ctx.textAlign = "center";
      const labelText = label.length > 11 ? label.substring(0, 11) + "…" : label;
      ctx.fillText(labelText, xBase + (barWidth + 8) / 2 + 5, h - padding.bottom + 18);
    });

    ctx.fillStyle = "#dbeafe";
    ctx.font = "11px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("Core", padding.left, 14);
    ctx.fillStyle = "#a5f3fc";
    ctx.fillRect(padding.left + 42, 6, 12, 12);
    ctx.fillStyle = "#dbeafe";
    ctx.fillText("Sate", padding.left + 62, 14);

    const legend = document.getElementById("sectorBarLegend");
    if (legend) {
      legend.innerHTML = `
        <div class="legend-item"><span class="legend-swatch" style="background:#4ade80"></span><span>Core</span></div>
        <div class="legend-item"><span class="legend-swatch" style="background:#60a5fa"></span><span>Sate</span></div>
      `;
    }
  }

  function drawTrendChart(chartId, coreRows, sateRows) {
    const canvas = document.getElementById(chartId);
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const rect = canvas.getBoundingClientRect();
    const ratio = window.devicePixelRatio || 1;
    canvas.width = rect.width || 760;
    canvas.height = rect.height || 280;
    canvas.width *= ratio;
    canvas.height *= ratio;
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

    const w = canvas.width / ratio;
    const h = canvas.height / ratio;
    const padding = { top: 24, right: 24, bottom: 40, left: 52 };
    const chartW = w - padding.left - padding.right;
    const chartH = h - padding.top - padding.bottom;

    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padding.left, padding.top);
    ctx.lineTo(padding.left, h - padding.bottom);
    ctx.lineTo(w - padding.right, h - padding.bottom);
    ctx.stroke();

    const pointsByFolio = [
      { label: "Core", color: "#4ade80", values: coreRows },
      { label: "Sate", color: "#60a5fa", values: sateRows },
    ];

    const allPoints = [...coreRows, ...sateRows];
    if (!allPoints.length) {
      ctx.fillStyle = "#9ca3af";
      ctx.font = "14px sans-serif";
      ctx.fillText("No trend data", 40, h / 2);
      return;
    }

    const xMin = Math.min(...allPoints.map(p => p.ic));
    const xMax = Math.max(...allPoints.map(p => p.ic), xMin + 1);
    const yMin = Math.min(...allPoints.map(p => p.pnl));
    const yMax = Math.max(...allPoints.map(p => p.pnl), yMin + 1);

    function mapX(v) {
      return padding.left + ((v - xMin) / (xMax - xMin || 1)) * chartW;
    }

    function mapY(v) {
      return h - padding.bottom - ((v - yMin) / (yMax - yMin || 1)) * chartH;
    }

    ctx.fillStyle = "#94a3b8";
    ctx.font = "11px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("IC %", w / 2, h - 10);
    ctx.save();
    ctx.translate(16, h / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText("PnL", 0, 0);
    ctx.restore();

    pointsByFolio.forEach(({ label, color, values }) => {
      if (!values.length) return;
      const slope = values.length > 1 ? (() => {
        const xs = values.map(v => v.ic);
        const ys = values.map(v => v.pnl);
        const xMean = xs.reduce((a, b) => a + b, 0) / xs.length;
        const yMean = ys.reduce((a, b) => a + b, 0) / ys.length;
        const num = xs.reduce((sum, x, i) => sum + (x - xMean) * (ys[i] - yMean), 0);
        const den = xs.reduce((sum, x) => sum + (x - xMean) ** 2, 0);
        return den ? num / den : 0;
      })() : 0;

      const startX = Math.min(...values.map(v => v.ic));
      const endX = Math.max(...values.map(v => v.ic));
      const intercept = values.reduce((sum, v) => sum + v.pnl, 0) / values.length - slope * (values.reduce((sum, v) => sum + v.ic, 0) / values.length);

      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(mapX(startX), mapY(slope * startX + intercept));
      ctx.lineTo(mapX(endX), mapY(slope * endX + intercept));
      ctx.stroke();

      values.forEach(point => {
        const x = mapX(point.ic);
        const y = mapY(point.pnl);
        ctx.beginPath();
        ctx.fillStyle = color;
        ctx.arc(x, y, 4.5, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.fillStyle = color;
      ctx.font = "12px sans-serif";
      ctx.fillText(label, w - 120 + (label === "Core" ? 0 : 42), padding.top + (label === "Core" ? 18 : 36));
    });
  }

  function renderSummaryCards(summary) {
    const cardsEl = document.getElementById("summaryCards");
    if (!cardsEl) return;

    const cards = ["Core", "Sate"].map(folio => {
      const data = summary[folio];
      const pnlTone = data.totalPnL >= 0 ? "profit" : "loss";
      return `
        <div class="summary-card ${pnlTone}">
          <div class="summary-card-label">${folio}</div>
          <div class="summary-card-row">
            <span>Invested Capital</span>
            <strong>${formatCurrency(data.totalInvested)}</strong>
          </div>
          <div class="summary-card-row">
            <span>Current Value</span>
            <strong>${formatCurrency(data.totalCurrentValue)}</strong>
          </div>
          <div class="summary-card-row">
            <span>PnL</span>
            <strong>${formatSigned(data.totalPnL)}</strong>
          </div>
        </div>
      `;
    }).join("");

    cardsEl.innerHTML = cards;
  }

  function renderSummaryDashboard(rows) {
    const summary = buildSummary(rows);
    renderSummaryCards(summary);

    ["Core", "Sate"].forEach(folio => {
      const chartEntries = summary[folio].marketCaps;
      const totalMarketCap = chartEntries.reduce((sum, [, value]) => sum + value, 0) || 1;
      drawPieChart(`${folio.toLowerCase()}PieChart`, chartEntries, totalMarketCap, folio);
    });

    drawSectorBarChart("sectorBarChart", summary.Core.sectors, summary.Sate.sectors);
    drawTrendChart("trendChart", summary.Core.trend, summary.Sate.trend);
  }

  if (window.registerTabs) {
    window.registerTabs(function (addTab) {
      fetch(SUMMARY_CSV)
        .then(response => response.text())
        .then(text => {
          const rows = parseCSV(text);
          addTab("Summary", () => {
            document.getElementById("summaryFeature").style.display = "block";
            renderSummaryDashboard(rows);
          });
        })
        .catch(() => {
          addTab("Summary", () => {
            document.getElementById("summaryFeature").style.display = "block";
            const cards = document.getElementById("summaryCards");
            if (cards) cards.innerHTML = "<div class='summary-empty'>Portfolio report not available.</div>";
          });
        });
    });
  }

  document.addEventListener("DOMContentLoaded", () => {
    const summaryFeature = document.getElementById("summaryFeature");
    if (summaryFeature && !summaryFeature.dataset.bound) {
      summaryFeature.dataset.bound = "1";
    }
  });
})();
</script>

<style>
  #summaryFeature {
    width: 100%;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
  }

  .summary-shell {
    padding: 18px 20px 32px;
  }

  .summary-header {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 16px;
  }

  .summary-header h2 {
    margin: 0;
    font-size: 28px;
    letter-spacing: 0.5px;
  }

  .summary-subtitle {
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  .summary-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
    margin-bottom: 18px;
  }

  .summary-card {
    background: var(--panel);
    border: 1px solid var(--grid);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
  }

  .summary-card.profit {
    border-color: rgba(74, 222, 128, 0.4);
  }

  .summary-card.loss {
    border-color: rgba(248, 113, 113, 0.4);
  }

  .summary-card-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .summary-card-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 13px;
    padding: 6px 0;
    border-bottom: 1px solid rgba(148, 163, 184, 0.12);
  }

  .summary-card-row:last-child {
    border-bottom: none;
  }

  .summary-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(320px, 1fr));
    gap: 16px;
  }

  .chart-card {
    background: var(--panel);
    border: 1px solid var(--grid);
    border-radius: 14px;
    padding: 14px;
    min-height: 300px;
  }

  .wide-card {
    grid-column: span 2;
  }

  .chart-title {
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .chart-card canvas {
    display: block;
    width: 100%;
    max-width: 100%;
    height: 260px;
    border-radius: 8px;
    background: rgba(15, 23, 42, 0.08);
  }

  .wide-card canvas {
    height: 280px;
  }

  .chart-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 12px;
    margin-top: 12px;
    font-size: 12px;
    color: var(--text);
  }

  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: rgba(148, 163, 184, 0.08);
    border: 1px solid rgba(148, 163, 184, 0.14);
    border-radius: 999px;
    padding: 5px 8px;
  }

  .legend-swatch {
    width: 10px;
    height: 10px;
    display: inline-block;
    border-radius: 50%;
  }

  .summary-empty {
    padding: 20px;
    text-align: center;
    color: var(--muted);
  }

  @media (max-width: 900px) {
    .summary-grid {
      grid-template-columns: 1fr;
    }

    .wide-card {
      grid-column: span 1;
    }
  }
</style>

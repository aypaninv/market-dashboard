<!-- ===================== SECTOR FEATURE ===================== -->

<div id="sectorFeature" style="display:none">
  <div class="update-time" id="updateTime_sector"></div>
  <div class="content" id="sectorContent">
    <div id="sectorSummaryView">
      <div id="sectorSections"></div>
    </div>

    <div id="sectorDrilldownView" style="display:none">
      <div style="margin-bottom:10px; display:flex; align-items:center; gap:10px;">
        <button id="sectorBackBtn" type="button">Back</button>
        <div id="sectorDrilldownTitle" style="font-weight:700;"></div>
      </div>
      <div id="sectorDrilldownSections"></div>
    </div>
  </div>
</div>

<script>
const CSV_SECTOR = "technical_sector_data.csv";
const CSV_SYMBOL_TECH = "technical_symbol_data.csv";
const SECTOR_RSI_FILES = {
  D: "nse_data/sector_daily.csv",
  W: "nse_data/sector_weekly.csv",
  M: "nse_data/sector_monthly.csv",
};
const SECTOR_RSI_VALUE_COL = { D: "D_RSI", W: "W_RSI", M: "M_RSI" };

const COLS_SECTOR = [
  "Sector", "Chart", "D_RSI", "W_RSI", "M_RSI"
];

const COLS_SECTOR_DRILLDOWN = [
  "Symbol", "Chart", "MarketCap",
  "DD_ATH", "DD_52W",
  "D_BO", "W_BO", "M_BO",
  "W_SL", "M_SL", "W_PSL", "M_PSL",
  "W_CHG", "M_CHG",
  "Close"
];

let sectorRows = [];
let symbolRows = [];
let sectorLoaded = false;
let sectorSortState = {};
let sectorDrillSortState = {};
let sectorRsiSeriesCache = {};
let sectorRsiState = { sector: "", tf: "D" };

function openTVChartSector(symbol) {
  window.open(`https://in.tradingview.com/chart/?symbol=NSE:${encodeURIComponent(symbol)}`, "_blank");
}

function parseCSVSector(text) {
  const lines = text.trim().split("\n");
  const headers = lines[0].split(",");
  return lines.slice(1).map(r => {
    const vals = r.split(",");
    const obj = {};
    headers.forEach((h, i) => obj[h] = vals[i] ?? "");
    return obj;
  });
}

function sortSectorRows(rows, col, asc) {
  return window.sortRowsByColumn(rows, col, asc);
}

function renderSectorSummary() {
  const container = document.getElementById("sectorSections");
  container.innerHTML = "";

  const table = document.createElement("table");
  drawSectorTable(table, sectorRows);

  const wrapper = document.createElement("div");
  wrapper.className = "portfolio-dropdown-content";
  wrapper.appendChild(table);
  container.appendChild(wrapper);

  document.getElementById("sectorSummaryView").style.display = "block";
  document.getElementById("sectorDrilldownView").style.display = "none";
}

function drawSectorTable(table, rows) {
  table.innerHTML = "";

  const sortInfo = sectorSortState.summary;
  const data = sortInfo ? sortSectorRows(rows, sortInfo.col, sortInfo.asc) : rows;

  if (!data.length) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.className = "text";
    td.colSpan = COLS_SECTOR.length;
    td.innerText = "No data";
    tr.appendChild(td);
    table.appendChild(tr);
    return;
  }

  const tr = document.createElement("tr");
  COLS_SECTOR.forEach(h => {
    if (h !== "Chart" && !(h in data[0])) return;
    const th = document.createElement("th");
    th.innerText = h;
    if (h !== "Chart") {
      th.onclick = () => {
        const existing = sectorSortState.summary;
        const asc = existing && existing.col === h ? !existing.asc : true;
        sectorSortState.summary = { col: h, asc };
        renderSectorSummary();
      };
    }
    if (h === "Sector") th.classList.add("symbol-col");
    tr.appendChild(th);
  });
  table.appendChild(tr);

  data.forEach(r => {
    const row = document.createElement("tr");
    COLS_SECTOR.forEach(h => {
      if (h !== "Chart" && !(h in r)) return;
      const td = document.createElement("td");
      const v = r[h];

      if (h === "Sector") {
        td.className = "symbol-col text";
        td.innerHTML = `<a href="#" onclick="openSectorDrilldown('${String(v).replace(/'/g, "\\'")}')">${v}</a>`;
      } else if (h === "Chart") {
        td.className = "text";
        ["D", "W", "M"].forEach(tf => {
          const a = document.createElement("a");
          a.href = "#";
          a.textContent = tf;
          a.className = "chart-icon chart-icon-" + tf;
          a.onclick = e => {
            e.preventDefault();
            e.stopPropagation();
            openSectorRsiChart(r.Sector, tf);
          };
          td.appendChild(a);
        });
      } else {
        td.innerText = v;
        td.className = (!isNaN(v) && v !== "") ? "num" : "text";
      }

      if (h !== "Sector" && h !== "Chart") {
        const num = parseFloat(v);
        if (!isNaN(num)) {
          if (num >= 70) td.classList.add("cell-teal");
          else if (num <= 30) td.classList.add("cell-red");
          else td.classList.add("cell-green");
        }
      }

      row.appendChild(td);
    });
    table.appendChild(row);
  });
}

function capBucket(v) {
  const x = String(v || "").toLowerCase();
  if (x.includes("large")) return "Large Cap";
  if (x.includes("mid")) return "Mid Cap";
  if (x.includes("small")) return "Small Cap";
  return "Other";
}

function groupedByCap(rows) {
  const groups = {
    "Large Cap": [],
    "Mid Cap": [],
    "Small Cap": [],
    "Other": [],
  };

  rows.forEach(r => {
    groups[capBucket(r.MarketCap)].push(r);
  });

  return groups;
}

function drawSectorDrilldownTable(table, rows, key) {
  table.innerHTML = "";

  const sortInfo = sectorDrillSortState[key];
  const data = sortInfo ? sortSectorRows(rows, sortInfo.col, sortInfo.asc) : rows;

  if (!data.length) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.className = "text";
    td.colSpan = COLS_SECTOR_DRILLDOWN.length;
    td.innerText = "No data";
    tr.appendChild(td);
    table.appendChild(tr);
    return;
  }

  const tr = document.createElement("tr");
  COLS_SECTOR_DRILLDOWN.forEach(h => {
    if (h !== "Chart" && !(h in data[0])) return;
    const th = document.createElement("th");
    th.innerText = h;
    if (h !== "Chart") {
      th.onclick = () => {
        const existing = sectorDrillSortState[key];
        const asc = existing && existing.col === h ? !existing.asc : true;
        sectorDrillSortState[key] = { col: h, asc };
        openSectorDrilldown(document.getElementById("sectorDrilldownTitle").dataset.sectorName);
      };
    }
    if (h === "Symbol") th.classList.add("symbol-col");
    tr.appendChild(th);
  });
  table.appendChild(tr);

  data.forEach(r => {
    const row = document.createElement("tr");
    COLS_SECTOR_DRILLDOWN.forEach(h => {
      if (h !== "Chart" && !(h in r)) return;
      const td = document.createElement("td");
      const v = r[h];

      if (h === "Symbol") {
        td.className = "symbol-col text";
        td.innerHTML = `<a href="#" onclick="openTVChartSector('${v}')">${v}</a>`;
      } else if (h === "Chart") {
        td.className = "text";
        ["W", "M"].forEach(tf => {
          const a = document.createElement("a");
          a.href = "#";
          a.textContent = tf;
          a.className = "chart-icon chart-icon-" + tf;
          a.onclick = e => { e.preventDefault(); e.stopPropagation(); openCandleChart(r.Symbol, tf); };
          td.appendChild(a);
        });
      } else {
        if (["D_BO", "W_BO", "M_BO"].includes(h) && v !== "") {
          td.innerText = Math.round(parseFloat(v));
        } else {
          td.innerText = v;
        }
        td.className = (!isNaN(v) && v !== "") ? "num" : "text";
      }

      if (h !== "Chart") {
        window.applyCommonCellClasses(td, h, v, {
          chgColumns: ["D_CHG", "W_CHG", "M_CHG"],
          slColumns: ["W_SL", "M_SL", "W_PSL", "M_PSL"],
        });
      }

      row.appendChild(td);
    });
    table.appendChild(row);
  });
}

window.openSectorDrilldown = function(sectorName) {
  const rows = symbolRows.filter(r => String(r.Sector || "") === String(sectorName || ""));
  const groups = groupedByCap(rows);
  const container = document.getElementById("sectorDrilldownSections");
  container.innerHTML = "";

  const title = document.getElementById("sectorDrilldownTitle");
  title.innerText = `${sectorName} (${rows.length})`;
  title.dataset.sectorName = sectorName;

  ["Large Cap", "Mid Cap", "Small Cap", "Other"].forEach(groupName => {
    const list = groups[groupName] || [];

    const details = document.createElement("details");
    details.className = "portfolio-dropdown";
    details.open = groupName !== "Other";

    const summary = document.createElement("summary");
    summary.textContent = `${groupName} (${list.length})`;
    summary.style.cursor = "pointer";
    summary.onclick = (e) => {
      e.preventDefault();
      details.open = !details.open;
    };
    details.appendChild(summary);

    const wrapper = document.createElement("div");
    wrapper.className = "portfolio-dropdown-content";

    const table = document.createElement("table");
    drawSectorDrilldownTable(table, list, groupName);

    wrapper.appendChild(table);
    details.appendChild(wrapper);
    container.appendChild(details);
  });

  document.getElementById("sectorSummaryView").style.display = "none";
  document.getElementById("sectorDrilldownView").style.display = "block";
};

function ensureSectorRsiOverlay() {
  if (document.getElementById("sectorRsiOverlay")) return;

  const overlay = document.createElement("div");
  overlay.id = "sectorRsiOverlay";
  overlay.style.cssText = "display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:2000;align-items:center;justify-content:center;";
  overlay.innerHTML = `
    <div style="background:var(--card-bg,#fff);color:var(--text,#111);width:min(900px,96vw);border-radius:12px;padding:12px;border:1px solid var(--grid,#ddd);">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
        <div id="sectorRsiTitle" style="font-weight:700"></div>
        <div style="display:flex;gap:6px;align-items:center;">
          <button id="sectorRsiTfD" type="button">D</button>
          <button id="sectorRsiTfW" type="button">W</button>
          <button id="sectorRsiTfM" type="button">M</button>
          <button id="sectorRsiClose" type="button">Close</button>
        </div>
      </div>
      <canvas id="sectorRsiCanvas" style="width:100%;height:420px;margin-top:10px;"></canvas>
    </div>`;

  document.body.appendChild(overlay);

  document.getElementById("sectorRsiClose").onclick = () => {
    document.getElementById("sectorRsiOverlay").style.display = "none";
  };

  ["D", "W", "M"].forEach(tf => {
    document.getElementById("sectorRsiTf" + tf).onclick = () => {
      if (!sectorRsiState.sector) return;
      openSectorRsiChart(sectorRsiState.sector, tf);
    };
  });
}

function parseSectorRsiSeries(text, valueCol) {
  const rows = parseCSVSector(text);
  const bySector = {};
  rows.forEach(r => {
    const sector = String(r.Sector || "").trim();
    const date = String(r.Date || "").trim();
    const val = parseFloat(r[valueCol]);
    if (!sector || !date || Number.isNaN(val)) return;
    if (!bySector[sector]) bySector[sector] = [];
    bySector[sector].push({ Date: date, RSI: val });
  });

  Object.keys(bySector).forEach(sector => {
    bySector[sector].sort((a, b) => a.Date.localeCompare(b.Date));
  });

  return bySector;
}

function loadSectorRsiSeries(tf) {
  const key = "RSI:" + tf;
  if (sectorRsiSeriesCache[key]) return Promise.resolve(sectorRsiSeriesCache[key]);

  const file = SECTOR_RSI_FILES[tf];
  const col = SECTOR_RSI_VALUE_COL[tf];
  return fetch(file)
    .then(r => { if (!r.ok) throw new Error(String(r.status)); return r.text(); })
    .then(text => {
      const data = parseSectorRsiSeries(text, col);
      sectorRsiSeriesCache[key] = data;
      return data;
    });
}

function setSectorRsiTfButtons(tf) {
  ["D", "W", "M"].forEach(k => {
    const btn = document.getElementById("sectorRsiTf" + k);
    if (!btn) return;
    const active = k === tf;
    btn.style.background = active ? "var(--accent,#2563eb)" : "transparent";
    btn.style.color = active ? "#fff" : "var(--text,#111)";
    btn.style.borderColor = active ? "var(--accent,#2563eb)" : "var(--grid,#ddd)";
  });
}

function drawSectorRsiChart(canvas, points) {
  const ctx = canvas.getContext("2d");
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.max(640, Math.floor(rect.width));
  canvas.height = 420;

  const W = canvas.width;
  const H = canvas.height;
  const P = { l: 48, r: 16, t: 18, b: 28 };
  const cW = W - P.l - P.r;
  const cH = H - P.t - P.b;
  const dark = document.body.classList.contains("dark");
  const bg = dark ? "#121722" : "#ffffff";
  const grid = dark ? "#2a3242" : "#d9dfe8";
  const txt = dark ? "#8f9bb3" : "#6b7280";

  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  const y = (v) => P.t + (100 - v) * (cH / 100);

  [70, 55, 30].forEach(level => {
    ctx.strokeStyle = level === 70 ? "#ef4444" : (level === 30 ? "#10b981" : grid);
    ctx.setLineDash(level === 55 ? [3, 3] : [6, 4]);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(P.l, y(level));
    ctx.lineTo(W - P.r, y(level));
    ctx.stroke();

    ctx.setLineDash([]);
    ctx.fillStyle = txt;
    ctx.font = "12px monospace";
    ctx.fillText(String(level), 8, y(level) + 4);
  });

  ctx.strokeStyle = grid;
  ctx.strokeRect(P.l, P.t, cW, cH);

  if (!points || !points.length) {
    ctx.fillStyle = txt;
    ctx.font = "14px monospace";
    ctx.fillText("No RSI history", P.l + 12, P.t + 28);
    return;
  }

  const n = points.length;
  const px = (i) => P.l + (i * cW) / Math.max(1, n - 1);

  ctx.beginPath();
  points.forEach((p, i) => {
    const x = px(i);
    const yy = y(Math.max(0, Math.min(100, p.RSI)));
    if (i === 0) ctx.moveTo(x, yy);
    else ctx.lineTo(x, yy);
  });
  ctx.lineWidth = 2;
  ctx.strokeStyle = "#3b82f6";
  ctx.stroke();

  const last = points[n - 1];
  const lx = px(n - 1);
  const ly = y(Math.max(0, Math.min(100, last.RSI)));
  ctx.fillStyle = "#3b82f6";
  ctx.beginPath();
  ctx.arc(lx, ly, 3.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = txt;
  ctx.font = "12px monospace";
  ctx.fillText(last.Date, P.l + 4, H - 8);
  ctx.fillText(`RSI: ${last.RSI.toFixed(2)}`, W - P.r - 110, P.t + 14);
}

window.openSectorRsiChart = function(sectorName, tf) {
  ensureSectorRsiOverlay();
  sectorRsiState = { sector: sectorName, tf };
  const title = document.getElementById("sectorRsiTitle");
  title.textContent = `${sectorName} RSI (${tf})`;
  setSectorRsiTfButtons(tf);
  document.getElementById("sectorRsiOverlay").style.display = "flex";

  loadSectorRsiSeries(tf)
    .then(data => {
      const points = data[sectorName] || [];
      drawSectorRsiChart(document.getElementById("sectorRsiCanvas"), points);
    })
    .catch(() => {
      drawSectorRsiChart(document.getElementById("sectorRsiCanvas"), []);
    });
};

function updateSectorTime() {
  fetch(CSV_SECTOR, { method: "HEAD" })
    .then(res => {
      const d = new Date(res.headers.get("Last-Modified"));
      document.getElementById("updateTime_sector").innerText =
        d.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", hour12: false }) +
        " / " +
        d.toLocaleDateString("en-IN", { year: "numeric", month: "short", day: "2-digit" });
    });
}

function loadSectorData() {
  if (sectorLoaded) return Promise.resolve();

  return Promise.all([
    fetch(CSV_SECTOR).then(r => r.text()),
    fetch(CSV_SYMBOL_TECH).then(r => r.text()),
  ]).then(([sectorText, symbolText]) => {
    sectorRows = parseCSVSector(sectorText);
    symbolRows = parseCSVSector(symbolText);
    sectorLoaded = true;
    updateSectorTime();
    ensureSectorRsiOverlay();

    const backBtn = document.getElementById("sectorBackBtn");
    if (backBtn && !backBtn.dataset.bound) {
      backBtn.onclick = () => renderSectorSummary();
      backBtn.dataset.bound = "1";
    }
  });
}

window.registerTabs(addTab => {
  addTab("Sector", () => {
    hideAllFeatures();
    document.getElementById("sectorFeature").style.display = "block";
    loadSectorData().then(() => renderSectorSummary());
  });
});
</script>

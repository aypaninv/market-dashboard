<!-- ===================== SECTOR FEATURE ===================== -->

<div id="sectorFeature" style="display:none">
  <div class="update-time" id="updateTime_sector"></div>
  <div class="content">
    <button id="backBtn" style="display:none" onclick="showSectorSummary()">⬅ Back</button>
    <table id="sectorTable"></table>
  </div>
</div>

<script>
const SECTOR_CSV = "technical_sector_data.csv";
const SYMBOL_CSV = "technical_symbol_data.csv";

const SYMBOL_COL_MAP = {
  "D_MACD": "Day_MACD",
  "W_MACD": "Week_MACD",
  "M_MACD": "Month_MACD",
  "D_RSI": "Day_RSI",
  "W_RSI": "Week_RSI",
  "M_RSI": "Month_RSI",
  "CurPrice": "Close"
};

let sectorData = [];
let curSector = [];
let sectorSortState = {};

let symbolData = [];
let curSymbols = [];
let symbolSortState = {};

function parseCSV(text) {
  const lines = text.trim().split("\n");
  const headers = lines[0].split(",");
  return lines.slice(1).map(row => {
    const v = row.split(",");
    let o = {};
    headers.forEach((h, i) => o[h] = v[i] ?? "");
    return o;
  });
}

window.registerTabs(addTab => {
  addTab("Sector", () => {
    hideAllFeatures();
    document.getElementById("sectorFeature").style.display = "block";
    loadSectorSummary();
  });
});

function loadSectorSummary() {
  document.getElementById("backBtn").style.display = "none";

  fetch(SECTOR_CSV)
    .then(r => r.text())
    .then(t => {
      sectorData = parseCSV(t);
      renderSector(sectorData);
      updateSectorTime();
    });
}

function renderSector(data) {
  curSector = [...data];
  sectorSortState = {};

  curSector.sort((a, b) => {
    const x = parseFloat(a.W_MACD);
    const y = parseFloat(b.W_MACD);
    if (x > 0 && y <= 0) return -1;
    if (x <= 0 && y > 0) return 1;
    return x - y;
  });

  drawSector(curSector);
}

function drawSector(data) {
  const table = document.getElementById("sectorTable");
  table.innerHTML = "";

  const cols = ["Sector","4H_MACD","D_MACD","W_MACD","M_MACD"];

  const tr = document.createElement("tr");
  cols.forEach(h => {
    const th = document.createElement("th");
    th.innerText = h;
    th.onclick = () => sortSector(h);
    if (h === "Sector") th.classList.add("symbol-col");
    tr.appendChild(th);
  });
  table.appendChild(tr);

  data.forEach(r => {
    const row = document.createElement("tr");

    cols.forEach(h => {
      const td = document.createElement("td");
      const v = r[h];

      if (h === "Sector") {
        td.className = "symbol-col text";
        td.innerText = v;
        td.onclick = () => showSectorStocks(v);
        td.style.cursor = "pointer";
      } else {
        td.innerText = parseInt(v, 10);
        td.className = "num";
      }

      if (h.includes("MACD"))
        td.classList.add(parseFloat(v) >= 0 ? "green" : "red");

      row.appendChild(td);
    });

    table.appendChild(row);
  });
}

function sortSector(col) {
  const asc = !sectorSortState[col];
  sectorSortState = { [col]: asc };

  curSector.sort((a, b) =>
    asc ? parseFloat(a[col]) - parseFloat(b[col])
        : parseFloat(b[col]) - parseFloat(a[col])
  );

  drawSector(curSector);
}

function showSectorStocks(sector) {
  document.getElementById("backBtn").style.display = "inline";

  if (!symbolData.length) {
    fetch(SYMBOL_CSV)
      .then(r => r.text())
      .then(t => {
        symbolData = parseCSV(t);
        renderSectorStocks(sector);
      });
  } else {
    renderSectorStocks(sector);
  }
}

function renderSectorStocks(sector) {
  curSymbols = symbolData.filter(r => r.Sector === sector);
  symbolSortState = {};
  drawSymbols(curSymbols);
}

function drawSymbols(data) {
  const table = document.getElementById("sectorTable");
  table.innerHTML = "";

  const cols = [
    "Symbol","DD_High",
    "4H_MACD","D_MACD","W_MACD","M_MACD",
    "CurPrice","MarketCap","Sector"
  ];

  const tr = document.createElement("tr");
  cols.forEach(h => {
    const th = document.createElement("th");
    th.innerText = h;
    th.onclick = () => sortSymbols(h);
    if (h === "Symbol") th.classList.add("symbol-col");
    tr.appendChild(th);
  });
  table.appendChild(tr);

  data.forEach(r => {
    const row = document.createElement("tr");

    cols.forEach(h => {
      const td = document.createElement("td");
      const key = SYMBOL_COL_MAP[h] || h;
      const v = r[key];

      if (h === "Symbol") {
        td.className = "symbol-col text";
        td.innerHTML = `<a href="#" onclick="openChart('${v}')">${v}</a>`;
      } else {
        td.innerText = v;
        td.className = (!isNaN(v) && v !== "") ? "num" : "text";
      }

      if (h === "DD_High" && parseFloat(v) < -16) td.classList.add("red");
      if (h.includes("MACD"))
        td.classList.add(parseFloat(v) >= 0 ? "green" : "red");

      row.appendChild(td);
    });

    table.appendChild(row);
  });
}

function sortSymbols(col) {
  const asc = !symbolSortState[col];
  symbolSortState = { [col]: asc };
  const key = SYMBOL_COL_MAP[col] || col;

  curSymbols.sort((a, b) =>
    asc ? parseFloat(a[key]) - parseFloat(b[key])
        : parseFloat(b[key]) - parseFloat(a[key])
  );

  drawSymbols(curSymbols);
}

function openChart(symbol) {
  window.open(
    `https://in.tradingview.com/chart/?symbol=NSE:${encodeURIComponent(symbol)}`,
    "_blank"
  );
}

function showSectorSummary() {
  loadSectorSummary();
}

function updateSectorTime() {
  fetch(SECTOR_CSV, { method: "HEAD" })
    .then(res => {
      const d = new Date(res.headers.get("Last-Modified"));
      document.getElementById("updateTime_sector").innerText =
        d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",hour12:false}) +
        " / " +
        d.toLocaleDateString("en-IN",{year:"numeric",month:"short",day:"2-digit"});
    });
}
</script>

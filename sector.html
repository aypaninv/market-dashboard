<!-- ===================== SECTOR TECHNICAL REPORT ===================== -->

<style>
.update-time {
  position: fixed;
  top: 6px;
  right: 10px;
  font-size: 11px;
  color: #bbb;
  z-index: 999;
}

.content {
  height: calc(100vh - 60px);
  overflow: auto;
  padding: 8px;
}

button {
  margin-bottom: 6px;
  padding: 4px 8px;
}

table {
  border-collapse: collapse;
  width: max-content;
  font-size: 13px;
}

th, td {
  border: 1px solid #ccc;
  padding: 6px 8px;
  background: white;
}

th {
  background: #f0f0f0;
  position: sticky;
  top: 0;
  cursor: pointer;
}

.green { background: #c8f7c5 !important; }
.red   { background: #f7c5c5 !important; }
</style>

<div id="sectorFeature" style="display:none">
  <div class="update-time" id="updateTime_sector"></div>
  <div class="content">

    <button id="backBtn" style="display:none" onclick="showSectorSummary()">⬅ Back</button>

    <table id="sectorTable"></table>
  </div>
</div>

<script>
const SECTOR_CSV = "technical_sector_data.csv";
const SYMBOL_CSV = "technical_symbol_data.csv";

let sectorData = [];
let symbolData = [];

/* ---------- CSV Parser ---------- */
function parseCSV(text) {
  const lines = text.trim().split("\n");
  const headers = lines[0].split(",");
  return lines.slice(1).map(row => {
    const v = row.split(",");
    let o = {};
    headers.forEach((h, i) => o[h] = v[i] ?? "");
    return o;
  });
}

/* ---------- Register Tab ---------- */
window.registerTabs(addTab => {
  addTab("Sector", () => {
    hideOthers();
    document.getElementById("sectorFeature").style.display = "block";
    loadSectorSummary();
  });
});

function hideOthers() {
  ["portfolioFeature","tfwatchFeature","trendFeature"]
    .forEach(id => document.getElementById(id)?.style.setProperty("display","none"));
}

/* ---------- Load Sector Summary ---------- */
function loadSectorSummary() {
  document.getElementById("backBtn").style.display = "none";

  fetch(SECTOR_CSV)
    .then(r => r.text())
    .then(t => {
      sectorData = parseCSV(t);
      renderSectorTable(sectorData);
      updateTime(SECTOR_CSV);
    });
}

/* ---------- Render Sector Table ---------- */
function renderSectorTable(data) {
  const table = document.getElementById("sectorTable");
  table.innerHTML = "";

  const cols = ["Sector","D_MACD","W_MACD","M_MACD","D_RSI","W_RSI","M_RSI"];

  table.appendChild(buildHeader(cols));

  data.forEach(r => {
    const tr = document.createElement("tr");

    cols.forEach(c => {
      const td = document.createElement("td");
      td.innerText = r[c];

      if (c === "Sector") {
        td.style.cursor = "pointer";
        td.onclick = () => showSectorStocks(r[c]);
      }

      if (c.includes("MACD")) td.className = r[c] >= 0 ? "green" : "red";
      if (c.includes("RSI")) td.className = r[c] >= 53 ? "green" : "red";

      tr.appendChild(td);
    });

    table.appendChild(tr);
  });
}

/* ---------- Drilldown ---------- */
function showSectorStocks(sector) {
  document.getElementById("backBtn").style.display = "inline";

  if (!symbolData.length) {
    fetch(SYMBOL_CSV)
      .then(r => r.text())
      .then(t => {
        symbolData = parseCSV(t);
        renderSectorStocks(sector);
      });
  } else {
    renderSectorStocks(sector);
  }
}

function renderSectorStocks(sector) {
  const table = document.getElementById("sectorTable");
  table.innerHTML = "";

  const cols = [
    "Symbol","Folio","DD_High",
    "Day_MACD","Week_MACD","Month_MACD",
    "Day_RSI","Week_RSI","Month_RSI",
    "Close","MarketCap","Sector"
  ];

  table.appendChild(buildHeader(cols));

  symbolData
    .filter(r => r.Sector === sector)
    .forEach(r => {
      const tr = document.createElement("tr");
      cols.forEach(c => {
        const td = document.createElement("td");
        td.innerText = r[c] ?? "";
        tr.appendChild(td);
      });
      table.appendChild(tr);
    });
}

/* ---------- Helpers ---------- */
function buildHeader(cols) {
  const tr = document.createElement("tr");
  cols.forEach(c => {
    const th = document.createElement("th");
    th.innerText = c;
    tr.appendChild(th);
  });
  return tr;
}

function showSectorSummary() {
  loadSectorSummary();
}

function updateTime(csv) {
  fetch(csv, { method: "HEAD" })
    .then(res => {
      const d = new Date(res.headers.get("Last-Modified"));
      document.getElementById("updateTime_sector").innerText =
        d.toLocaleString("en-IN",{timeZone:"Asia/Kolkata"});
    });
}
</script>
